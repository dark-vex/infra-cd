creation_rules:
  # kubenuc production cluster — replace with actual age public key after `age-keygen`
  - path_regex: clusters/kubenuc/vars/.*\.sops\.yaml$
    age: age182k0gk669fkgkq697d86huftt94cfg7s9hq56jaj9qffwu9k648qyyx5dd

  # k8s-vms-daniele cluster — replace with actual age public key after `age-keygen`
  - path_regex: clusters/k8s-vms-daniele/vars/.*\.sops\.yaml$
    age: age10zqzjdvku9q2qpq34pqjvss9jarc86wyqxe07x6f0qd8c2w9tvss03awl3

  # k3s-rabbit cluster — replace with actual age public key after `age-keygen`
  - path_regex: clusters/k3s-rabbit/vars/.*\.sops\.yaml$
    age: age12tmgn4lmzp3u3ruzhzyghc7qzx3zk8nc0p44kryq88dfg72vufrsc4d0tw

  # k3s-rabbit 1password bootstrap secrets (adopting the pre-existing out-of-band
  # Helm-installed Connect server under GitOps; dedicated per-consumer token per
  # the CODE 1Password token-split plan)
  - path_regex: clusters/k3s-rabbit/apps/1password/secrets/.*\.sops\.yaml$
    age: age12tmgn4lmzp3u3ruzhzyghc7qzx3zk8nc0p44kryq88dfg72vufrsc4d0tw
    encrypted_regex: ^(data|stringData)$

  # oc-ampere cluster — replace with actual age public key after `age-keygen`
  - path_regex: clusters/oc-ampere/vars/.*\.sops\.yaml$
    age: age13fpkwl74k6lttn534vthcq08mr2r684067e2p9yw9h0w5j967g3qlsydgm

  # kubenuc-test cluster — replace with actual age public key after `age-keygen`
  - path_regex: clusters/kubenuc-test/vars/.*\.sops\.yaml$
    age: age1qwhpwjgw3c7trgrtjv7k309suma9l6qu8yrh4at80clrymrczvss8xq69u

  # k3s-prod-test cluster — replace with actual age public key after `age-keygen`
  - path_regex: clusters/k3s-prod-test/vars/.*\.sops\.yaml$
    age: age1we4kjkxtqxd6ne9tx458tw2jsswwfzll8rs6mjsa4g40zn8nj97qk9mf46

  # kubenuc 1password bootstrap secret
  - path_regex: clusters/kubenuc/apps/1password/secrets/.*\.sops\.yaml$
    age: age182k0gk669fkgkq697d86huftt94cfg7s9hq56jaj9qffwu9k648qyyx5dd
    encrypted_regex: ^(data|stringData)$

  # k8s-vms-daniele 1password bootstrap secret
  - path_regex: clusters/k8s-vms-daniele/apps/1password/secrets/.*\.sops\.yaml$
    age: age10zqzjdvku9q2qpq34pqjvss9jarc86wyqxe07x6f0qd8c2w9tvss03awl3
    encrypted_regex: ^(data|stringData)$

  # kubenuc-test 1password bootstrap secret (external consumer of kubenuc's Connect
  # server, dedicated per-consumer token per the CODE 1Password token-split plan)
  - path_regex: clusters/kubenuc-test/1password-secrets/secrets/.*\.sops\.yaml$
    age: age1qwhpwjgw3c7trgrtjv7k309suma9l6qu8yrh4at80clrymrczvss8xq69u
    encrypted_regex: ^(data|stringData)$

  # k3s-prod-test 1password bootstrap secret (external consumer of kubenuc's Connect
  # server, dedicated per-consumer token per the CODE 1Password token-split plan;
  # this cluster is only ever bootstrapped through CI's synthetic flow, so this
  # file/rule has no effect on the real committed root Kustomization used there)
  - path_regex: clusters/k3s-prod-test/1password-secrets/secrets/.*\.sops\.yaml$
    age: age1we4kjkxtqxd6ne9tx458tw2jsswwfzll8rs6mjsa4g40zn8nj97qk9mf46
    encrypted_regex: ^(data|stringData)$

  # Terraform DNS — Cloudflare zone IDs and DNS record definitions
  - path_regex: terraform/DNS/secrets\.sops\.yaml$
    age: age1gk3jk7r6hvvq4mef56zs2tq94y8dgpde75m7af9hd9mecjx0hvasd4ele5

  # Terraform NetBox — IP addresses and prefixes for on-prem inventory
  - path_regex: terraform/netbox/secrets\.sops\.yaml$
    age: age1qr309cc7z56xtqpamldfwjnx3fp8cyvxlwyf0zygmsyydu6gy49sfvz0kw

  # Terraform Cloudflare Tunnel — account ID, tunnel IDs, and ingress hostnames
  - path_regex: terraform/cloudflare-tunnel/secrets\.sops\.yaml$
    age: age1tce0mlehlddhnlsun7l2kd5mymuf5czk3dk8gs62u7vsxn76hfsq0ajkqv

  # ansible/ — Teleport host connection details (VM IPs/hostnames)
  - path_regex: ansible/.*\.sops\.(yaml|yml|json)$
    age: age13h7kx5mcfa0yn4mpf6udw39nup0sl4402mmemra9yfkymmscqd7s9grug2

  # Terraform Proxmox Rabbit (PSP) — VM/LXC hostnames
  - path_regex: terraform/proxmox/rabbit/secrets\.sops\.yaml$
    age: age1ygqcr24v9mnmmgaps0kascmh27j9qlk2dmz269lga06n3zjxdeps4znenj

  # Terraform Proxmox Gozzi/Hpelvisor (BIO) — VM/LXC hostnames
  - path_regex: terraform/proxmox/gozzi-hpelvisor/secrets\.sops\.yaml$
    age: age1macxjcxh0u58kwran0nap5sqlzja8f4wh6ud5d3uqcvkvzkae9wsldk0js

  # Terraform Proxmox EC200 (MXP) — LXC hostnames
  - path_regex: terraform/proxmox/ec200/secrets\.sops\.yaml$
    age: age1sw5cenyxcc4ckp6fnczmj74lauu8evadlvuynffc0xl35gdk0qnst7st9a

  # Terraform OCI test-vpn — instance display_name
  - path_regex: terraform/oci/test_vpn/secrets\.sops\.yaml$
    age: age1uh45nvz5ctxpmrthps3k2lskaljlpgwsdfjxt30qs7r83pdt3cfqjsfdcn

  # Terraform OCI ams-vpn (CODE-15) — instance display_name
  - path_regex: terraform/oci/ams_vpn/secrets\.sops\.yaml$
    age: age13adtcqgefuc6cy5e4hfl622gy8tr2q8hkm0klg0hdm2y4g2awe8qpeyv3a

  # Terraform AWS (CODE-20, draft) — S3 bucket names
  - path_regex: terraform/aws/secrets\.sops\.yaml$
    age: age1jndfvpfvsccn69e0lrg5c6e7nc48z7vwppqe9dre8p520y45le2skmu46g

  # Terraform Backblaze (CODE-20) — B2 bucket name. Deliberately shares
  # terraform/aws/'s age key/GitHub secret (SOPS_AGE_KEY_AWS) rather than a
  # dedicated one - an explicit exception to the "never shared across
  # stacks" convention below, made so this stack didn't need a new secret
  # provisioned before it could work.
  - path_regex: terraform/backblaze/secrets\.sops\.yaml$
    age: age1jndfvpfvsccn69e0lrg5c6e7nc48z7vwppqe9dre8p520y45le2skmu46g
