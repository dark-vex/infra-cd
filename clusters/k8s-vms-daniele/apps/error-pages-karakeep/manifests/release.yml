---
# One error-pages release per consuming namespace: Traefik rejects
# <ns>-<name>@kubernetescrd middleware references across namespaces unless
# allowCrossNamespace is on (k3s-bundled Traefik, not repo-managed), so the
# Middleware, Service and Ingress must all share a namespace.
#
# An Ingress opts in with:
#   traefik.ingress.kubernetes.io/router.middlewares: karakeep-error-pages@kubernetescrd
# Only opt in browser-facing Ingresses: statusCodes 400-599 replaces API/auth
# error bodies with the HTML page too.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: error-pages
  namespace: karakeep
spec:
  interval: 15m
  timeout: 5m
  maxHistory: 20
  chart:
    spec:
      chart: error-pages
      version: "4.2.5"
      sourceRef:
        kind: HelmRepository
        name: error-pages
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    traefikMiddleware:
      enabled: true
      statusCodes: ["400-599"]
    config:
      htmlTemplate:
        name: connection
    deployment:
      replicas: 1
      # Chart defaults plus seccompProfile (restricted PSA).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
