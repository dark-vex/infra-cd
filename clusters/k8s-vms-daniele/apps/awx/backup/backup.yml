---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: awx-backup
  namespace: awx
spec:
  schedule: "0 0 * * 0"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pgbackup
            image: eeshugerman/postgres-backup-s3:16@sha256:cfcaa57732c13d0724312a2eea1ad3e385f5ed049de3c626d1ef28ecc13cdddb
            imagePullPolicy: IfNotPresent
            # The image's scripts live in / and write db.dump into the working
            # directory, which readOnlyRootFilesystem forbids ("can't create
            # db.dump: Read-only file system": the weekly dump silently failed for
            # months, last success ~195 days before 2026-11-14). Run them from a
            # writable /tmp.
            command:
            - sh
            - -c
            - cp /run.sh /env.sh /backup.sh /tmp/ && cd /tmp && exec sh run.sh
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            env:
            - name: HOME
              value: /tmp
            - name: S3_REGION
              value: "eu-south-1"
            - name: POSTGRES_BACKUP_ALL
              value: "false"
            - name: POSTGRES_EXTRA_OPTS
              value: "--schema=public --blobs"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: awx-backup
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: awx-backup
                  key: S3_SECRET_ACCESS_KEY
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: awx-backup
                  key: S3_BUCKET
            - name: S3_PREFIX
              value: "awx-backup"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: awx-postgres-configuration
                  key: host
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: awx-postgres-configuration
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: awx-postgres-configuration
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: awx-postgres-configuration
                  key: password
            - name: BACKUP_KEEP_DAYS
              value: "60"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
          restartPolicy: OnFailure
