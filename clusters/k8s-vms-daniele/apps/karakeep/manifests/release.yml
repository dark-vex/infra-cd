---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
  namespace: karakeep
spec:
  interval: 15m
  timeout: 10m
  maxHistory: 20
  chart:
    spec:
      chart: karakeep
      version: "0.33.1"
      sourceRef:
        kind: HelmRepository
        name: karakeep-app
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  valuesFrom:
    - kind: Secret
      name: karakeep-nextauth-secret
      valuesKey: password
      targetPath: secrets.karakeep.stringData.NEXTAUTH_SECRET
    - kind: Secret
      name: karakeep-meili-master-key
      valuesKey: password
      targetPath: secrets.meilesearch.stringData.MEILI_MASTER_KEY
    - kind: Secret
      name: karakeep-openai-api-key
      valuesKey: password
      targetPath: secrets.karakeep.stringData.OPENAI_API_KEY
    - kind: Secret
      name: karakeep-openai-api-key
      valuesKey: url
      targetPath: secrets.karakeep.stringData.OPENAI_BASE_URL
  values:
    applicationHost: "${KARAKEEP_HOST:=karakeep.invalid.example}"
    applicationProtocol: https
    controllers:
      karakeep:
        annotations:
          ignore-check.kube-linter.io/run-as-non-root: "upstream image's s6-overlay init process requires root to chown /run at container start; verified locally that a non-root UID fails to boot (2026-10-06)"
          ignore-check.kube-linter.io/no-read-only-root-fs: "upstream image's s6-overlay process supervisor writes to /run/s6 at runtime; verified locally that --read-only fails to boot (2026-10-06)"
        containers:
          karakeep:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: false
              runAsNonRoot: false
            env:
              DISABLE_SIGNUPS: "true"
              INFERENCE_TEXT_MODEL: "Qwen/Qwen3.6-35B-A3B-FP8"
              INFERENCE_IMAGE_MODEL: "Qwen3.8-27B"
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
              INFERENCE_OUTPUT_SCHEMA: "plain"
              INFERENCE_JOB_TIMEOUT_SEC: "120"
              INFERENCE_CONTEXT_LENGTH: "16000"
              INFERENCE_MAX_OUTPUT_TOKENS: "8000"
              EMBEDDING_ENABLE_AUTO_INDEXING: "false"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 10Gi
              storageClass: local-path
              globalMounts:
                - path: /data

      chrome:
        containers:
          chrome:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: "151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7"
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi

    meilisearch:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistence:
        enabled: true
        size: 5Gi
        storageClass: local-path

    ingress:
      karakeep:
        enabled: true
        className: traefik
        annotations:
          external-dns.kubernetes.io/managed-by: external-dns
          external-dns.kubernetes.io/cloudflare-proxied: "true"
          external-dns.kubernetes.io/target: "${CLOUDFLARE_TUNNEL_TARGET:=tunnel-target.invalid.example}"
