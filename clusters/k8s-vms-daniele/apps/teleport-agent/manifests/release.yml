---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport-agent
  namespace: teleport-agent
spec:
  interval: 5m
  chart:
    spec:
      chart: teleport-kube-agent
      version: ">=17.0.0"
      sourceRef:
        kind: HelmRepository
        name: teleport-charts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 6
  upgrade:
    remediation:
      retries: 6
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  values:
    proxyAddr: ${TELEPORT_HOST}:443
    kubeClusterName: "k8s-vms-daniele"
    joinTokenSecret:
      create: false
      name: "teleport-kube-agent-join-token"
    # The chart always starts the agent with --diag-addr=0.0.0.0:3000
    # unconditionally (not gated by any values flag) - already-live
    # /healthz and /readyz probes on this port confirm it. Its diag HTTP
    # server also serves /metrics; this was purely a missing-annotation
    # gap, no NetworkPolicy restricts this namespace either.
    annotations:
      pod:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    # Conservative documented estimate (not sized from live usage - no
    # Grafana access this session); a single agent proxying/holding a
    # persistent connection to the Teleport proxy, no local state.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
