---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ansible-awx-test
  namespace: awx-test
spec:
  interval: 5m
  chart:
    spec:
      chart: awx-operator
      # Pinned (unlike prod's floating >=3.1.0) so this rehearsal target is
      # reproducible; 3.2.1 is what prod's own range currently resolves to
      # (confirmed via the chart repo index), so this doesn't diverge from
      # prod's real operator version today.
      version: "3.2.1"
      sourceRef:
        kind: HelmRepository
        name: awx-chart
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    # Skip, not CreateReplace: the awx-operator chart's CRDs are
    # cluster-scoped and already owned/managed by the production `awx`
    # HelmRelease's CreateReplace. A second release of the same chart also
    # set to CreateReplace would fight over Helm ownership metadata on
    # those CRDs every reconcile (5m on both releases) — Skip leaves them
    # alone and relies on the schema prod's release already installed.
    crds: Skip
    remediation:
      retries: 10
  upgrade:
    crds: Skip
    remediation:
      retries: 10
  # Same audit-first posture as the production awx HelmRelease.
  driftDetection:
    mode: warn
  values:
    # Swaps the operator controller's own image to CIQ's ascender-operator
    # (paired release tag, per ctrliq/ascender-install's own
    # ascender-operator/kustomization.j2 image override). AWX's stock
    # awx-manager renders pod templates (redis sidecar name/socket path,
    # etc.) that don't match what Ascender's app images expect at runtime
    # (Ascender's own client code looks for /var/run/valkey/valkey.sock,
    # not AWX's /var/run/redis/redis.sock) — confirmed live on this
    # instance as a CrashLoopBackOff on awx-test-web. Using Ascender's own
    # operator to reconcile the AWX CR should render templates matching
    # what its own app images actually expect.
    operator-controller-containers:
      awx-manager:
        image: ghcr.io/ctrliq/ascender-operator:25.5.1
    AWX:
      enabled: true
      name: awx-test
      spec:
        # Ascender image swap (feasibility check, see Confluence memo) — same
        # AWX CRD, different application images. postgres/redis intentionally
        # left on AWX's own defaults to isolate the variable under test. No
        # verified CIQ compatibility statement exists for a 24.6.1->25.5.1
        # schema upgrade under AWX's own operator — that's the open question
        # this test is designed to answer; a failure here is a valid result.
        image: ghcr.io/ctrliq/ascender
        image_version: "25.5.1"
        init_container_image: ghcr.io/ctrliq/ascender-ee
        init_container_image_version: "25.5.1"
        control_plane_ee_image: ghcr.io/ctrliq/ascender-ee:25.5.1
        # Traefik ingress, reachable on the cluster's own network via
        # AWX_TEST_HOST (cluster-vars.sops.yaml) — deliberately a distinct
        # hostname from prod awx's AWX_HOST, not reused, to avoid a Traefik
        # routing collision between the two Ingress resources. No
        # external-dns/Cloudflare Tunnel annotations (unlike prod awx): this
        # stays LAN-reachable only, not internet-exposed.
        ingress_type: ingress
        ingress_class_name: traefik
        hostname: ${AWX_TEST_HOST}
        extra_settings:
          - setting: CSRF_TRUSTED_ORIGINS
            value:
              - https://localhost:3001
              - https://${AWX_TEST_HOST}
        secret_key_secret: custom-awx-test-secret-key
        projects_persistence: true
        projects_storage_class: local-path
        projects_storage_size: 8Gi
        projects_storage_access_mode: ReadWriteOnce
        web_resource_requirements:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi
        task_resource_requirements:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 300m
            memory: 2Gi
        ee_resource_requirements:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
