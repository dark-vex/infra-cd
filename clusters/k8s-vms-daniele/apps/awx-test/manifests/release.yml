---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ansible-awx-test
  namespace: awx-test
spec:
  interval: 5m
  chart:
    spec:
      chart: ascender-operator
      version: "25.6.2"
      sourceRef:
        kind: HelmRepository
        name: ascender-chart
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    # Skip, not CreateReplace: the awx-operator/ascender-operator charts'
    # CRDs are cluster-scoped and already owned/managed by the production
    # `awx` HelmRelease's CreateReplace. A second release of a chart also
    # set to CreateReplace would fight over Helm ownership metadata on
    # those CRDs every reconcile (5m on both releases) — Skip leaves them
    # alone and relies on the schema prod's release already installed.
    # Verified 2026-09-12: ascender-operator 25.6.2's CRD is a strict
    # superset of the community awx-operator 3.2.1 CRD prod installs (6
    # added fields, none removed/retyped) — Skip stays safe as long as
    # this release's AWX.spec never uses one of the 6 new-only fields.
    # This is a point-in-time fact, not an enforced invariant: re-verify
    # before any future chart/CRD bump on either release. See
    # clusters/k8s-vms-daniele/CLAUDE.md for the full rationale.
    crds: Skip
    remediation:
      retries: 10
  upgrade:
    crds: Skip
    remediation:
      retries: 10
    # Required: this chart's operator Deployment selector carries
    # helm.sh/chart: ascender-operator (was awx-operator), and Deployment
    # selectors are immutable — an in-place same-named-release upgrade
    # fails this one resource without force. Same precedent as
    # clusters/kubenuc/apps/sso/manifests/zitadel.yml. Leave this in place
    # permanently, not just for this migration: reverting the chart swap
    # later hits the identical immutable-selector conflict in the mirror
    # direction, and force is what lets a same-day revert reconcile.
    force: true
    disableWait: true
  # Same audit-first posture as the production awx HelmRelease.
  driftDetection:
    mode: warn
  values:
    AWX:
      enabled: true
      name: awx-test
      spec:
        # Ascender rehearsal instance (see Confluence memo) — now running on
        # CIQ's official ascender-operator chart (see this app's release.yml
        # chart.spec above). postgres/redis intentionally left on AWX's own
        # defaults to isolate the variable under test.
        image: ghcr.io/ctrliq/ascender
        image_version: "25.5.1"
        init_container_image: ghcr.io/ctrliq/ascender-ee
        init_container_image_version: "25.5.1"
        control_plane_ee_image: ghcr.io/ctrliq/ascender-ee:26.5.1

        ingress_type: ingress
        ingress_class_name: traefik
        hostname: ${AWX_TEST_HOST}
        ingress_annotations: |
          external-dns.alpha.kubernetes.io/managed-by: external-dns
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          external-dns.alpha.kubernetes.io/target: ${CLOUDFLARE_TUNNEL_TARGET}

        extra_settings:
          - setting: CSRF_TRUSTED_ORIGINS
            value:
              - https://localhost:3001
              - https://${AWX_TEST_HOST}
        secret_key_secret: custom-awx-test-secret-key
        projects_persistence: true
        projects_storage_class: local-path
        projects_storage_size: 8Gi
        projects_storage_access_mode: ReadWriteOnce
        web_resource_requirements:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi
        task_resource_requirements:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 300m
            memory: 2Gi
        ee_resource_requirements:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
