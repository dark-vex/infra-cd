apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: selfreg-webhook-secret
  namespace: proxmox-selfreg-shim
spec:
  # Reused, not new — the exact same HMAC secret terraform/semaphore's
  # webhook integration already used (data.onepassword_item.selfreg_webhook_secret
  # in terraform/semaphore/data.tf). Only the "credential" field is read
  # here (HMAC key) — the unguessable URL path segment lives in
  # cluster-vars.sops.yaml (SELFREG_WEBHOOK_PATH), not a second field on
  # this item, since the Ingress path itself is a static, git-committed
  # value that can only be templated via Flux's postBuild.substituteFrom
  # (ConfigMap/Secret sources), not a OnePasswordItem-backed Secret
  # referenced directly in Ingress spec fields.
  itemPath: "vaults/k8s_secrets/items/gdbvp6yfyzouv5hmf7mbamvrky"
