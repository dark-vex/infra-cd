apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: proxmox-selfreg-awx-token
  namespace: proxmox-selfreg-shim
spec:
  # NOT YET CREATED. Per the Semaphore->AWX migration plan's Phase A2, this
  # item must be created manually, once, after: (1) a dedicated AWX user is
  # created in the "Proxmox Self-Registration" org with RBAC limited to
  # Execute on the proxmox-selfreg job template only (no read on other
  # credentials/projects), and (2) that user's API token is minted (awx.awx
  # collection's token-creation is explicitly non-idempotent — every run
  # mints a new one, so this is a one-time manual step, not part of
  # ansible/awx-selfreg-bootstrap). Store the minted token under a field
  # named "credential" in a new item at this path before this
  # OnePasswordItem can sync. This is a real, deliberate blocker — not an
  # oversight.
  itemPath: "vaults/k8s_secrets/items/proxmox-selfreg-awx-token"
