# fluxcd is excluded from validate-k3s-rabbit.yml's real-path e2e app
# loop — see that workflow's EXCLUDED_APPS array — because this Provider
# posts to the real #infrastructure Slack channel. This comment-only
# touch exists solely to exercise that skip path (and the CHANGED-parsing
# fix) in the workflow's first real CI run.
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: slack
  namespace: flux-system
spec:
  type: slack
  channel: infrastructure
  secretRef:
    name: slack-url
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: fluxcd-notifications
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventMetadata:
    summary: "cluster status"
    env: "production"
    cluster: "k3s-rabbit"
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: charts
    - kind: HelmRelease
      name: '*'
    - kind: Kustomization
      name: '*'
  exclusionList:
    - "error.*lookup github\\.com"
    - "error.*lookup raw\\.githubusercontent\\.com"
    - "dial.*tcp.*timeout"
    - "waiting.*socket"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-status
  namespace: flux-system
spec:
  type: github
  address: "https://github.com/dark-vex/infra-cd"
  secretRef:
    name: github-status-token
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-commit-status
  namespace: flux-system
spec:
  providerRef:
    name: github-status
  eventMetadata:
    summary: "cluster reconcile status"
    env: "production"
    cluster: "k3s-rabbit"
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: '*'
  exclusionList:
    - "error.*lookup github\\.com"
    - "error.*lookup raw\\.githubusercontent\\.com"
    - "dial.*tcp.*timeout"
    - "waiting.*socket"
