---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs
  namespace: flux-system
spec:
  interval: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/kubenuc/apps/openebs/manifests
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openebs
      namespace: openebs
  patches:
    - target:
        kind: HelmRelease
        name: openebs
      patch: |
        - op: add
          path: /spec/install/timeout
          value: 30m
        - op: add
          path: /spec/values/loki
          value:
            enabled: false
        - op: add
          path: /spec/values/alloy
          value:
            enabled: false
