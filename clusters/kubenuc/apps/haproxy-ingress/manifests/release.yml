---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: haproxy-ingress
  namespace: haproxy-ingress
spec:
  interval: 15m
  maxHistory: 20
  chart:
    spec:
      chart: kubernetes-ingress
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: haproxy-ingress
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  values:
    controller:
      priorityClassName: cluster-infra-critical
      kind: Deployment
      ingressClass: haproxy
      ingressClassResource:
        name: haproxy
        enabled: true
        default: true
      extraArgs:
      - --configmap-tcp-services=haproxy-ingress/tcp
      service:
        type: LoadBalancer
        externalTrafficPolicy: "Local"
        tcpPorts:
        - name: portainer
          port: 8880
          targetPort: 8000

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi

      replicaCount: 3

      # Wave 5: controller.prometheus.enabled defaults to true in this chart
      # (metrics served on the stat port, containerPort.stat=1024, at /metrics)
      # - only the scrape annotation was missing. No NetworkPolicy exists in
      # this namespace (no default-deny), so no allow-rule is needed here,
      # unlike nut/harbor. Investigate live haproxy_* series cardinality
      # before building a dashboard - per-backend/per-server stats scale
      # with both the number of ingress-fronted apps and this controller's
      # replicaCount: 3, so land this annotation-only first and checkpoint
      # grafanacloud_instance_active_series before deciding whether a
      # cardinality-trimming relabel rule is needed.
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "1024"
        prometheus.io/path: "/metrics"

      PodDisruptionBudget:
        enable: true
        minAvailable: 1

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - kubernetes-ingress
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - haproxy-ingress
              topologyKey: "kubernetes.io/hostname"
      config:
        ssl-redirect: "false"
        client-body-buffer-size: "0"
        forwarded-for: "true"
        request-body-size: "0"
        cors-enable: "true"
        cors-allow-headers: "X-Forwarded-For"
