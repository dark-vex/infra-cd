---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 15m
  maxHistory: 20
  dependsOn:
    - name: redis
  chart:
    spec:
      chart: harbor
      version: "1.19.2"
      sourceRef:
        kind: HelmRepository
        name: harbor-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 6
  upgrade:
    remediation:
      retries: 6
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  values:
    enableMigrateHelmHook: true
    updateStrategy:
      type: Recreate
    externalURL: ${HARBOR_URL}
    core:
      replicas: 2
      podAnnotations:
        secret.reloader.stakater.com/auto: "true"
      resources:
        requests:
          memory: 512Mi
          cpu: 100m
      topologySpreadConstraints:
         - maxSkew: 1
           topologyKey: topology.kubernetes.io/zone
           whenUnsatisfiable: DoNotSchedule
      initContainers:
        - name: check-db-ready
          image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
          command: ["sh", "-c",
            "until pg_isready -h $${PGHOST} -p 5432;
            do echo waiting for database; sleep 2; done;"]
          env:
            - name: PGHOST
              value: postgresql-nuc-cluster.databases.svc.cluster.local
            - name: PGSSLMODE
              value: require
          securityContext:
            runAsUser: 999
            readOnlyRootFilesystem: true
        - name: init-db
          image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
          command: ["sh", "-c", "
              psql -U $${PGUSERNAME} -h $${PGHOST} -c 'CREATE DATABASE registry;'
              -c \"CREATE USER harbor WITH ENCRYPTED PASSWORD '$${HARBOR_DB_PASSWORD}';\"
              -c 'GRANT ALL PRIVILEGES ON DATABASE registry TO harbor;'
              -c '\\c registry postgres'
              -c 'GRANT ALL ON SCHEMA public TO harbor;'
              -c 'GRANT SELECT ON ALL TABLES IN SCHEMA public TO harbor;'
              -c 'GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO harbor;'
              -c 'ALTER DEFAULT PRIVILEGES FOR ROLE harbor IN SCHEMA public GRANT SELECT ON TABLES TO harbor;'"]
          env:
            - name: PGHOST
              value: postgresql-nuc-cluster.databases.svc.cluster.local
            - name: PGSSLMODE
              value: require
            - name: PGUSERNAME
              valueFrom:
                secretKeyRef:
                  name: harbor-secrets
                  key: PGUSERNAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-secrets
                  key: PGPASSWORD
            - name: HARBOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-secrets
                  key: password
          securityContext:
            runAsUser: 999
            readOnlyRootFilesystem: true
    portal:
     replicas: 2
     resources:
       requests:
         memory: 256Mi
         cpu: 100m
     topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
    metrics:
      enabled: true
    # Wave 4: metrics.enabled alone doesn't add scrape annotations in this
    # chart version - registry and exporter's podAnnotations are wired up
    # manually. core/jobservice/trivy annotation blocks were never drafted
    # - only consider adding them in a later, separate PR if this proves
    # valuable and cardinality budget allows, per the original plan's
    # caution against enabling all four sub-components' metrics at once.
    registry:
      podAnnotations:
        backup.velero.io/backup-volumes: "registry-data"
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
    # The exporter sub-component (metrics.enabled: true already deploys it,
    # confirmed live: harbor-exporter Deployment, replicas: 1 per the chart
    # default - not scaled with core/registry) is a dedicated Prometheus
    # aggregator that queries Harbor's own Postgres DB directly for
    # business-level metrics (project/repository/artifact counts, quota
    # usage) - complementary to, not redundant with, registry's protocol-
    # level metrics (HTTP/blob-storage request counts). Single pod, so
    # cheap relative to value. Same port number (8001) as registry is NOT
    # coincidental - the chart's underlying metrics.<component>.port block
    # (values.yaml, never overridden by this repo) defaults core/registry/
    # jobservice/exporter all to 8001 uniformly. That block lives outside
    # exporter:/registry: entirely - a future port change belongs there,
    # not under either sub-component's own key.
    exporter:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
    notary:
      enabled: false
    expose:
      ingress:
        className: "haproxy"
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          nginx.ingress.kubernetes.io/ssl-redirect: null
          nginx.ingress.kubernetes.io/proxy-body-size: null
          ingress.kubernetes.io/ssl-redirect: null
          ingress.kubernetes.io/proxy-body-size: null
          external-dns.alpha.kubernetes.io/managed-by: external-dns
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          external-dns.alpha.kubernetes.io/target: ${CLOUDFLARE_TUNNEL_TARGET}
        hosts:
          core: ${HARBOR_HOST}
      tls:
        enabled: true
        secretName: "harbor-ingress-certificate"
      type: ingress
    database:
      type: external
      external:
        host: "postgresql-nuc-cluster.databases.svc.cluster.local"
        port: "5432"
        username: "harbor"
        existingSecret: "harbor-secrets"
        sslmode: "require"
    redis:
      type: external
      external:
        addr: "redis-master:6379"
        coreDatabaseIndex: "0"
        jobserviceDatabaseIndex: "1"
        registryDatabaseIndex: "2"
        trivyAdapterIndex: "5"
        harborDatabaseIndex: "6"
        cacheLayerDatabaseIndex: "7"
    persistence:
      persistentVolumeClaim:
        registry:
          storageClass: openebs-hostpath
          size: 30Gi
        jobservice:
          jobLog:
            storageClass: openebs-hostpath
        trivy:
          storageClass: openebs-hostpath
