---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- networkpolicy-allow-ingress.yml
- networkpolicy-default-deny-ingress.yml
- release.yml
components:
- ../../../components/db-backup-cronjob
patches:
- target:
    kind: CronJob
  patch: |-
    - op: replace
      path: /metadata/name
      value: forgejo-db-backup
    - op: replace
      path: /metadata/namespace
      value: forgejo
- target:
    kind: CronJob
  patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: CHANGEME
    spec:
      schedule: "0 2 * * 0"
      jobTemplate:
        spec:
          template:
            spec:
              containers:
              - name: pgbackup
                env:
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-db-backup
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-db-backup
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-db-backup
                - name: S3_PREFIX
                  value: "forgejo-db-backup"
                - name: POSTGRES_DATABASE
                  value: "forgejo"
                - name: POSTGRES_USER
                  value: "forgejo"
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-secrets
                      key: password
