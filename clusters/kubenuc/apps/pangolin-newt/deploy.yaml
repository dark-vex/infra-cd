---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pangolin-newt-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: 1p-operator
  path: ./clusters/kubenuc/apps/pangolin-newt/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 15m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pangolin-newt
  namespace: flux-system
spec:
  dependsOn:
    - name: pangolin-newt-secrets
  path: ./clusters/kubenuc/apps/pangolin-newt/manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: pangolin-newt
      namespace: pangolin-newt
