---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pangolin-newt
  namespace: pangolin-newt
spec:
  interval: 15m
  maxHistory: 10
  chart:
    spec:
      chart: newt
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: fossorial-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
  values:
    global:
      image:
        tag: "1.12.5"
      podAnnotations:
        reloader.stakater.com/auto: "true"
    newtInstances:
      - name: kubenuc-harbor
        enabled: true
        replicas: 1
        service:
          enabled: false
        auth:
          existingSecretName: pangolin-newt-kubenuc-harbor
