---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 15m
  maxHistory: 20
  chart:
    spec:
      chart: velero
      version: "12.2.5"
      sourceRef:
        kind: HelmRepository
        name: velero
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 6
  upgrade:
    remediation:
      retries: 6
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  values:
    image:
      repository: velero/velero
      tag: v1.18.4
    kubectl:
      image:
        repository: bitnamilegacy/kubectl
        tag: "1.33.4"
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    serviceAccount:
      server:
        create: true
        name: velero
    credentials:
      useSecret: true
      existingSecret: cloud-credentials
    deployNodeAgent: true
    nodeAgent:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 4Gi
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: Nextcloud-Fastnetserv
          default: true
          config:
            region: minio
            s3ForcePathStyle: "true"
            s3Url: https://s3.eu-central-003.backblazeb2.com
            prefix: ""
            checksumAlgorithm: ""
      volumeSnapshotLocation:
        - name: default
          provider: aws
          config: {}
    extraObjects:
      - apiVersion: velero.io/v1
        kind: Schedule
        metadata:
          name: schedule-fastnet-nextcloud
          namespace: velero
        spec:
          schedule: "@every 24h"
          skipImmediately: false
          useOwnerReferencesInBackup: false
          template:
            snapshotVolumes: false
            includedNamespaces:
              - nextcloud-fastnetserv
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: nextcloud
            ttl: 720h0m0s
      # Harbor: only the registry PVC is annotated for fs-backup. Everything else
      # is in git, 1Password or the DB backup, so back up just the registry pod + PVC
      # (all a fs-backup restore needs; proven by the 2026-11-17 Nextcloud drill).
      # The label selector keeps the Redis and trivy objects out.
      # Weekly is enough, images can be re-pushed.
      - apiVersion: velero.io/v1
        kind: Schedule
        metadata:
          name: schedule-harbor
          namespace: velero
        spec:
          schedule: "@every 168h"
          skipImmediately: false
          useOwnerReferencesInBackup: false
          template:
            snapshotVolumes: false
            includedNamespaces:
              - harbor
            includedResources:
              - pods
              - persistentvolumeclaims
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: registry
                app.kubernetes.io/name: harbor
            ttl: 720h0m0s
      # Jenkins: jenkins-home holds job config and credentials (master.key lives
      # in the volume). Same pod + PVC scope as Harbor,
      # selected by the controller labels.
      - apiVersion: velero.io/v1
        kind: Schedule
        metadata:
          name: schedule-jenkins
          namespace: velero
        spec:
          schedule: "@every 168h"
          skipImmediately: false
          useOwnerReferencesInBackup: false
          template:
            snapshotVolumes: false
            includedNamespaces:
              - jenkins
            includedResources:
              - pods
              - persistentvolumeclaims
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: jenkins-controller
                app.kubernetes.io/name: jenkins
            ttl: 720h0m0s
