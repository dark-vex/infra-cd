---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-operator
  namespace: databases
spec:
  interval: 15m
  maxHistory: 20
  chart:
    spec:
      chart: postgres-operator
      # PR-F of the staged 2.0.1 upgrade sequence. All the breaking-change
      # variables this bump would otherwise flip silently were already
      # frozen/migrated in prior isolated PRs (PR-B: password_encryption,
      # Spilo image pin; PR-C/D/E: DCS backend flip via the 3->1->3 quorum
      # dance) - this step is now "just" the chart/CRD version itself.
      # Preflight: the live CR and OperatorConfiguration were validated
      # directly against this version's real CRD schema (not the stale
      # datreeio catalog schema PR-A worked around) and passed with zero
      # errors. Keep configGeneral.docker_image pinned to the PR-B tag
      # here - the Spilo image bump is a deliberately separate follow-up
      # (PR-G), not bundled with the operator version.
      version: "2.0.2"
      sourceRef:
        kind: HelmRepository
        name: postgres-operator-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 6
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 6
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  values:
    configGeneral:
      # PR-G of the staged 2.0.1 upgrade sequence: bumps the pin from the
      # PR-B tag (spilo-17:4.0-p3, what was running pre-upgrade) to the
      # chart 2.0.1's actual default. Note: Zalando's own release notes
      # claim "Default Spilo image: ghcr.io/zalando/spilo-17:4.1-p2" for
      # 2.0.1, but the chart's real values.yaml default is spilo-18:4.1-p2 -
      # verified directly against the chart, not the release notes.
      # spilo-18 still bundles Postgres 14-17 binaries alongside 18
      # (PGOLDVERSIONS="14 15 16 17" in its Dockerfile), so it remains safe
      # to run against this cluster's existing PG15 data directory.
      # Digest-pinned (verified pullable, linux/amd64, via skopeo) rather
      # than tag-only, matching this repo's existing pin convention (e.g.
      # the exporter sidecar image in db/cluster.yaml).
      #
      # Deliberately separate from PR-F (the operator version bump itself)
      # since a rolling pod restart is expected here too - keep each
      # variable's blast radius isolated and independently observable.
      # No custom Renovate manager tracks this image today; it will keep
      # riding whatever's pinned here until one is added.
      docker_image: ghcr.io/zalando/spilo-18:4.1-p2@sha256:258a87d34699387f3b6b45d30874c21c6b838ed51c9371ae2a70151d57137990
      # PR-D of the staged 2.0.1 upgrade sequence: flips Patroni's DCS
      # backend from Kubernetes Endpoints (the implicit default while this
      # key is unset) to ConfigMaps, still on chart 1.15.1 - v2.0 makes this
      # the default, but flipping it in the same step as a major chart bump
      # on a live cluster is a documented split-brain risk (Zalando's
      # migrate.md). Done here instead, deliberately isolated, while the
      # cluster is at numberOfInstances: 1 (PR-C) per Zalando's mandated
      # procedure. Verify: 3 new ConfigMaps (-config/-failover/-leader)
      # exist and the sole member stays healthy before PR-E scales back up.
      kubernetes_use_configmaps: true
    configKubernetes:
      cluster_name_label: ranchernuc
      pod_environment_secret: postgres-object-store-credentials
      enable_persistent_volume_claim_deletion: false
    configMajorVersionUpgrade:
      major_version_upgrade_mode: "manual"
      minimal_major_version: "16"
      target_major_version: "17"
