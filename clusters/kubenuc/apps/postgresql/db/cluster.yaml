apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: postgresql-nuc-cluster
  namespace: databases
spec:
  env:
  - name: WAL_BUCKET_SCOPE_PREFIX
    value: ""
  - name: WAL_BUCKET_SCOPE_SUFFIX
    value: ""
  additionalVolumes:
  - mountPath: /tmp/queries.yaml
    name: customqueries
    subPath: queries.yaml
    targetContainers:
    - exporter
    volumeSource:
      configMap:
        name: postgresql-exporter-server-queries
  teamId: "ddlns"
  volume:
    size: 20Gi
    storageClass: "openebs-hostpath"
  # PR-E of the staged 2.0.1 upgrade sequence: scaling back to 3 now that
  # PR-C (scale to 1) and PR-D (DCS backend flip to ConfigMaps, still on
  # 1.15.1) are both merged and confirmed healthy. Note: PVCs for -1/-2
  # were retained (not deleted) during the scale-down, so Patroni will
  # reattach stale data directories on these ordinals and needs to
  # reinit/pg_rewind them rather than getting fresh volumes - expected,
  # not a red flag. Node maintenance freeze lifts once this is verified.
  numberOfInstances: 3
  podAnnotations:
    prometheus.io/port: "9187"
    prometheus.io/scrape: "true"
    target-version: "15"
    # Bump this value to force a Patroni-aware rolling pod restart via the
    # operator (e.g. to pick up a rotated postgres-exporter credential that
    # has no Reloader wiring under apps/postgresql/). Do not use raw
    # `kubectl rollout restart` on this StatefulSet - it fights Patroni's
    # own leader-aware rolling logic.
    ops.fastnetserv.io/restart-trigger: "2026-08-01-superuser-rotation"
  postgresql:
    version: "15"
    parameters:
      extwlist.extensions: btree_gin,btree_gist,citext,hstore,intarray,ltree,pgcrypto,pgq,pg_trgm,postgres_fdw,tablefunc,uuid-ossp,hypopg,pg_partman
      log_rotation_age: 1h
      max_connections: "300"
      # Migrated from md5 (previously pinned to decouple from the postgres-
      # operator chart's v2.0+ scram-sha-256 default). Only affects passwords
      # set via CREATE/ALTER ROLE from this point on - existing md5-hashed
      # roles keep working (pg_hba md5 entries accept scram-hashed passwords
      # transparently; the reverse is not true). App-role passwords
      # (harbor/nextcloud/authentik/zitadel) are rotated separately, after
      # this merges, so nothing is rehashed twice.
      password_encryption: scram-sha-256
  resources:
    limits:
      cpu: "4"
      memory: 2Gi
    requests:
      cpu: "2"
      memory: 2Gi
  sidecars:
  - env:
    - name: DATA_SOURCE_URI
      value: localhost:5432/postgres?sslmode=disable
    - name: DATA_SOURCE_USER
      value: "postgres"
    - name: DATA_SOURCE_PASS
      valueFrom:
        secretKeyRef:
          name: "postgresql-exporter-secrets"
          key: PGPASSWORD
    - name: PG_EXPORTER_EXTEND_QUERY_PATH
      value: /tmp/queries.yaml
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    name: exporter
    ports:
    - containerPort: 9187
      name: exporter
      protocol: TCP
    resources:
      limits:
        cpu: 250m
        memory: 256M
      requests:
        cpu: 100m
        memory: 200M
