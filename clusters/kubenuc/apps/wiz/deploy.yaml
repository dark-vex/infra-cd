---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wiz-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: 1p-operator
  path: ./clusters/kubenuc/apps/wiz/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wiz
  namespace: flux-system
spec:
  dependsOn:
    - name: wiz-secrets
    - name: charts
  path: ./clusters/kubenuc/apps/wiz/manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: wiz-integration
      namespace: wiz
