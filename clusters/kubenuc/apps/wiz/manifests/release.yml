---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wiz-integration
  namespace: wiz
spec:
  interval: 15m
  maxHistory: 10
  chart:
    spec:
      chart: wiz-kubernetes-integration
      version: "0.3.96"
      sourceRef:
        kind: HelmRepository
        name: wiz
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
  values:
    global:
      wizApiToken:
        secret:
          create: false
          name: wiz-api-token
    wiz-kubernetes-connector:
      enabled: true
      autoCreateConnector:
        clusterFlavor: Kubernetes
        connectorName: ddl-kubenuc
      wiz-broker:
        enabled: true
