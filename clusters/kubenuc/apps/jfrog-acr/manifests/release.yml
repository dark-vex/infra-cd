---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory
  namespace: jfrog
spec:
  interval: 15m
  maxHistory: 20
  chart:
    spec:
      chart: artifactory-jcr
      version: "107.161.15"
      sourceRef:
        kind: HelmRepository
        name: jfrog-chart
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 6
    timeout: 15m
  upgrade:
    remediation:
      retries: 6
    timeout: 30m
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  # Boot-time fix for the 2026-07-30 outage (kubenuc): the artifactory
  # container's CPU limit was capping the JVM at 1 core during its
  # CPU-bound Jersey/Tomcat classpath-scanning phase, pushing boot past
  # its own 460s startupProbe budget (and past router's tighter 160s
  # budget, since router requires the main JVM ready in the same pod).
  # Node had ample idle CPU (27% used, 8 cores) - the limit, not the
  # node, was the bottleneck. The chart hardcodes probe thresholds in
  # its templates (no values knob - confirmed via `helm show values`),
  # so the probe-budget half of the fix goes through postRenderers
  # below. See Confluence: JFrog Artifactory for the full incident.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                # No `namespace:` here deliberately - this chart's
                # artifactory-statefulset.yaml template never stamps
                # metadata.namespace (unlike the postgresql subchart's,
                # which does), so the rendered resource Kustomize sees
                # is namespace-unscoped; adding namespace: jfrog here
                # makes the patch fail to match with "no matches for Id".
                name: artifactory
              spec:
                template:
                  spec:
                    containers:
                      - name: artifactory
                        startupProbe:
                          failureThreshold: 150
                      - name: router
                        startupProbe:
                          failureThreshold: 150
  values:
    artifactory:
      artifactory:
        # Mandatory since chart 107.161.15: both keys must be resolvable
        # from values or the chart's helm template validation gate fails.
        # Pointed at the OnePasswordItem-synced Secret added in PR #1740 -
        # see clusters/kubenuc/CLAUDE.md's jfrog gotcha entry.
        masterKeySecretName: artifactory-mandatory-keys
        joinKeySecretName: artifactory-mandatory-keys
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        ## The following Java options are passed to the java process running Artifactory.
        ## You should set them according to the resources set above.
        ## IMPORTANT: Make sure resources.limits.memory is at least 1G more than Xmx.
        javaOpts:
          xms: "1g"
          xmx: "3g"

      nginx:
        enabled: false

      ingress:
        enabled: true
        ## Used to create an Ingress record.
        hosts:
        - ${ARTIFACTORY_HOST}
        className: "haproxy"
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        tls:
        - secretName: artifactory-tls
          hosts:
            - ${ARTIFACTORY_HOST}
