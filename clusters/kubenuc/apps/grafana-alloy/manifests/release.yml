---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-k8s-monitoring
  namespace: grafana-alloy
spec:
  interval: 15m
  timeout: 10m
  maxHistory: 20
  chart:
    spec:
      chart: k8s-monitoring
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 6
  upgrade:
    remediation:
      retries: 6
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  valuesFrom:
    # --- Destination passwords (all use the same API key) ---
    - kind: Secret
      name: grafana-cloud-credentials
      valuesKey: password
      targetPath: destinations.grafanaCloudMetrics.auth.password
    - kind: Secret
      name: grafana-cloud-credentials
      valuesKey: password
      targetPath: destinations.grafanaCloudLogs.auth.password
    - kind: Secret
      name: grafana-cloud-credentials
      valuesKey: password
      targetPath: destinations.gcOtlp.auth.password
    # --- Destination usernames ---
    - kind: Secret
      name: grafana-cloud-credentials
      valuesKey: metrics-username
      targetPath: destinations.grafanaCloudMetrics.auth.username
    - kind: Secret
      name: grafana-cloud-credentials
      valuesKey: logs-username
      targetPath: destinations.grafanaCloudLogs.auth.username
    - kind: Secret
      name: grafana-cloud-credentials
      valuesKey: otlp-username
      targetPath: destinations.gcOtlp.auth.username
    # --- Graylog OTLP gRPC destination ---
    - kind: Secret
      name: graylog-alloy-creds
      valuesKey: url
      targetPath: destinations.graylogOtlp.url
    - kind: Secret
      name: graylog-alloy-creds
      valuesKey: bearer_token
      targetPath: destinations.graylogOtlp.auth.bearerToken
  values:
    alloy-operator:
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi

    cluster:
      name: kubenuc

    global:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532

    destinations:
      grafanaCloudMetrics:
        type: prometheus
        url: ${GRAFANA_PROMETHEUS_URL}
        auth:
          type: basic
          # username and password injected via valuesFrom
        metricProcessingRules: |
          write_relabel_config {
            source_labels = ["__name__"]
            regex         = "(alloy|prometheus_remote_storage|prometheus_target|prometheus_sd|scrape|otelcol|receiver|exporter|cluster|go|process|gotk)_.*|up|scrape_.*"
            action        = "drop"
          }
          write_relabel_config {
            source_labels = ["__name__"]
            regex         = "kube_(endpoint|endpointslice|lease|replicationcontroller|limitrange|resourcequota|certificatesigningrequest|mutatingwebhookconfiguration|validatingwebhookconfiguration|storageclass|csinode|csistoragecapacity|priorityclass|ingressclass|networkpolicy|poddisruptionbudget|configmap|serviceaccount|role|rolebinding|clusterrole|clusterrolebinding)_.*"
            action        = "drop"
          }
          write_relabel_config {
            // Scope to the postgres exporter (namespace=databases) so a pg_ prefix from any
            // future non-postgres source is never caught. Prometheus regexes are fully anchored.
            source_labels = ["__name__", "namespace"]
            regex         = "pg_(settings|stat_user_tables|statio_user_tables|stat_bgwriter|stat_archiver|scrape_collector|exporter|roles_connection_limit|stat_database_stats_reset|static).*;databases"
            action        = "drop"
          }
          write_relabel_config {
            source_labels = ["__name__", "namespace"]
            regex         = "(pg_stat_database_(conflicts.*|tup_.*|blk_(read|write)_time|temp_.*|active_time.*)|pg_locks_count|pg_stat_activity_count|pg_stat_activity_max_tx_duration);databases"
            action        = "drop"
          }
          write_relabel_config {
            source_labels = ["__name__"]
            regex         = "(controller_runtime_reconcile_time_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds)_bucket"
            action        = "drop"
          }
          write_relabel_config {
            // Velero pod-volume-backup / kopia histogram buckets — no dashboard
            // consumer today; _sum/_count retained for rate/average queries.
            source_labels = ["__name__"]
            regex         = "podVolume_pod_volume_operation_latency_seconds_bucket|kopia_blob_storage_latency_ms_bucket"
            action        = "drop"
          }
          write_relabel_config {
            // Drop Authentik histogram buckets; confirmed live, zero dashboard consumers (_sum/_count retained).
            source_labels = ["__name__"]
            regex         = "authentik_(flows_(execution_stage|plan|stage)_time|policies_engine_time_total_seconds|property_mapping_execution_time|tasks_duration_milliseconds)_bucket"
            action        = "drop"
          }
          write_relabel_config {
            // Drop Authentik's Django request-latency histogram + license-expiry gauge; zero consumers, scoped to job=authentik.
            source_labels = ["__name__", "job"]
            regex         = "(django_http_requests_latency_seconds_by_view_method_bucket|authentik_enterprise_license_expiry_seconds);authentik"
            action        = "drop"
          }
          write_relabel_config {
            // Drop flux-operator's per-resource info metric; distinct from gotk_resource_info, zero dashboard consumers.
            source_labels = ["__name__"]
            regex         = "flux_resource_info"
            action        = "drop"
          }
          write_relabel_config {
            // Drop audited KSM fields for active-series cost; requests/limits feed built-in KubeCPU/MemoryOvercommit recording rules.
            // Known gap: those two alerts are Normal (NoData) as a result — deliberate, not fixed here.
            source_labels = ["__name__"]
            regex         = "kube_pod_container_resource_requests|kube_pod_container_info|kube_persistentvolume_status_phase|kube_pod_container_resource_limits|kube_pod_info|kube_pod_restart_policy|kube_pod_owner|kube_pod_start_time|kube_node_status_condition|kube_namespace_status_phase|kube_pod_container_status_last_terminated_timestamp|kube_deployment_status_observed_generation|kube_deployment_status_replicas_updated"
            action        = "drop"
          }
          write_relabel_config {
            // Drop unused KSM recording-rule outputs; zero audited dashboard consumers.
            source_labels = ["__name__"]
            regex         = "cluster:namespace:pod_(memory|cpu):active:kube_pod_container_resource_(requests|limits)|namespace_workload_pod:kube_pod_owner:relabel"
            action        = "drop"
          }
          write_relabel_config {
            // Drop CoreDNS proxy-latency family; never wired into a dashboard panel here.
            source_labels = ["__name__"]
            regex         = "coredns_proxy_request_duration_seconds_bucket|coredns_proxy_request_duration_seconds_sum|coredns_proxy_request_duration_seconds_count"
            action        = "drop"
          }
          write_relabel_config {
            // Drop high-cardinality per-slot HAProxy metrics; retained aggregates serve live dashboard qr3JtwDWz.
            source_labels = ["__name__"]
            regex         = "haproxy_server_.*"
            action        = "drop"
          }
          write_relabel_config {
            // Drop unused HAProxy backend aggregation metrics; audit found zero consumers.
            source_labels = ["__name__"]
            regex         = "haproxy_backend_agg_(check_status|server_status|server_check_status)"
            action        = "drop"
          }
          write_relabel_config {
            // Drop unused HAProxy backend sub-metrics; live dashboard qr3JtwDWz uses retained siblings only.
            source_labels = ["__name__"]
            regex         = "haproxy_backend_(backup_servers|client_aborts_total|connection_reuses_total|last_session_seconds|limit_sessions|max_queue|max_total_time_seconds|response_errors_total|responses_denied_total)"
            action        = "drop"
          }
          write_relabel_config {
            // Drop unused SeaweedFS S3 lifecycle buckets; kn-s3 dashboard uses the filer histogram instead.
            source_labels = ["__name__"]
            regex         = "SeaweedFS_s3_lifecycle_dispatch_limiter_wait_seconds_bucket"
            action        = "drop"
          }
          write_relabel_config {
            // Drop 4 unused histogram buckets + a noisy promhttp counter; audited zero dashboard/alert consumers.
            source_labels = ["__name__"]
            regex         = "certmanager_http_acme_client_request_duration_seconds_bucket|coredns_kubernetes_dns_programming_duration_seconds_bucket|promhttp_metric_handler_requests_total|controller_runtime_webhook_latency_seconds_bucket|cloudflared_rpc_client_latency_secs_bucket"
            action        = "drop"
          }
      grafanaCloudLogs:
        type: loki
        url: ${GRAFANA_LOKI_URL}
        auth:
          type: basic
        logProcessingStages: |
          stage.match {
            selector = `{namespace="haproxy-ingress"}`
            stage.drop {
              expression          = "(?i)(Proxy .+ stopped \\(cumulated conns|Former worker .+ exited|Loading success|HAProxy reloaded|log format ignored for frontend|haproxy version is)"
              drop_counter_reason = "haproxy_reload_churn"
            }
          }
          stage.regex {
            expression = "(?i)(?:\"(?:level|lvl|severity)\"\\s*:\\s*\"|(?:^|\\s)(?:level|lvl|severity)=)(?P<level>debug|info|warn(?:ing)?|error|fatal|critical)"
          }
          stage.labels {
            values = { level = "" }
          }
          stage.regex {
            expression = "(?i)\\[(?P<level>warn(?:ing)?|notice|err(?:or)?|info|debug|fatal|critical)\\]"
          }
          stage.labels {
            values = { level = "" }
          }
          stage.drop {
            expression          = ".*(healthcheck|readiness|liveness|health_check|/healthz|/readyz|/livez).*"
            drop_counter_reason = "probe_noise"
          }
          stage.drop {
            expression          = ".*Reconciliation finished.*"
            drop_counter_reason = "flux_noise"
          }
          stage.drop {
            expression          = ".*\" (2[0-9]{2}|3[0-9]{2}) .*"
            drop_counter_reason = "success_access_logs"
          }
          stage.drop {
            expression          = ".*\\[WARNING\\] No files matching import glob pattern.*"
            drop_counter_reason = "coredns_noise"
          }
          stage.match {
            selector            = "{namespace=\"grafana-alloy\",container=\"alloy\"}"
            action              = "drop"
            drop_counter_reason = "alloy_self_logs"
          }
          stage.match {
            selector = `{level=~"(?i)debug|trace"}`
            action   = "drop"
            drop_counter_reason = "gc_loki_debug_trace"
          }
          stage.match {
            selector = `{namespace!~"databases|nextcloud|sso",level!~"(?i)warn(ing)?|notice|error|fatal|critical"}`
            action   = "drop"
            drop_counter_reason = "gc_loki_default_deny"
          }
      gcOtlp:
        type: otlp
        url: ${GRAFANA_OTLP_URL}
        protocol: http
        auth:
          type: basic
        metrics:
          enabled: true
        logs:
          enabled: true
        traces:
          enabled: true
      graylogOtlp:
        type: otlp
        protocol: grpc
        # url injected via valuesFrom from graylog-alloy-creds secret
        # url format: host:port (no http:// prefix), e.g. graylog.graylog.svc.cluster.local:4317
        auth:
          type: bearerToken
          # bearerToken injected via valuesFrom from graylog-alloy-creds secret
        logs:
          enabled: true
        metrics:
          enabled: false
        traces:
          enabled: false
        processors:
          filters:
            enabled: true
            errorMode: ignore
            logs:
              logRecord:
                # Drop records whose OTel severity_text is debug/warn/error/fatal/critical.
                # Records with severity_text="info" or unset pass through.
                - 'severity_text != "" and IsMatch(severity_text, "(?i)^(debug|warn|warning|error|fatal|critical)$")'
                # Fallback for logfmt without severity_text: level=warn, lvl=error, severity=debug
                - 'IsMatch(body, "(?i)(?:level|lvl|severity)=(warn(?:ing)?|error|fatal|critical|debug)")'
                # Fallback for JSON: "level":"warn", "severity":"error", etc.
                - 'IsMatch(body, "(?i)\"(?:level|lvl|severity)\"\\s*:\\s*\"(?:warn(?:ing)?|error|fatal|critical|debug)\"")'
                # Fallback: klog E/W/F prefix (e.g. "E0421 ", "W0421 ").
                - 'IsMatch(body, "^[EWF][0-9]{4} ")'

    # Settings applied to all Alloy instances (metrics, singleton, logs, receiver)
    collectorCommon:
      alloy:
        alloy:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          mounts:
            extra:
              - name: alloy-data
                mountPath: /tmp/alloy
        controller:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - kubenuc-m1
                          - kubenuc-w1
          volumes:
            extra:
              - name: alloy-data
                emptyDir: {}

    selfReporting:
      enabled: false

    telemetryServices:
      kube-state-metrics:
        deploy: true
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
        containerSecurityContext:
          runAsUser: 65532
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi

    clusterMetrics:
      enabled: true
      collector: alloy-metrics
      destinations:
        - grafanaCloudMetrics
      kubelet:
        enabled: false
      # cAdvisor enabled for container_network_*_bytes_total only (the one
      # metric family kubelet's /metrics/resource endpoint can't expose -
      # confirmed via chart source, KEP-1867's resource-metrics API is
      # cpu/memory only). Needed for reliability_row()'s "Network I/O" panel
      # in generate_dashboards.py, deliberately deferred when the container
      # CPU/memory metrics were added via kubeletResource instead of this.
      # Scoped tight (useDefaultAllowList: false + a 2-name includeMetrics)
      # rather than the chart's ~19-family cadvisor default allow-list -
      # confirmed via helm template that the resulting keep-regex only
      # matches these two names. dropEmptyImageLabels: false is required:
      # the chart's own default (true) drops any container_(cpu|fs|memory|
      # network|pressure)_* series with an empty `image` label, guarding
      # against a known cAdvisor duplicate-series bug (google/cadvisor#2688)
      # - but cAdvisor's network stats are pod-scoped, not container-scoped,
      # and are commonly emitted with an empty image label as a matter of
      # course, not a bug. Since this config includes no cpu/fs/memory/
      # pressure metrics from cadvisor at all, the rule's protective purpose
      # doesn't apply here, and leaving it at its default would risk
      # silently dropping every series this block exists to add. Confirmed
      # via helm template that disabling it removes exactly that one rule
      # block and nothing else. nodeAddressFormat stays at the chart default
      # ("direct") - same as kubeletResource, already proven to work without
      # needing nodes/proxy RBAC. Two-step land: confirm live series count
      # and shape via query_prometheus once this reconciles, same as every
      # other scrape addition in this repo - the haproxy-ingress incident
      # (est. low-hundreds, actual ~6,471) is the standing reason not to
      # trust this estimate over a live check.
      cadvisor:
        enabled: true
        metricsTuning:
          useDefaultAllowList: false
          includeMetrics:
            - container_network_receive_bytes_total
            - container_network_transmit_bytes_total
          dropEmptyImageLabels: false
      # kubeletResource (job "integrations/kubernetes/resources", scraping
      # kubelet's /metrics/resource endpoint) is enabled at the chart
      # default and untouched above - it already provides node_cpu_usage_
      # seconds_total/node_memory_working_set_bytes. This adds the two
      # container-scoped metrics the same endpoint also exposes (the
      # Kubernetes resource-metrics API, KEP-1867) but the chart's default
      # allow-list (default-allow-lists/kubelet_resource.yaml) filters out -
      # confirmed additive to useDefaultAllowList via `helm template`
      # against the resolved 4.5.2 chart (both name sets land in the same
      # combined keep-regex), not just inferred from values.yaml comments.
      # Deliberately not cAdvisor: this is a smaller-blast-radius fix (no
      # new scrape job, no new label churn from a different endpoint) for
      # exactly the two metrics resource_row() in generate_dashboards.py
      # needs; cAdvisor's default allow-list is ~19 metric families and
      # meaningfully more expensive per-container - remains the fallback
      # only if kubelet's /metrics/resource output turns out not to carry
      # container=/pod=/namespace= labels shaped the way resource_row()
      # expects (confirm via query_prometheus after this lands - two-step
      # land, same as every other scrape addition in this repo).
      kubeletResource:
        metricsTuning:
          includeMetrics:
            - container_cpu_usage_seconds_total
            - container_memory_working_set_bytes
      apiServer:
        enabled: false
      kubeControllerManager:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeProxy:
        enabled: false
      kubeDNS:
        enabled: false
      kube-state-metrics:
        metricsTuning:
          # kube_pod_container_status_ready was never in this chart's default
          # kube-state-metrics allow-list at all (confirmed 2026-09-30 against
          # the resolved 4.5.2 chart's default-allow-lists/kube-state-metrics.
          # yaml) - status_row()'s "Ready Containers" stat panel has queried
          # it since the builder was written, but it never had any live
          # series, unrelated to any write_relabel_config drop. includeMetrics
          # is additive to the default allow-list here too (confirmed via
          # helm template, same mechanism as clusterMetrics.kubeletResource
          # above) - cardinality cost is ~1 series/container (same shape as
          # the already-live kube_pod_container_status_restarts_total, ~255
          # series total across both clusters), cheap against budget.
          includeMetrics:
            - kube_pod_container_status_ready
          excludeMetrics:
            # Replicaset noise
            - kube_replicaset_status_observed_generation
            - kube_replicaset_status_fully_labeled_replicas
            - kube_replicaset_owner
            - kube_replicaset_spec_replicas
            - kube_replicaset_status_replicas
            - kube_replicaset_status_ready_replicas
            # High-churn resource lifecycle metadata (regex — covers all resource types)
            - kube_.*_created
            - kube_.*_metadata_generation
            - kube_pod_status_qos_class
            # Pod/deployment noise
            - kube_pod_status_reason
            - kube_secret_metadata_resource_version
            - kube_deployment_status_condition
            # Init container metrics (rarely needed for basic monitoring)
            - kube_pod_init_container_info
            - kube_pod_init_container_resource_limits
            - kube_pod_init_container_resource_requests
            - kube_pod_init_container_status_last_terminated_exitcode
            - kube_pod_init_container_status_last_terminated_reason
            - kube_pod_init_container_status_ready
            - kube_pod_init_container_status_restarts_total
            - kube_pod_init_container_status_running
            - kube_pod_init_container_status_terminated
            - kube_pod_init_container_status_terminated_reason
            - kube_pod_init_container_status_waiting
            - kube_pod_init_container_status_waiting_reason
            # Pod scheduling metadata
            - kube_pod_overhead_cpu_cores
            - kube_pod_overhead_memory_bytes
            - kube_pod_nodeselectors
            - kube_pod_tolerations
            - kube_pod_spec_volumes_persistentvolumeclaims_info
            - kube_pod_spec_volumes_persistentvolumeclaims_readonly
            # Container last-terminated detail
            - kube_pod_container_status_last_terminated_exitcode
            - kube_pod_container_status_last_terminated_reason

    annotationAutodiscovery:
      enabled: true
      collector: alloy-metrics
      annotations:
        scrape: "prometheus.io/scrape"
        metricsPortNumber: "prometheus.io/port"
        metricsPath: "prometheus.io/path"
        metricsScheme: "prometheus.io/scheme"
      destinations:
        - grafanaCloudMetrics

    clusterEvents:
      enabled: true
      collector: alloy-singleton
      destinations:
        - grafanaCloudLogs

    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
      destinations:
        - grafanaCloudLogs
        - graylogOtlp
      extraLogProcessingStages: |
        stage.regex {
          expression = "(?i)(?:\"(?:level|lvl|severity)\"\\s*:\\s*\"|(?:^|\\s)(?:level|lvl|severity)=)(?P<level>debug|info|warn(?:ing)?|error|fatal|critical)"
        }
        stage.labels {
          values = { level = "" }
        }
        stage.drop {
          expression          = ".*level=debug.*"
          drop_counter_reason = "debug_noise"
        }
        stage.drop {
          expression          = ".*(healthcheck|readiness|liveness|health_check|/healthz|/readyz|/livez).*"
          drop_counter_reason = "probe_noise"
        }
        stage.drop {
          expression          = ".*Reconciliation finished.*"
          drop_counter_reason = "flux_noise"
        }
        stage.drop {
          expression          = ".*\" (2[0-9]{2}|3[0-9]{2}) .*"
          drop_counter_reason = "success_access_logs"
        }
        stage.drop {
          source              = "namespace"
          expression          = "zabbix"
          drop_counter_reason = "zabbix_noise"
        }
        stage.drop {
          expression          = ".*self-reporting-metric\\.prom.*"
          drop_counter_reason = "alloy_self_report_noise"
        }
        stage.drop {
          expression          = ".*(429 Too Many Requests|exceeding post rate limit).*"
          drop_counter_reason = "grafana_cloud_ratelimit_noise"
        }
        stage.drop {
          expression          = ".*\\[WARNING\\] No files matching import glob pattern.*"
          drop_counter_reason = "coredns_noise"
        }
        stage.match {
          // Exempts graylogotlp export-failure lines from the blanket drop
          // below (LogQL line filter chained onto the stream selector) so
          // they reach Grafana Cloud Loki and can be alerted on: this
          // exporter's health has no other visible signal, since its
          // otelcol_* metrics are dropped by grafanaCloudMetrics'
          // write_relabel_config above.
          selector            = "{namespace=\"grafana-alloy\",container=\"alloy\"} !~ \"(?i)graylogotlp.*exporting failed\""
          action              = "drop"
          drop_counter_reason = "alloy_self_logs"
        }

    applicationObservability:
      enabled: true
      collector: alloy-receiver
      destinations:
        - gcOtlp
      receivers:
        otlp:
          grpc:
            enabled: true
            port: 4317
          http:
            enabled: true
            port: 4318
        zipkin:
          enabled: true
          port: 9411

    collectors:
      alloy-metrics:
        presets:
          - clustered
          - statefulset
        alloy:
          # Bumped from 64Mi/128Mi 2026-08-26: this collector was OOMKilling
          # in a tight crash loop (exitCode 137, 21 restarts observed, WAL
          # replay alone taking 11.5s inside a container that lived only
          # 16-32s between kills) - the annotation-autodiscovery scrape
          # target set has grown substantially across Waves 2-5 (nut,
          # cloudflared, sso/authentik, seaweedfs, awx, harbor,
          # haproxy-ingress) without this limit ever being revisited. It was
          # already the smallest of the four collectors despite doing the
          # most work (cluster-wide pod/service discovery + relabel + WAL +
          # remote-write for every annotated target). No empirical usage
          # data was available to size this precisely - the crash loop
          # itself prevented this pod's own memory metrics from ever
          # completing a scrape+remote-write cycle - so 512Mi is a
          # conservative absolute ceiling matching alloy-logs' limit (the
          # most generously provisioned sibling), not a ratio match; revisit
          # if it recurs, since the WAL lives on an emptyDir that persists
          # across container restarts within the pod.
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          extraEnv:
            - name: CLUSTER_NAME
              value: kubenuc
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
        remoteConfig:
          enabled: false

      alloy-singleton:
        presets:
          - singleton
        alloy:
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
          extraEnv:
            - name: CLUSTER_NAME
              value: kubenuc
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
        remoteConfig:
          enabled: false

      alloy-logs:
        presets:
          - daemonset
          - filesystem-log-reader
        alloy:
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          extraEnv:
            - name: CLUSTER_NAME
              value: kubenuc
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
        remoteConfig:
          enabled: false

      alloy-receiver:
        presets:
          - daemonset
        alloy:
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
            - name: zipkin
              port: 9411
              targetPort: 9411
              protocol: TCP
          extraEnv:
            - name: CLUSTER_NAME
              value: kubenuc
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
        remoteConfig:
          enabled: false
