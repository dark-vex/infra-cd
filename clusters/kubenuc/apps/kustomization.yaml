apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# .github/workflows/validate-kubenuc.yml's e2e job now falls back to
# applying an app's own deploy.y*ml verbatim (same paths as this list) when
# no kubenuc-test mirror exists for it — unless the app is in that
# workflow's EXCLUDED_APPS array (real live external side-effect: DNS
# mutation, Slack webhook, production ACME, etc). A new app added here with
# neither a kubenuc-test mirror nor an EXCLUDED_APPS entry gets e2e coverage
# automatically via that fallback; if it has a real live side-effect it
# needs a documented EXCLUDED_APPS entry or CI will actually exercise it.
resources:
  - 1password/deploy.yaml
  - 1password/namespace.yaml
  - cert-manager/deploy.yaml
  - cloudflare/deploy.yml
  - coredns/deploy.yaml
  - external-dns/deploy.yaml
  - falco/deploy.yaml
  - falco/namespace.yml
  - film-tv-exporter/deploy.yaml
  - flux-operator/deploy.yaml
  - fluxcd
  - forgejo/deploy.yaml
  - forgejo/namespace.yml
  - grafana-alloy/deploy.yaml
  - grafana-alloy/namespace.yml
  - haproxy-ingress/deploy.yaml
  - harbor/deploy.yaml
  - harbor/namespace.yml
  - jellyfin/deploy.yaml
  - jenkins/deploy.yaml
  - mcp-viewer/deploy.yaml
  - net-mon/deploy.yaml
  - nextcloud/deploy.yaml
  - nextcloud/namespace.yml
  - node-problem-detector/deploy.yaml
  - nut/deploy.yaml
  - openebs/deploy.yaml
  - portainer/deploy.yaml
  - portainer/namespace.yml
  - postgresql/deploy.yaml
  - postgresql/namespace.yml
  - reloader/deploy.yaml
  - s3/deploy.yaml
  - sso/deploy.yaml
  - sso/namespace.yml
  - system-upgrade-controller/deploy.yaml
  - velero/deploy.yaml
  - velero/namespace.yml
  - zabbix/deploy.yaml
