---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 15m
  maxHistory: 20
  chart:
    spec:
      chart: reloader
      version: "2.2.14"
      sourceRef:
        kind: HelmRepository
        name: reloader
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  values:
    reloader:
      readOnlyRootFileSystem: true
      # Chart defaults to false/false: Reloader only reacts to Secret/ConfigMap
      # *updates* by default, not delete+recreate. A common ops pattern - force
      # an immediate resync of a 1Password-Operator-managed Secret via
      # `kubectl delete secret`, relying on the operator to recreate it - looks
      # like a delete event followed by a create event, which the default
      # config silently ignores. Confirmed missed on kubenuc 2026-08-01 during
      # a live DB-credential rotation (Harbor/Nextcloud/Authentik pods never
      # restarted; had to be restarted manually). Enabling both closes that
      # gap cluster-wide for every Reloader-annotated app.
      reloadOnCreate: true
      reloadOnDelete: true
      deployment:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
