---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: s3
  namespace: nextcloud-fastnetserv
spec:
  interval: 15m
  maxHistory: 20
  chart:
    spec:
      chart: seaweedfs
      version: "4.44.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  # Audit-first: warn only logs/events on drift between the Helm release and
  # live cluster state, it never corrects it - a safe first step before any
  # app is promoted to mode: enabled (which would actively revert manual or
  # external changes).
  driftDetection:
    mode: warn
  values:
    master:
      replicaCount: 1
      persistence:
        storageClass: "openebs-hostpath"
        size: 100Mi
      # Chart doesn't auto-annotate its own metrics port (confirmed against
      # the chart's values.yaml - no prometheus.io annotation wiring exists
      # anywhere in it), unlike some other charts in this repo - wire it up
      # manually. metricsPort 9327 is this chart's own default, same for
      # every component below.
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9327"
        prometheus.io/path: /metrics

    volume:
      replicaCount: 3
      persistence:
        storageClass: "openebs-hostpath"
        size: 10Gi
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9327"
        prometheus.io/path: /metrics

    filer:
      replicaCount: 1
      persistence:
        storageClass: "openebs-hostpath"
        size: 100Mi
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9327"
        prometheus.io/path: /metrics

    s3:
      enabled: true
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9327"
        prometheus.io/path: /metrics
      ingress:
        enabled: true
        className: "haproxy"
        host: ${S3_API_HOST}
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt"
          haproxy.org/request-body-size: "500m"
          external-dns.alpha.kubernetes.io/managed-by: external-dns
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          external-dns.alpha.kubernetes.io/target: ${CLOUDFLARE_TUNNEL_TARGET}
        tls:
        - secretName: s3-tls
          hosts:
            - ${S3_API_HOST}
