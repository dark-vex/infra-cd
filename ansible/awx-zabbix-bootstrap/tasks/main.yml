---
# AWX objects for the Zabbix roles (CODE-123). See playbook.yml for what is, and
# deliberately is not, stored in AWX. Controller address and admin credentials
# come from module_defaults in playbook.yml.

# update_secrets is a switch that decides whether stored credentials are rewritten. A
# typo (=ture) used to become false silently, so a rotation after a compromise reported
# ok and kept the old secret: accept only a real true or false.
- name: Refuse a zabbix_awx_update_secrets that is not true or false
  ansible.builtin.assert:
    that: (zabbix_awx_update_secrets | default(false) | string | lower) in ['true', 'false']
    # fail_msg is templated even when the check passes, so it must not use a bare
    # variable that is undefined in every normal run.
    fail_msg: zabbix_awx_update_secrets must be true or false (got {{ zabbix_awx_update_secrets | default('') }}).
    quiet: true

# The awx-guest-access templates are built at the end, but their inputs are checked up
# front: a missing source list used to stop the run half-way, after earlier templates had
# already been changed. The list is written verbatim into from="...", so each entry must be
# a canonical address or a CIDR with zero host bits and never /0 (ipaddr() alone accepts
# '1', a netmask form and 10.0.0.5/24, which sshd does not read as intended).
- name: Refuse a missing or malformed source list or public key for the awx-guest-access templates
  ansible.builtin.assert:
    that:
      - zabbix_awx_guest_access_from | default([]) | length > 0
      - zabbix_awx_guest_public_key is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+) [A-Za-z0-9+/=]+( [^\\s]+)?$')
      - "'PRIVATE' not in zabbix_awx_guest_public_key"
    fail_msg: >-
      zabbix_awx_guest_access_from must list the addresses or CIDR ranges the guests see
      AWX connect from (add it to host_vars/localhost.sops.yaml, or pass -e with JSON),
      and the item {{ zabbix_awx_op_ssh_item }} needs a public_key text field holding a
      single-line SSH public key.
    quiet: true

- name: Refuse a source list entry that is not a canonical address or CIDR range
  ansible.builtin.assert:
    that: >-
      zabbix_awx_from_entry is match('^[0-9a-fA-F:.]+(/[0-9]{1,3})?\\Z')
      and not (zabbix_awx_from_entry is match('.*/0\\Z'))
      and ((zabbix_awx_from_entry | ansible.utils.ipaddr('network/prefix')) == zabbix_awx_from_entry if '/' in zabbix_awx_from_entry
           else (zabbix_awx_from_entry | ansible.utils.ipaddr('address')) == zabbix_awx_from_entry)
    fail_msg: >-
      zabbix_awx_guest_access_from entries must be canonical IP addresses or CIDR ranges with
      zero host bits (no short form, netmask, 10.0.0.5/24 or /0). Got [{{ zabbix_awx_from_entry }}].
    quiet: true
  loop: "{{ zabbix_awx_guest_access_from | default([]) }}"
  loop_control:
    loop_var: zabbix_awx_from_entry

- name: Ensure the organization exists
  awx.awx.organization:
    name: "{{ zabbix_awx_org }}"
    state: present

# Pulled by digest. AWX pulls it with "missing", so a new digest is a new image.
- name: Ensure the execution environment exists
  awx.awx.execution_environment:
    name: "{{ zabbix_awx_ee_name }}"
    image: "{{ zabbix_awx_ee_image }}"
    pull: missing
    organization: "{{ zabbix_awx_org }}"
    state: present

- name: Ensure the project exists and tracks main
  awx.awx.project:
    name: "{{ zabbix_awx_project }}"
    organization: "{{ zabbix_awx_org }}"
    scm_type: git
    scm_url: https://github.com/dark-vex/infra-cd.git
    scm_branch: main
    scm_update_on_launch: true
    scm_update_cache_timeout: 60
    wait: true
    state: present

# Credential types use env injectors only: AWX rejects ANSIBLE_* names here, and
# neither tool needs a file. SOPS_AGE_KEY is read by the sops binary in the EE.
- name: Ensure the SOPS age key credential type exists
  awx.awx.credential_type:
    name: infra-cd-sops
    kind: cloud
    inputs:
      fields:
        - id: age_key
          label: SOPS age key (AGE-SECRET-KEY-...)
          type: string
          secret: true
          multiline: true
      required:
        - age_key
    injectors:
      env:
        SOPS_AGE_KEY: !unsafe "{{ age_key }}"
    state: present

- name: Ensure the NetBox credential type exists
  awx.awx.credential_type:
    name: infra-cd-netbox
    kind: cloud
    inputs:
      fields:
        - id: netbox_url
          label: NetBox URL
          type: string
          secret: true
        - id: netbox_token
          label: NetBox API token
          type: string
          secret: true
      required:
        - netbox_url
        - netbox_token
    injectors:
      env:
        NETBOX_API: !unsafe "{{ netbox_url }}"
        NETBOX_TOKEN: !unsafe "{{ netbox_token }}"
    state: present

# A 1Password lookup of a field that does not exist (or is empty) returns an empty
# string instead of failing, and update_secrets: false below would then never repair
# the credential: AWX would refuse to start jobs with "does not provide one or more
# required fields". So refuse empty or malformed values before any credential is
# created. The messages name the item and field, never a value.
- name: Refuse a NetBox URL that is empty or not https
  ansible.builtin.assert:
    that: zabbix_awx_netbox_url is match('^https://[^\s]+$')
    fail_msg: >-
      The NetBox URL read from 1Password item {{ zabbix_awx_op_netbox_item }}, field
      {{ zabbix_awx_op_netbox_url_field }}, is empty or does not start with https:// (the
      API token is sent to it, so plain http is refused). Use a field that holds the
      full URL (override with -e zabbix_awx_op_netbox_url_field).
    quiet: true

- name: Refuse an empty NetBox token
  ansible.builtin.assert:
    that: zabbix_awx_netbox_token | trim | length > 0
    fail_msg: >-
      The NetBox token read from 1Password item {{ zabbix_awx_op_netbox_item }}, field
      {{ zabbix_awx_op_netbox_token_field }}, is empty (override with
      -e zabbix_awx_op_netbox_token_field).
    quiet: true

# The prefix is followed by a [1] class, not a bare 1, on purpose: the repo's gitleaks rule
# (AGE-SECRET-KEY- then letters or digits) flags the literal text, even in a regex.
- name: Refuse an age key that is empty or not an age secret key
  ansible.builtin.assert:
    that: zabbix_awx_sops_age_key is match('^AGE-SECRET-KEY-[1][QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}\Z')
    fail_msg: >-
      The age key read with `op read` from {{ zabbix_awx_op_sops_ref }} is empty or is not
      a complete age secret key (the prefix, then the digit 1, then 58 characters): the attachment
      must be the age key file; override the reference with -e zabbix_awx_op_sops_ref.
    quiet: true

# update_secrets: false sets the secret inputs when the credential is created
# and leaves them alone afterwards, so a second run reports changed=0 (AWX never
# returns secret values, so they cannot be compared). Rotate a secret by running
# with -e zabbix_awx_update_secrets=true.
- name: Ensure the SOPS age key credential exists
  awx.awx.credential:
    name: infra-cd-sops
    organization: "{{ zabbix_awx_org }}"
    credential_type: infra-cd-sops
    inputs:
      age_key: "{{ zabbix_awx_sops_age_key }}"
    update_secrets: "{{ zabbix_awx_update_secrets | default(false) | bool }}"
    state: present
  no_log: true

- name: Ensure the NetBox credential exists
  awx.awx.credential:
    name: infra-cd-netbox
    organization: "{{ zabbix_awx_org }}"
    credential_type: infra-cd-netbox
    inputs:
      netbox_url: "{{ zabbix_awx_netbox_url }}"
      netbox_token: "{{ zabbix_awx_netbox_token }}"
    update_secrets: "{{ zabbix_awx_update_secrets | default(false) | bool }}"
    state: present
  no_log: true

# Fail early with a readable message instead of AWX's "Invalid certificate or key".
# The value is the rebuilt key (see playbook.yml); empty means 1Password returned
# nothing usable for the item/field, or no BEGIN/END markers.
- name: Refuse an empty or non-key SSH private key
  ansible.builtin.assert:
    that:
      - zabbix_awx_ssh_private_key is search('^-----BEGIN [A-Z ]*PRIVATE KEY-----')
      - zabbix_awx_ssh_private_key | length > 200
    fail_msg: >-
      The SSH private key read from 1Password item {{ zabbix_awx_op_ssh_item }},
      field {{ zabbix_awx_op_ssh_field }}, is empty or is not a PEM/OpenSSH private
      key (needs the BEGIN/END lines). Check the item, or override
      zabbix_awx_op_ssh_item / zabbix_awx_op_ssh_field with -e.
    quiet: true

# No become password and no stored sudo secret: the account has NOPASSWD sudo.
# The role installs exactly ONE key on the guests, so a public key that is not the pair of
# the private key in the credential makes the first apply lock AWX out of up to 5 hosts.
# Derive the public half from the private key and compare the key material (type and
# base64, not the comment).
# ssh-keygen refuses a key read from a pipe (/dev/stdin), so it goes through a 0600 temp
# file that is always removed.
- name: Derive the public key from the SSH private key
  block:
    - name: Make a private temp file for the key
      ansible.builtin.tempfile:
        state: file
        prefix: awx-key-check-
      register: zabbix_awx_key_tmp
      changed_when: false
      check_mode: false

    - name: Write the private key to it
      ansible.builtin.copy:
        content: "{{ zabbix_awx_ssh_private_key }}"
        dest: "{{ zabbix_awx_key_tmp.path }}"
        mode: "0600"
      no_log: true
      changed_when: false
      check_mode: false

    - name: Derive the public key
      ansible.builtin.command:
        argv: [ssh-keygen, -y, -f, "{{ zabbix_awx_key_tmp.path }}"]
      register: zabbix_awx_derived_public_key
      changed_when: false
      check_mode: false
      no_log: true
  always:
    - name: Remove the temp file
      ansible.builtin.file:
        path: "{{ zabbix_awx_key_tmp.path }}"
        state: absent
      when: zabbix_awx_key_tmp.path is defined
      changed_when: false
      check_mode: false

- name: Refuse a public key that is not the pair of the private key
  ansible.builtin.assert:
    that: >-
      (zabbix_awx_derived_public_key.stdout.split()[:2] | join(' '))
      == (zabbix_awx_guest_public_key.split()[:2] | join(' '))
    fail_msg: >-
      The public_key field of {{ zabbix_awx_op_ssh_item }} is not the pair of its private key
      (the Notes). Installing it would lock AWX out of the guests.
    quiet: true

- name: Ensure the guest SSH (Machine) credential exists
  awx.awx.credential:
    name: awx-guest-ssh
    organization: "{{ zabbix_awx_org }}"
    credential_type: Machine
    inputs:
      username: "{{ zabbix_awx_guest_user }}"
      ssh_key_data: "{{ zabbix_awx_ssh_private_key }}"
    update_secrets: "{{ zabbix_awx_update_secrets | default(false) | bool }}"
    state: present
  no_log: true

# --- inventories -------------------------------------------------------------

- name: Ensure the inventories exist
  awx.awx.inventory:
    name: "{{ item }}"
    organization: "{{ zabbix_awx_org }}"
    state: present
  loop:
    - zabbix-hosts
    - zabbix-agent

# The Zabbix API endpoint, created by hand with its non-secret connection
# variables only (copied from ansible/zabbix-hosts/inventory.yml, which is never
# imported). Its address, port and API token come from the SOPS host_vars next to
# the playbook, decrypted inside the job.
- name: Ensure the zabbix_server host exists in zabbix-hosts
  awx.awx.host:
    name: zabbix_server
    inventory: zabbix-hosts
    variables:
      ansible_connection: ansible.netcommon.httpapi
      ansible_network_os: community.zabbix.zabbix
      ansible_httpapi_use_ssl: true
      ansible_httpapi_validate_certs: true
    state: present

- name: Ensure the zabbix group exists in zabbix-hosts
  awx.awx.group:
    name: zabbix
    inventory: zabbix-hosts
    hosts:
      - zabbix_server
    state: present

# Both inventories read the same NetBox query file the roles use on a
# workstation. overwrite is meant to remove only hosts this source imported, so
# the manually created zabbix_server host above survives a sync. Verified live on
# 2026-11-14: zabbix-hosts-check, which targets that host after its launch-time NetBox
# sync, ran and reported changed=0.
- name: Ensure the NetBox inventory sources exist
  awx.awx.inventory_source:
    name: netbox
    inventory: "{{ item }}"
    source: scm
    source_project: "{{ zabbix_awx_project }}"
    source_path: ansible/zabbix-hosts/netbox.yml
    credential: infra-cd-netbox
    execution_environment: "{{ zabbix_awx_ee_name }}"
    overwrite: true
    overwrite_vars: false
    update_on_launch: true
    update_cache_timeout: 300
    verbosity: 1
    state: present
  loop:
    - zabbix-hosts
    - zabbix-agent

# --- job templates -----------------------------------------------------------
# Playbook paths are the role directories so group_vars/host_vars (including the
# SOPS ones) resolve next to the playbook, as on a workstation.
#
# Everything a launcher could use to change what runs is switched off: no launch
# extra variables, no inventory/credential/job-type/EE/branch prompts. zabbix-agent
# prompts for a limit and one optional survey answer, and its default limit matches
# no host, so a launch without a deliberate limit does nothing. A survey cannot
# enforce a limit, so ansible/zabbix-agent/playbook.yml enforces it itself, before it
# contacts any host: an allowlist of exact inventory host or group names, capped in size. extra_vars here is
# template-level, not launch-level: ansible_user must beat the group_vars value
# (which names the workstation login) and make AWX log in as its own account.
- name: Ensure the zabbix-hosts job templates exist
  awx.awx.job_template:
    name: "zabbix-hosts-{{ item.name }}"
    organization: "{{ zabbix_awx_org }}"
    project: "{{ zabbix_awx_project }}"
    inventory: zabbix-hosts
    playbook: ansible/zabbix-hosts/playbook.yml
    execution_environment: "{{ zabbix_awx_ee_name }}"
    job_type: "{{ item.job_type }}"
    credentials:
      - infra-cd-sops
    diff_mode: true
    verbosity: 0
    timeout: 1800
    allow_simultaneous: false
    ask_inventory_on_launch: false
    ask_credential_on_launch: false
    ask_job_type_on_launch: false
    ask_variables_on_launch: false
    ask_limit_on_launch: false
    ask_scm_branch_on_launch: false
    ask_diff_mode_on_launch: false
    ask_verbosity_on_launch: false
    ask_tags_on_launch: false
    ask_skip_tags_on_launch: false
    ask_execution_environment_on_launch: false
    ask_instance_groups_on_launch: false
    ask_forks_on_launch: false
    ask_job_slice_count_on_launch: false
    ask_timeout_on_launch: false
    ask_labels_on_launch: false
    survey_enabled: false
    notification_templates_error:
      - "{{ zabbix_awx_error_notification }}"
    state: present
  loop:
    - { name: check, job_type: check }
    - { name: apply, job_type: run }
  loop_control:
    label: "zabbix-hosts-{{ item.name }}"

- name: Ensure the zabbix-agent job templates exist
  awx.awx.job_template:
    name: "zabbix-agent-{{ item.name }}"
    organization: "{{ zabbix_awx_org }}"
    project: "{{ zabbix_awx_project }}"
    inventory: zabbix-agent
    playbook: ansible/zabbix-agent/playbook.yml
    execution_environment: "{{ zabbix_awx_ee_name }}"
    job_type: "{{ item.job_type }}"
    credentials:
      - infra-cd-sops
      - awx-guest-ssh
    become_enabled: true
    limit: __limit_required__
    extra_vars:
      ansible_user: "{{ zabbix_awx_guest_user }}"
    diff_mode: true
    verbosity: 0
    timeout: 3600
    allow_simultaneous: false
    ask_inventory_on_launch: false
    ask_credential_on_launch: false
    ask_job_type_on_launch: false
    ask_variables_on_launch: false
    ask_limit_on_launch: true
    ask_scm_branch_on_launch: false
    ask_diff_mode_on_launch: false
    ask_verbosity_on_launch: false
    ask_tags_on_launch: false
    ask_skip_tags_on_launch: false
    ask_execution_environment_on_launch: false
    ask_instance_groups_on_launch: false
    ask_forks_on_launch: false
    ask_job_slice_count_on_launch: false
    ask_timeout_on_launch: false
    ask_labels_on_launch: false
    # One optional answer: an address to reach ONE host at instead of its NetBox
    # one (guests only reachable that way). A survey cannot validate it; the
    # zabbix-agent playbook refuses anything but an IP address and anything but
    # exactly one limited host, and group_vars applies it only as ssh -o HostName=.
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Address override for a single host (leave empty normally)
          question_description: IP address to connect to instead of the NetBox one. Needs a limit that selects exactly one host.
          variable: awx_target_address
          type: text
          required: false
          default: ""
          min: 0
          max: 45
    notification_templates_error:
      - "{{ zabbix_awx_error_notification }}"
    state: present
  loop:
    - { name: check, job_type: check }
    - { name: apply, job_type: run }
  loop_control:
    label: "zabbix-agent-{{ item.name }}"

# Deliberate runs over the whole inventory (CODE-123: "the full host list"). The
# playbook caps a normal run at a few hosts; these two templates lift only that cap
# and accept the name `all`, through zabbix_agent_allow_full_run set HERE, as a
# template-level extra variable. A launcher cannot reach it (no prompt for extra
# variables, no survey, the limit is fixed to `all`), and the operators team is NOT
# granted Execute on them: only an administrator launches a full run. The address
# override stays unavailable (it needs exactly one host). Run the check first.
- name: Ensure the zabbix-agent full-run job templates exist
  awx.awx.job_template:
    name: "zabbix-agent-{{ item.name }}-all"
    organization: "{{ zabbix_awx_org }}"
    project: "{{ zabbix_awx_project }}"
    inventory: zabbix-agent
    playbook: ansible/zabbix-agent/playbook.yml
    execution_environment: "{{ zabbix_awx_ee_name }}"
    job_type: "{{ item.job_type }}"
    credentials:
      - infra-cd-sops
      - awx-guest-ssh
    become_enabled: true
    limit: all
    extra_vars:
      ansible_user: "{{ zabbix_awx_guest_user }}"
      zabbix_agent_allow_full_run: true
    diff_mode: true
    verbosity: 0
    timeout: 7200
    allow_simultaneous: false
    ask_inventory_on_launch: false
    ask_credential_on_launch: false
    ask_job_type_on_launch: false
    ask_variables_on_launch: false
    ask_limit_on_launch: false
    ask_scm_branch_on_launch: false
    ask_diff_mode_on_launch: false
    ask_verbosity_on_launch: false
    ask_tags_on_launch: false
    ask_skip_tags_on_launch: false
    ask_execution_environment_on_launch: false
    ask_instance_groups_on_launch: false
    ask_forks_on_launch: false
    ask_job_slice_count_on_launch: false
    ask_timeout_on_launch: false
    ask_labels_on_launch: false
    survey_enabled: false
    notification_templates_error:
      - "{{ zabbix_awx_error_notification }}"
    state: present
  loop:
    - { name: check, job_type: check }
    - { name: apply, job_type: run }
  loop_control:
    label: "zabbix-agent-{{ item.name }}-all"

# awx-guest-access from AWX (CODE-123): change where the AWX key may be used from on
# hosts that ALREADY have the awx-ansible account (AWX logs in as that account, so a new
# host still needs a workstation run). NOT for key rotation: the role installs exactly one
# key while the Machine credential keeps the old private key, so rotate from a workstation.
# No Execute grant is made for the operators team, no survey, no extra-variable prompt;
# the key and the source list are template-level extra variables. This playbook does not
# remove other Execute grants (direct, another team, organization-wide, or on an adopted
# template of the same name): audit the templates' Access tab. The playbook's first play
# (awx_require_limit) enforces exact names, at most 5 hosts, never the whole inventory; the
# main play then runs one host at a time and stops at the first failure, including a
# failed reconnect. A wrong source list still locks AWX out of the first host it is
# applied to, so launch the check, then ONE host, then a second job to prove it.
- name: Ensure the awx-guest-access job templates exist
  awx.awx.job_template:
    name: "awx-guest-access-{{ item.name }}"
    organization: "{{ zabbix_awx_org }}"
    project: "{{ zabbix_awx_project }}"
    inventory: zabbix-agent
    playbook: ansible/awx-guest-access/playbook.yml
    execution_environment: "{{ zabbix_awx_ee_name }}"
    job_type: "{{ item.job_type }}"
    credentials:
      - infra-cd-sops
      - awx-guest-ssh
    become_enabled: true
    limit: __limit_required__
    extra_vars:
      ansible_user: "{{ zabbix_awx_guest_user }}"
      awx_require_limit: true
      awx_access_public_key: "{{ zabbix_awx_guest_public_key }}"
      awx_access_from: "{{ zabbix_awx_guest_access_from }}"
    diff_mode: true
    verbosity: 0
    timeout: 1800
    allow_simultaneous: false
    ask_inventory_on_launch: false
    ask_credential_on_launch: false
    ask_job_type_on_launch: false
    ask_variables_on_launch: false
    ask_limit_on_launch: true
    ask_scm_branch_on_launch: false
    ask_diff_mode_on_launch: false
    ask_verbosity_on_launch: false
    ask_tags_on_launch: false
    ask_skip_tags_on_launch: false
    ask_execution_environment_on_launch: false
    ask_instance_groups_on_launch: false
    ask_forks_on_launch: false
    ask_job_slice_count_on_launch: false
    ask_timeout_on_launch: false
    ask_labels_on_launch: false
    survey_enabled: false
    notification_templates_error:
      - "{{ zabbix_awx_error_notification }}"
    state: present
  loop:
    - { name: check, job_type: check }
    - { name: apply, job_type: run }
  loop_control:
    label: "awx-guest-access-{{ item.name }}"

# --- access ------------------------------------------------------------------
# Check templates hold the same secrets as apply ones (the age key, the SSH
# key), and their diff shows infrastructure details, so Execute is granted on
# both or neither, and only to this team. The full-run and awx-guest-access templates
# are left out on purpose: they get no grant, so only an administrator can launch them.
- name: Ensure the operators team exists
  awx.awx.team:
    name: "{{ zabbix_awx_team }}"
    organization: "{{ zabbix_awx_org }}"
    state: present

- name: Grant the operators team Execute on the four job templates
  awx.awx.role:
    team: "{{ zabbix_awx_team }}"
    role: execute
    job_templates:
      - "{{ item }}"
    state: present
  loop:
    - zabbix-hosts-check
    - zabbix-hosts-apply
    - zabbix-agent-check
    - zabbix-agent-apply

- name: Put the listed users in the operators team
  awx.awx.role:
    user: "{{ item }}"
    target_team: "{{ zabbix_awx_team }}"
    role: member
    state: present
  loop: "{{ zabbix_awx_operator_users }}"

- name: Give the listed users read-only access to the organization
  awx.awx.role:
    user: "{{ item }}"
    organization: "{{ zabbix_awx_org }}"
    role: auditor
    state: present
  loop: "{{ zabbix_awx_auditor_users }}"
