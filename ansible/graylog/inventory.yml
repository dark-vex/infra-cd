---
# Log-shipping clients for the self-hosted Graylog (Grafana Alloy -> OTLP gRPC).
# Server side (cert renewal, input config) is ansible/graylog-cert-renewal.
all:
  children:
    graylog_clients:
      hosts:
        haproxy1:
          # ansible_host is in host_vars/haproxy1.sops.yaml (SOPS-encrypted —
          # see ansible/CLAUDE.md). Mirrors ansible/haproxy's value; update both.
          graylog_expected_hostname: haproxy1
          graylog_log_sources:
            - name: haproxy
              path: /var/log/haproxy.log
              service: haproxy
        mail2:
          # Hetzner iRedMail host. ansible_host is in host_vars/mail2.sops.yaml.
          graylog_expected_hostname: mail2
          graylog_log_sources:
            - name: postfix
              path: /var/log/mail.log
              service: postfix
            - name: dovecot
              path: /var/log/dovecot/*.log
              service: dovecot
            # Globs that match nothing are harmless, so this stays even if
            # iRedAPD logs elsewhere on a given install.
            - name: iredapd
              path: /var/log/iredapd/*.log
              service: iredapd
        mail1-bio:
          # Bioadventures mail host (VM 103, plain Debian 12 Postfix/Dovecot —
          # not iRedMail). ansible_host and graylog_otlp_endpoint_override (the
          # site has to dial Graylog's internal address) are in
          # host_vars/mail1-bio.sops.yaml.
          graylog_expected_hostname: mail1
          graylog_log_sources:
            # Dovecot logs through syslog too, so mail.log carries both
            # services; there are no separate dovecot/iredapd log files.
            - name: mail
              path: /var/log/mail.log
              service: mail
