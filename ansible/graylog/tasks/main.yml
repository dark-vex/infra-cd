---
- name: Run preflight host-identity checks
  ansible.builtin.import_tasks: preflight.yml

- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Grafana APT GPG key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://apt.grafana.com/gpg.key \
      | gpg --dearmor -o /usr/share/keyrings/grafana.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/grafana.gpg

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: "alloy={{ alloy_version }}-1"
    state: present
    update_cache: true

- name: Let the alloy user read root:adm log files
  ansible.builtin.user:
    name: alloy
    groups: "{{ graylog_alloy_extra_groups }}"
    append: true
  notify: Restart alloy

- name: Create Alloy config directory
  ansible.builtin.file:
    path: "{{ alloy_config_dir }}"
    state: directory
    owner: alloy
    group: alloy
    mode: "0750"

# The config holds no hostname or secret — endpoint and token arrive through
# the environment (below), so a --check --diff of this file is safe to share.
- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: "{{ graylog_templates_dir }}/config.alloy.j2"
    dest: "{{ alloy_config_dir }}/config.alloy"
    owner: alloy
    group: alloy
    mode: "0640"
  notify: Restart alloy

- name: Point Alloy at the custom config path
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CONFIG_FILE='
    line: 'CONFIG_FILE="{{ alloy_config_dir }}/config.alloy"'
    create: true
    owner: root
    group: alloy
    mode: "0640"
  notify: Restart alloy

- name: Reset Alloy CUSTOM_ARGS to package default
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS=""'
    create: true
    owner: root
    group: alloy
    mode: "0640"
  notify: Restart alloy

# /etc/default/alloy is the unit's EnvironmentFile, so this is the least-exposed
# place for the token (root:alloy 0640) without putting it in config.alloy.
- name: Set Graylog OTLP endpoint for Alloy
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^GRAYLOG_OTLP_ENDPOINT='
    line: 'GRAYLOG_OTLP_ENDPOINT="{{ graylog_otlp_endpoint }}"'
    create: true
    owner: root
    group: alloy
    mode: "0640"
  no_log: true
  notify: Restart alloy

- name: Set Graylog OTLP bearer token for Alloy
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^GRAYLOG_OTLP_TOKEN='
    line: 'GRAYLOG_OTLP_TOKEN="{{ graylog_otlp_token }}"'
    create: true
    owner: root
    group: alloy
    mode: "0640"
  no_log: true
  notify: Restart alloy

- name: Enable Alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    daemon_reload: true

- name: Start Alloy service
  ansible.builtin.systemd:
    name: alloy
    state: started
  changed_when: false
