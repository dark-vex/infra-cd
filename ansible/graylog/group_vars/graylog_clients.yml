---
# Non-secret structure only. The Graylog OTLP endpoint and bearer token are NOT
# set here — playbook.yml fetches both from 1Password (Connect) and the role
# delivers them to Alloy via /etc/default/alloy. Requires the item below to have
# fields `url` (host:port, no scheme) and `bearer_token`; it is the same item
# kubenuc's Alloy uses, because Graylog's OTLP input accepts a single token.
# Optional per-host `graylog_otlp_endpoint_override` (host:port, e.g. an
# internal address) lives in host_vars/<host>.sops.yaml, not here: a host behind
# the same NAT as Graylog cannot reach the public address (connection refused),
# so it dials the internal one. TLS still verifies the endpoint's real hostname.
graylog_1password_vault: k8s_secrets
graylog_1password_item: Graylog_kubenuc

# Per-host log sources are set in inventory.yml: graylog_log_sources (files) and/or
# graylog_journal_sources (systemd units that log to journald, e.g.
# {name, unit: haproxy.service, service}). A host needs at least one.

# Pinned like the other Alloy roles; Renovate does not track apt packages.
alloy_version: "1.21.3"
alloy_config_dir: /etc/alloy

# Alloy runs as the unprivileged `alloy` user; /var/log files are root:adm 0640
# (mail2) or syslog:adm 0640 (haproxy1), so reading them needs the adm group.
graylog_alloy_extra_groups:
  - adm
