---
# Tears down the AWX-side objects of the retired Proxmox self-registration
# flow (CODE-125). Every task is `state: absent`, so a second run reports
# changed=0. Run manually against live AWX, not from CI. Nothing is created
# and no secrets are read except the AWX admin password.
#
# Usage:
#   ansible-playbook playbook.yml
#
# Requires OP_CONNECT_HOST / OP_CONNECT_TOKEN in the environment (for the
# AWX admin password lookup, see ansible/CLAUDE.md's "1Password via Ansible
# (Connect)" section) and the real sops binary + this repo's ansible/**
# age key available locally to decrypt host_vars/localhost.sops.yaml.
#
# No molecule/ scenario, deliberately: every task is a REST call against a
# live AWX controller, there is no local target to converge. Validated via
# `ansible-lint .` and `ansible-playbook --syntax-check`, then a live
# double run. The role is deleted in a follow-up PR once this has run.

- name: Remove AWX objects of the retired Proxmox self-registration flow
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    proxmox_selfreg_org: "Proxmox Self-Registration"
    proxmox_selfreg_name: proxmox-selfreg
    proxmox_selfreg_credential_type: proxmox-selfreg-secrets

    # awx_controller_host comes from host_vars/localhost.sops.yaml, loaded by
    # the community.sops.sops vars plugin (ansible.cfg).
    awx_controller_username: admin
    # The real password lives under a field named `admin_password_secret`
    # carrying a stray trailing tab (`| trim` strips it).
    awx_controller_password: >-
      {{ lookup('community.general.onepassword',
                 'awx_admin',
                 vault='k8s_secrets',
                 field='admin_password_secret',
                 connect_host=lookup('env', 'OP_CONNECT_HOST'),
                 connect_token=lookup('env', 'OP_CONNECT_TOKEN')) | trim }}

  tasks:
    - name: Run awx-selfreg-bootstrap tasks
      ansible.builtin.import_tasks: tasks/main.yml
