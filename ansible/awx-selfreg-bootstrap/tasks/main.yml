---
# Idempotent removal of the Proxmox self-registration objects in AWX, in
# dependency order (template, credential, credential type, project, inventory,
# organization). Each task is a no-op once the object is gone.

# Org-scoped lookups fail (rather than report absent) once the organization
# is gone, so gate those tasks on it still existing. This keeps real errors
# such as bad credentials fatal instead of masking them.
- name: Look up the self-registration organization
  ansible.builtin.set_fact:
    proxmox_selfreg_org_present: >-
      {{ (query('awx.awx.controller_api', 'organizations',
                query_params={'name': proxmox_selfreg_org},
                host=awx_controller_host,
                username=awx_controller_username,
                password=awx_controller_password,
                verify_ssl=true) | length) > 0 }}
  no_log: true

- name: Ensure the job template is absent
  awx.awx.job_template:
    name: "{{ proxmox_selfreg_name }}"
    organization: "{{ proxmox_selfreg_org }}"
    state: absent
    controller_host: "{{ awx_controller_host }}"
    controller_username: "{{ awx_controller_username }}"
    controller_password: "{{ awx_controller_password }}"
  when: proxmox_selfreg_org_present | bool

- name: Ensure the credential is absent
  awx.awx.credential:
    name: "{{ proxmox_selfreg_credential_type }}-cred"
    organization: "{{ proxmox_selfreg_org }}"
    credential_type: "{{ proxmox_selfreg_credential_type }}"
    state: absent
    controller_host: "{{ awx_controller_host }}"
    controller_username: "{{ awx_controller_username }}"
    controller_password: "{{ awx_controller_password }}"
  no_log: true
  when: proxmox_selfreg_org_present | bool

- name: Ensure the custom credential type is absent
  awx.awx.credential_type:
    name: "{{ proxmox_selfreg_credential_type }}"
    kind: cloud
    state: absent
    controller_host: "{{ awx_controller_host }}"
    controller_username: "{{ awx_controller_username }}"
    controller_password: "{{ awx_controller_password }}"

- name: Ensure the project is absent
  awx.awx.project:
    name: "{{ proxmox_selfreg_name }}"
    organization: "{{ proxmox_selfreg_org }}"
    state: absent
    controller_host: "{{ awx_controller_host }}"
    controller_username: "{{ awx_controller_username }}"
    controller_password: "{{ awx_controller_password }}"
  when: proxmox_selfreg_org_present | bool

- name: Ensure the inventory is absent
  awx.awx.inventory:
    name: "{{ proxmox_selfreg_name }}"
    organization: "{{ proxmox_selfreg_org }}"
    state: absent
    controller_host: "{{ awx_controller_host }}"
    controller_username: "{{ awx_controller_username }}"
    controller_password: "{{ awx_controller_password }}"
  when: proxmox_selfreg_org_present | bool

- name: Ensure the organization is absent
  awx.awx.organization:
    name: "{{ proxmox_selfreg_org }}"
    state: absent
    controller_host: "{{ awx_controller_host }}"
    controller_username: "{{ awx_controller_username }}"
    controller_password: "{{ awx_controller_password }}"

# The scoped launch user was minted by hand, so its name is not recorded in
# the repo. Find any AWX user with "selfreg" in the username and delete it
# (its tokens go with it).
- name: Find leftover self-registration launch users
  ansible.builtin.set_fact:
    proxmox_selfreg_users: >-
      {{ query('awx.awx.controller_api', 'users',
               query_params={'username__icontains': 'selfreg'},
               host=awx_controller_host,
               username=awx_controller_username,
               password=awx_controller_password,
               verify_ssl=true)
         | map(attribute='username') | list }}
  no_log: true

- name: Report the launch users that will be deleted
  ansible.builtin.debug:
    msg: "Deleting AWX users: {{ proxmox_selfreg_users }}"
  when: proxmox_selfreg_users | length > 0

- name: Ensure the self-registration launch users are absent
  awx.awx.user:
    username: "{{ item }}"
    state: absent
    controller_host: "{{ awx_controller_host }}"
    controller_username: "{{ awx_controller_username }}"
    controller_password: "{{ awx_controller_password }}"
  loop: "{{ proxmox_selfreg_users }}"
