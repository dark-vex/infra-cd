---
# Non-secret settings. They live in group_vars (not defaults/main.yml) because
# this directory is wired into playbook.yml with import_tasks, not as a real
# role, so defaults/ would never load (see ansible/CLAUDE.md).

# Template linked to every managed host.
# The production Zabbix still carries the legacy template set: the agent-based Linux
# template there is "Template OS Linux". The Molecule instance (Zabbix 7.0) overrides
# this with "Linux by Zabbix agent" in molecule.yml.
zabbix_hosts_templates:
  - Template OS Linux

# Host groups every managed host joins, besides one group per NetBox site.
zabbix_hosts_groups:
  - Linux servers

# Prefix of the per-site host group (the NetBox site slug is appended).
zabbix_hosts_site_group_prefix: "NetBox/"

# New hosts are created DISABLED: a host without a running agent only raises
# "unavailable" alerts. Enable a host in Zabbix once its agent is rolled out.
# Hosts that already exist in Zabbix (matched by address) are never touched.
zabbix_hosts_new_status: disabled

# Agent interface port.
zabbix_hosts_agent_port: "10050"

# Tag written on every host the role creates, so the managed set is visible in Zabbix.
zabbix_hosts_tags:
  - tag: managed-by
    value: ansible

# Old host name -> new host name: fixes names that were mistyped in the UI.
# Applied only when the old host exists and the new name is free (CODE-120).
zabbix_hosts_renames:
  hpevilsor: hpelvisor

# JSON-RPC endpoint of the Zabbix API, built from the zabbix_server connection vars.
# ansible_zabbix_url_path is the web root of the frontend ("zabbix" is the plugin
# default; set it to "" when the frontend sits at the root of its host name).
zabbix_hosts_api_url: >-
  {%- set tls = ansible_httpapi_use_ssl | default(true) -%}
  {%- set path = ansible_zabbix_url_path | default('zabbix') -%}
  {{ ('https' if tls else 'http') ~ '://' ~ ansible_host ~ ':'
     ~ (ansible_httpapi_port | default(443 if tls else 80)) ~ '/'
     ~ ((path ~ '/') if path else '') ~ 'api_jsonrpc.php' }}

# Set to true only to let a run with no desired hosts succeed (never in normal use:
# an empty list usually means NetBox was not read).
zabbix_hosts_allow_empty: false

# Test and one-off override: a list of {name, ip, site} that replaces the list
# derived from NetBox. Leave unset in normal runs.
# zabbix_hosts_desired_override: []

# --- TLS-PSK for the host records (CODE-124 step 1) -----------------------------------
# Workstation-only: never set these in AWX (the job templates take no extra vars of their
# own and an unattended run must not rewrite host records). Needs the TLS-PSK master (the
# same SOPS file zabbix-agent reads) and an EXACT list of host names, at most
# zabbix_hosts_tls_max_hosts of them, every one a NetBox-derived host:
#   -e zabbix_hosts_tls_enable=true -e '{"zabbix_hosts_tls_hosts": ["vm-a", "vm-b"]}'
# A --check run prints the plan and writes nothing.
zabbix_hosts_tls_enable: false
zabbix_hosts_tls_hosts: []
zabbix_hosts_tls_max_hosts: 5
# psk (default) or unencrypted: `unencrypted` only puts tls_connect back to 1 (rollback, and
# the first step of a rotation); it never touches the key or the generation tag.
zabbix_hosts_tls_connect: psk
# Re-push key + identity + generation tag to a host that is already tls_connect=PSK with the
# current generation (rotation after bumping zabbix_agent_tls_generation, or a repair).
zabbix_hosts_tls_force_rekey: false
# The server applies a host change at its next configuration cache sync
# (CacheUpdateFrequency, 10 s by default, longer where tuned): judge health only after
# this pause. Rolling back tls_connect is NOT instant, it takes one sync as well.
zabbix_hosts_tls_cache_wait_seconds: 60
# Where the shared secret and derivation live (the zabbix-agent role owns them).
zabbix_hosts_tls_master_file: "{{ playbook_dir }}/../zabbix-agent/secrets/tls-psk.sops.yaml"
zabbix_hosts_tls_derivation_file: "{{ playbook_dir }}/../zabbix-agent/vars/tls_derivation.yml"
