---
# netbox.netbox dynamic inventory source, read-only against the live NetBox API
# (inventory writes only ever go through terraform/netbox/*.tf, per the repo root
# CLAUDE.md).
#
# The endpoint is NOT set in this file: the plugin reads it from the environment
# itself (NETBOX_API). A Jinja lookup() in api_endpoint is not rendered by this
# plugin with ansible-core 2.21 and fails with "unknown url type". The NetBox MCP
# server uses NETBOX_URL for the same value, so run:
#   export NETBOX_API="$NETBOX_URL"
# The token comes from NETBOX_TOKEN (see the token block below for why it is set here).
#
# Scope (owner decision, CODE-120/CODE-121): every VM and LXC that is active and
# has a primary IPv4, except the Kubernetes nodes (tag kubernetes-node, set in
# terraform/netbox). Devices (hypervisors, firewalls, switches) are NOT taken
# from NetBox here; the few SNMP devices Zabbix already monitors are not touched.
#
# ansible_host is the primary IPv4 address (nb_inventory's default), which is
# what the Zabbix agent interface uses. Verify the result before the first run:
#   ansible-inventory --graph -i inventory.yml -i netbox.yml
plugin: netbox.netbox.nb_inventory
validate_certs: true
# NetBox 4.5+ tokens ("nbt_<key>.<secret>") must be sent as "Authorization: Bearer
# <token>"; the plugin sends "Token <token>" for a plain string, which NetBox
# answers with "Permission denied". Giving a type and a value fixes that, and the
# type follows the token's prefix so an older 40-character token still works. The
# value is read from NETBOX_TOKEN here, because a plain token option and the
# environment fallback cannot carry a type.
token:
  type: "{{ 'Bearer' if lookup('ansible.builtin.env', 'NETBOX_TOKEN').startswith('nbt_') else 'Token' }}"
  value: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
# Exclude every device: id 0 matches nothing.
device_query_filters:
  - id: 0
vm_query_filters:
  - status: active
  - has_primary_ip: true
  - tag__n: kubernetes-node
group_by:
  - sites
