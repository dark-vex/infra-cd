---
# netbox.netbox dynamic inventory source, read-only against the live NetBox API
# (inventory writes only ever go through terraform/netbox/*.tf, per the repo root
# CLAUDE.md). NETBOX_URL / NETBOX_TOKEN are the same env vars as the NetBox MCP
# server (see the root README's "Claude Code MCP Setup").
#
# Scope (owner decision, CODE-120/CODE-121): every VM and LXC that is active and
# has a primary IPv4, except the Kubernetes nodes (tag kubernetes-node, set in
# terraform/netbox). Devices (hypervisors, firewalls, switches) are NOT taken
# from NetBox here; the few SNMP devices Zabbix already monitors are not touched.
#
# ansible_host is the primary IPv4 address (nb_inventory's default), which is
# what the Zabbix agent interface uses. Verify the result before the first run:
#   ansible-inventory --graph -i inventory.yml -i netbox.yml
plugin: netbox.netbox.nb_inventory
api_endpoint: "{{ lookup('ansible.builtin.env', 'NETBOX_URL') }}"
token: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
validate_certs: true
# Exclude every device: id 0 matches nothing.
device_query_filters:
  - id: 0
vm_query_filters:
  - status: active
  - has_primary_ip: true
  - tag__n: kubernetes-node
group_by:
  - sites
