[defaults]
# Enables the community.sops.sops vars plugin so host_vars/*.sops.yaml is
# auto-decrypted (SOPS_AGE_KEY_FILE must be set at run time). host_group_vars
# must stay listed: this replaces, not appends to, the default vars plugin
# list. Only takes effect when ansible-playbook's cwd is this directory; the
# ansible-agent container sets ANSIBLE_VARS_ENABLED instead (see
# ansible/CLAUDE.md).
vars_plugins_enabled = host_group_vars, community.sops.sops

# The static inventory only holds the Zabbix API endpoint; the hosts to monitor
# come from NetBox (netbox.yml), the source of truth for hosts (CODE-113).
inventory = inventory.yml,netbox.yml

[inventory]
# Replaces ansible-core's default plugin list, so the stock plugins are
# re-listed next to netbox.netbox.nb_inventory.
enable_plugins = host_list, script, auto, yaml, ini, toml, netbox.netbox.nb_inventory

# A source that cannot be parsed (NetBox unreachable, bad token) is an error, not a
# warning: otherwise the play carries on with an empty host list.
unparsed_is_failed = True
