---
# Installs the Zabbix agent on the guests NetBox lists for monitoring (the same
# hosts ansible/zabbix-hosts created in Zabbix, still disabled there).
#
# Run order for a new batch:
#   1. export NETBOX_API="$NETBOX_URL" NETBOX_TOKEN=...  and SOPS_AGE_KEY_FILE
#   2. ansible-playbook playbook.yml --limit <host> --check --diff
#   3. the same without --check, then wait for the host to turn green in Zabbix
#      and enable it there (it was created disabled).
# --limit is mandatory (enforced by the first play below): the inventory is every
# monitored VM. The network must let the Zabbix server reach port 10050 on the
# guest (site-to-site firewalls, Proxmox firewall, host firewall).
#
# group_vars/all.sops.yaml (SOPS) provides zabbix_agent_server and ansible_user.
#
# TLS-PSK (CODE-124): zabbix_agent_tls_mode is off by default. mixed/psk are set per site in
# a plaintext group_vars/sites_<slug>.yml or with -e on a workstation, never globally; psk
# also needs -e zabbix_agent_serial=1. See ansible/CLAUDE.md for the rollout order.
# Runs first and never contacts a host (connection: local, no facts): the inventory is
# every monitored VM, so a run must name what it is for. Under AWX the job template
# prompts for a limit only, and a survey cannot enforce one, so this is the
# enforcement. It is an ALLOWLIST, not a denylist: Ansible host patterns are a language
# (`!x` and `&x` imply `all`, `~re`, globs, `@file`), and every spelling that is not a
# plain name is refused instead of trying to recognise the dangerous ones. A limit that
# matches no host never reaches this play: ansible-playbook itself stops with "leaves us
# with no hosts to target" (rc 1), which is what the AWX default limit
# (__limit_required__) relies on.
- name: Refuse an unsafe target before any host is contacted
  hosts: all
  connection: local
  gather_facts: false
  become: false

  tasks:
    # Shape: plain names separated by commas, nothing else. This rejects every pattern
    # metacharacter (* ? ! & ~ @ [ ] : and whitespace), so no pattern can widen the run.
    - name: Refuse a run without a deliberate --limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
          - ansible_limit is match('^[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*\Z')
        fail_msg: >-
          --limit is mandatory for this playbook, on a workstation as well as in AWX,
          and must be exact host or group names separated by commas: no patterns
          (* ? ! & ~ @ [ ] :), no spaces, no trailing comma, not "all". The inventory is
          every monitored VM. Received (between brackets, so stray characters show):
          [{{ ansible_limit | default('(unset)') }}]
        quiet: true
      run_once: true

    # Exactness: every name must be a real inventory host or group. `all` is a valid name
    # only for a deliberate full run (zabbix_agent_allow_full_run, below).
    - name: Refuse a limit that is not made of exact inventory host or group names
      ansible.builtin.assert:
        that:
          - >-
            ansible_limit.split(',')
            | difference(groups['all'] + (groups.keys()
              | reject('in', ['ungrouped'] + ([] if (zabbix_agent_allow_full_run | default(false) | bool) else ['all']))
              | list))
            | length == 0
        fail_msg: >-
          --limit is mandatory and must name inventory hosts or groups EXACTLY (the
          NetBox name, often a FQDN: a short name or a glob matches nothing here).
          Received: [{{ ansible_limit | default('(unset)') }}]
        quiet: true
      run_once: true

    # Size: a group can still cover everything, so cap the run, and never the whole
    # inventory (unless it has one host). A deliberate full run is the exception:
    # zabbix_agent_allow_full_run is set on a dedicated AWX job template as a TEMPLATE-level
    # extra variable, which only an administrator of that template can change (a launch
    # prompt or a survey answer would be reachable by anyone with Execute, and there are
    # none for it), or with -e on a workstation. Everything else above still applies:
    # no patterns, only exact names or `all`. Any value that is not a real boolean
    # (a typo) counts as "not set".
    - name: Refuse a run that selects too many hosts
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length <= (zabbix_agent_max_hosts_per_run | int)
          - groups['all'] | length == 1 or ansible_play_hosts_all | length < groups['all'] | length
        fail_msg: >-
          --limit selects {{ ansible_play_hosts_all | length }} of {{ groups['all'] | length }}
          hosts; a run may touch at most {{ zabbix_agent_max_hosts_per_run }} and never the
          whole inventory (zabbix_agent_max_hosts_per_run in group_vars/all.yml).
        quiet: true
      run_once: true
      when: not (zabbix_agent_allow_full_run | default(false) | bool)

    # awx_target_address (an AWX survey answer) reaches ONE host at another address than
    # its NetBox one, for hosts only reachable that way (group_vars/all.yml turns it into
    # an ssh -o HostName= option, never a free-form ssh argument). The destination is an
    # ssh connection made with the AWX key, so a launcher-chosen address would let a
    # launcher aim it at a machine of their own: it must be a real, canonical IP address
    # inside a range an administrator allowed in SOPS (zabbix_agent_target_address_allowed),
    # and the feature is OFF until that list is set. AWX sends an unanswered optional
    # survey question as null (not "" and not undefined), and default('') only replaces
    # undefined: default('', true) makes null, "" and a missing variable all mean
    # "no override".
    - name: Refuse an awx_target_address that is not an IP address
      ansible.builtin.assert:
        that:
          - awx_target_address is match('^[0-9a-fA-F:.]+\Z')
          - (awx_target_address | ansible.utils.ipaddr('address')) == awx_target_address
        fail_msg: >-
          awx_target_address must be an IP address in canonical form (not a name, a
          prefix, a short form or an address with leading zeros).
        quiet: true
      run_once: true
      when: awx_target_address | default('', true) | length > 0

    - name: Refuse an awx_target_address for more than one host
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: >-
          the limit must select exactly one host when awx_target_address is set, got
          {{ ansible_play_hosts_all | length }}.
        quiet: true
      run_once: true
      when: awx_target_address | default('', true) | length > 0

    - name: Refuse an awx_target_address when no address range is allowed
      ansible.builtin.assert:
        that: zabbix_agent_target_address_allowed | default([]) | length > 0
        fail_msg: >-
          address overrides are not enabled: zabbix_agent_target_address_allowed (a list
          of CIDR ranges, in group_vars/all.sops.yaml) is empty.
        quiet: true
      run_once: true
      when: awx_target_address | default('', true) | length > 0

    - name: Check whether awx_target_address is inside an allowed range
      ansible.builtin.set_fact:
        zabbix_agent_target_in_allowed: >-
          {% set ns = namespace(ok=false) -%}
          {% for cidr in zabbix_agent_target_address_allowed | default([]) -%}
          {% if awx_target_address | ansible.utils.ipaddr(cidr) %}{% set ns.ok = true %}{% endif -%}
          {% endfor -%}
          {{ ns.ok }}
      run_once: true
      when: awx_target_address | default('', true) | length > 0

    - name: Refuse an awx_target_address outside the allowed ranges
      ansible.builtin.assert:
        that: zabbix_agent_target_in_allowed | bool
        fail_msg: >-
          awx_target_address is outside the allowed address ranges
          (zabbix_agent_target_address_allowed).
        quiet: true
      run_once: true
      when: awx_target_address | default('', true) | length > 0

- name: Install the Zabbix agent
  hosts: all
  become: true
  gather_facts: true
  # One host at a time for a TLS-PSK rollout: -e zabbix_agent_serial=1. A play keyword
  # cannot read group_vars, so the `psk` mode refuses to run without it (tasks/tls_prepare.yml);
  # the default 0 keeps every other run in one batch, as before. With serial 1 a failed
  # host ends the play (a batch whose hosts all failed stops it).
  serial: "{{ zabbix_agent_serial | default(0) }}"
  # A restart notified by the template task must survive a failure of a later task
  # (e.g. the service start): otherwise the next run sees no diff and never restarts.
  force_handlers: true

  tasks:
    - name: Run the Zabbix agent tasks
      ansible.builtin.import_tasks: tasks/main.yml

  handlers:
    - name: Run the Zabbix agent handlers
      ansible.builtin.import_tasks: handlers/main.yml
