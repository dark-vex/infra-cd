---
# Installs the Zabbix agent (passive checks) on the guests that ansible/zabbix-hosts
# created in Zabbix. Hostname is inventory_hostname, which is the NetBox name and
# therefore the technical name Zabbix has for the host. A host that already has an
# agent is left alone (zabbix_agent_skip_if_installed).
- name: Refuse to run without the Zabbix server address
  ansible.builtin.assert:
    that:
      - zabbix_agent_server is defined
      - zabbix_agent_server | length > 0
    fail_msg: >-
      zabbix_agent_server is not set. Put it in group_vars/all.sops.yaml (see the
      .example next to it) and make sure SOPS_AGE_KEY_FILE is exported.

- name: Refuse an unsupported operating system
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      {{ inventory_hostname }} is not Debian-family; this role only knows apt.

# NetBox says which address belongs to which guest, but DHCP guests can swap leases: the
# address may then answer for a different machine, which would get an agent that
# reports under the wrong name. The machine's own hostname must be the NetBox name
# (compared by its first label, since NetBox holds FQDNs for some guests), unless the
# machine is known to be named differently: zabbix_agent_hostname_overrides is a list of
# "netbox-name=real-hostname" strings in group_vars/all.sops.yaml (a list of strings, not
# a dict, because SOPS leaves dict keys in plaintext and these are host names). The
# real hostname may be given short or as an FQDN.
- name: Refuse a machine whose own hostname is not the one NetBox names
  ansible.builtin.assert:
    that: >-
      (ansible_facts['hostname'] | lower)
      == (zabbix_agent_expected_hostname | lower)
    fail_msg: >-
      {{ inventory_hostname }} answered at {{ ansible_host | default('its address') }},
      but that machine's hostname is {{ ansible_facts['hostname'] }}, not
      {{ zabbix_agent_expected_hostname }}. NetBox probably lists a stale address (DHCP
      lease change): fix the address in NetBox first; nothing was changed. If the machine
      is legitimately named differently, add "{{ inventory_hostname }}=<its hostname>"
      to zabbix_agent_hostname_overrides in group_vars/all.sops.yaml.
  vars:
    zabbix_agent_hostname_map: >-
      {{ dict(zabbix_agent_hostname_overrides | default([]) | map('split', '=') | list) }}
    # Only the first label is compared, on both sides: Ansible's hostname fact is the
    # short name even when the machine's hostname is an FQDN, so an override may be
    # written either way (pbs or pbs.example.invalid).
    zabbix_agent_expected_hostname: >-
      {{ zabbix_agent_hostname_map.get(inventory_hostname, inventory_hostname).split('.')[0] }}
  when: zabbix_agent_check_hostname

# dpkg-query instead of package_facts: it needs no python3-apt on the target and
# touches nothing, so a host this role will skip is left exactly as it was (no apt
# refresh, no cache change). Patterns that match nothing make dpkg-query exit 1 with
# the matches still printed, so the exit code is ignored.
- name: List the installed Zabbix packages
  ansible.builtin.command: >-
    dpkg-query -W -f '${db:Status-Abbrev} ${Package}\n'
    zabbix-agent zabbix-agent2 'zabbix-server-*' 'zabbix-proxy-*'
  register: zabbix_agent_dpkg
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the current agent configuration, if any
  ansible.builtin.slurp:
    src: "{{ zabbix_agent_conf_path }}"
  register: zabbix_agent_current_conf
  failed_when: false

# "Foreign" = an agent (or a Zabbix server/proxy, whose agent config must not be
# replaced) that this role did not set up: its config lacks the managed marker. A
# host this role configured earlier carries the marker, so it is reconciled again
# (a changed server address or template reaches it) instead of being skipped for ever.
- name: Work out whether the host is running an agent this role does not own
  ansible.builtin.set_fact:
    zabbix_agent_foreign: >-
      {{ (zabbix_agent_dpkg.stdout_lines | select('match', '^ii ') | list | length > 0)
         and not (zabbix_agent_current_conf.content | default('') | b64decode
                  is search('Managed by ansible/zabbix-agent')) }}

- name: Report the host that has an agent of its own and is left alone
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} already runs a Zabbix agent or server it owns, not touched"
  when: zabbix_agent_foreign and zabbix_agent_skip_if_installed

- name: Skip the host that has an agent of its own
  ansible.builtin.meta: end_host
  when: zabbix_agent_foreign and zabbix_agent_skip_if_installed

# The official repository, when a version is set. The sources file is written with
# copy (deb822 format), not deb822_repository, which would need python3-debian on the
# target. The key is pinned by checksum.
- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: "{{ zabbix_agent_repo_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: zabbix_agent_repo_version | length > 0

- name: Install the Zabbix repository signing key
  ansible.builtin.get_url:
    url: "{{ zabbix_agent_repo_key_url }}"
    dest: "{{ zabbix_agent_repo_key_path }}"
    checksum: "sha256:{{ zabbix_agent_repo_gpg_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: zabbix_agent_repo_version | length > 0
  register: zabbix_agent_repo_key

- name: Configure the Zabbix apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/zabbix.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible/zabbix-agent (CODE-121).
      Types: deb
      URIs: https://repo.zabbix.com/zabbix/{{ zabbix_agent_repo_version }}/{{ ansible_facts['distribution'] | lower }}
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: main
      Signed-By: {{ zabbix_agent_repo_key_path }}
  when: zabbix_agent_repo_version | length > 0
  register: zabbix_agent_repo

# In check mode the key and the sources file are not written, so on a host that does
# not have the repository yet nothing after this point can be previewed (the index
# would not list the package). The run then says so instead of failing.
- name: Work out whether this check run can preview the install
  ansible.builtin.set_fact:
    zabbix_agent_preview_only: >-
      {{ ansible_check_mode and (zabbix_agent_repo is changed or zabbix_agent_repo_key is changed) }}

# Only now, for a host this role will manage, is the package index refreshed. It runs
# in check mode too: a host with empty package lists (fresh cloud images, the
# Molecule base image) would otherwise look as if the agent package did not exist.
# Only apt's package lists change, nothing is installed.
# cache_valid_time would skip the update when the lists are recent, even though a
# repository was just added: force it then.
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if (zabbix_agent_repo is changed or zabbix_agent_repo_key is changed) else 3600 }}"
  check_mode: false

# Ubuntu 24.04 ships no zabbix-agent package at all (Debian 12 does), so an
# unavailable package is a known, actionable condition, not a mystery apt error.
- name: Check the agent package can be installed from the configured repositories
  ansible.builtin.command: apt-cache show {{ zabbix_agent_package }}
  register: zabbix_agent_package_probe
  changed_when: false
  failed_when: false
  check_mode: false
  # In check mode the repository file is not written, so the probe could not see the
  # package on a host that does not have the repository yet.
  when: not zabbix_agent_preview_only

- name: Refuse when the distribution has no agent package
  ansible.builtin.assert:
    that: zabbix_agent_package_probe.rc == 0
    fail_msg: >-
      The package {{ zabbix_agent_package }} is not available on
      {{ inventory_hostname }} ({{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}) from the configured
      repositories. Set zabbix_agent_repo_version to use the official Zabbix
      repository; nothing was changed.
  when: not zabbix_agent_preview_only

- name: Install the Zabbix agent
  ansible.builtin.apt:
    name: "{{ zabbix_agent_package }}"
    state: present
  register: zabbix_agent_install
  when: not zabbix_agent_preview_only

- name: Say that the install cannot be previewed in check mode
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: the Zabbix repository is not configured yet, so a check
      run cannot preview the agent install; run without --check to apply it.
  when: zabbix_agent_preview_only

- name: Write the agent configuration
  ansible.builtin.template:
    src: "{{ zabbix_agent_templates_dir }}/zabbix_agentd.conf.j2"
    dest: "{{ zabbix_agent_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the Zabbix agent
  # In check mode apt only simulates the install, so /etc/zabbix and the unit do not
  # exist yet on a fresh host: nothing below can be checked until a real run.
  when: not (zabbix_agent_preview_only or (ansible_check_mode and zabbix_agent_install is changed))

- name: Enable and start the Zabbix agent
  ansible.builtin.service:
    name: "{{ zabbix_agent_service }}"
    state: started
    enabled: true
  when: not (zabbix_agent_preview_only or (ansible_check_mode and zabbix_agent_install is changed))
