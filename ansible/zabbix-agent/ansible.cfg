
[defaults]
# Enables the community.sops.sops vars plugin so group_vars/all.sops.yaml is
# auto-decrypted (SOPS_AGE_KEY_FILE must be set at run time). host_group_vars
# must stay listed: this replaces, not appends to, the default vars plugin
# list. Only takes effect when ansible-playbook's cwd is this directory; the
# ansible-agent container sets ANSIBLE_VARS_ENABLED instead (see
# ansible/CLAUDE.md).
vars_plugins_enabled = host_group_vars, community.sops.sops

# Same host list as ansible/zabbix-hosts (NetBox is the source of truth for
# hosts, CODE-113): the agent is installed on the machines that role created in
# Zabbix, and inventory_hostname is the Zabbix technical name.
inventory = ../zabbix-hosts/netbox.yml

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml, netbox.netbox.nb_inventory

# A bad NetBox token or endpoint is an error, not a warning: otherwise the play
# carries on with an empty host list.
unparsed_is_failed = True
