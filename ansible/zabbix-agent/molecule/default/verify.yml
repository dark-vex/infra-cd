---
# converge.yml wires the tasks and handlers itself, so a playbook.yml that forgot to
# import the handler (the template task notifies it) would pass Molecule and fail
# the real run. This play checks the real playbook's wiring.
- name: Verify the real playbook wires the tasks and the handler
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook imports tasks/main.yml and handlers/main.yml
      ansible.builtin.assert:
        that:
          - "'tasks/main.yml' in lookup('ansible.builtin.file', playbook_dir ~ '/../../playbook.yml')"
          - "'handlers/main.yml' in lookup('ansible.builtin.file', playbook_dir ~ '/../../playbook.yml')"

# The guard lives in playbook.yml, which converge.yml never runs (it imports
# tasks/main.yml directly). Run the real playbook with unsafe targets: each must be
# refused by the first play, which uses connection: local and gathers no facts, so
# nothing is contacted and nothing can be changed. Every bypass spelling found by the
# CODE-123 reviews is here (an Ansible host pattern is a language: `!x` and `&x` imply
# `all`, `~re` and globs match everything, `@file` reads patterns from a file), because
# a denylist of "all" and "*" alone gave false assurance and let all of them through.
- name: Verify the real playbook refuses unsafe targets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    guard_playbook: "{{ playbook_dir }}/../../playbook.yml"
    four_hosts: "a1,a2,a3,a4,"
    allowed_ranges: '"zabbix_agent_target_address_allowed": ["192.0.2.0/24", "2001:db8::/32"]'
    mandatory: "--limit is mandatory"
    not_ip: "awx_target_address must be an IP address"
  tasks:
    - name: Make a limit file that lists every host
      ansible.builtin.tempfile:
        state: file
      register: limit_file

    - name: Put a catch-all pattern in it
      ansible.builtin.copy:
        content: "*\n"
        dest: "{{ limit_file.path }}"
        mode: "0600"

    - name: Run the playbook with targets that must be refused
      ansible.builtin.command:
        argv: >-
          {{ ['ansible-playbook', guard_playbook, '-i', item.inventory | default(four_hosts)]
             + item.args }}
      loop:
        - { name: no limit, args: [], message: "{{ mandatory }}" }
        - { name: limit all, args: ['--limit', 'all'], message: "{{ mandatory }}" }
        - { name: limit star, args: ['--limit', '*'], message: "{{ mandatory }}" }
        - { name: all inside a list, args: ['--limit', 'a1,all'], message: "{{ mandatory }}" }
        - { name: exclusion only (implies all), args: ['--limit', '!a9'], message: "{{ mandatory }}" }
        - { name: intersection only (implies all), args: ['--limit', '&a1'], message: "{{ mandatory }}" }
        - { name: exclusion after a name, args: ['--limit', 'a1,!a2'], message: "{{ mandatory }}" }
        - { name: regex matching every host, args: ['--limit', '~.*'], message: "{{ mandatory }}" }
        - { name: question mark glob, args: ['--limit', '?*'], message: "{{ mandatory }}" }
        - { name: double star, args: ['--limit', '**'], message: "{{ mandatory }}" }
        - { name: glob over a prefix, args: ['--limit', 'a*'], message: "{{ mandatory }}" }
        - { name: slice, args: ['--limit', 'all[0:]'], message: "{{ mandatory }}" }
        - { name: colon list, args: ['--limit', 'a1:a2'], message: "{{ mandatory }}" }
        - { name: whitespace, args: ['--limit', 'a1 a2'], message: "{{ mandatory }}" }
        - name: limit file with a catch-all
          args: ['--limit', '@{{ limit_file.path }}']
          message: "{{ mandatory }}"
        - name: every host by name (the whole inventory)
          args: ['--limit', 'a1,a2,a3,a4']
          message: "never the whole inventory"
        - name: more hosts than the cap
          args: ['--limit', 'a1,a2,a3', '-e', '{"zabbix_agent_max_hosts_per_run": 2}']
          message: "a run may touch at most 2"
        # Matches no host, so ansible-playbook itself refuses before any play runs.
        - name: AWX placeholder
          args: ['--limit', '__limit_required__']
          message: "leaves us with no hosts to target"
        - name: a name that is not in the inventory
          args: ['--limit', 'a1,zz9']
          message: "EXACTLY"
        - name: address override while the feature is off
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "192.0.2.5"}']
          message: "address overrides are not enabled"
        - name: address with a command appended
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "192.0.2.5;id", {{ allowed_ranges }}}']
          message: "{{ not_ip }}"
        - name: option smuggled in as the address
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "192.0.2.5 -o ProxyCommand=id", {{ allowed_ranges }}}']
          message: "{{ not_ip }}"
        - name: hex-letter DNS name
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "bad.de", {{ allowed_ranges }}}']
          message: "{{ not_ip }}"
        - name: bare hex word
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "cafe", {{ allowed_ranges }}}']
          message: "{{ not_ip }}"
        - name: out-of-range IPv4
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "300.1.1.1", {{ allowed_ranges }}}']
          message: "{{ not_ip }}"
        - name: short IPv4 form
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "192.0.2", {{ allowed_ranges }}}']
          message: "{{ not_ip }}"
        - name: prefix instead of an address
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "192.0.2.5/32", {{ allowed_ranges }}}']
          message: "{{ not_ip }}"
        - name: trailing newline
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "192.0.2.5\n", {{ allowed_ranges }}}']
          message: "{{ not_ip }}"
        - name: public address outside the allowed ranges
          args: ['--limit', 'a1', '-e', '{"awx_target_address": "198.51.100.1", {{ allowed_ranges }}}']
          message: "outside the allowed address ranges"
        - name: valid address for two hosts
          args: ['--limit', 'a1,a2', '-e', '{"awx_target_address": "192.0.2.5", {{ allowed_ranges }}}']
          message: "exactly one host"
        # The full-run flag (zabbix_agent_allow_full_run) lifts only the name `all` and the
        # cap. It must not widen anything else, and a typo must fail closed.
        - name: flag false still refuses all
          args: ['--limit', 'all', '-e', '{"zabbix_agent_allow_full_run": false}']
          message: "{{ mandatory }}"
        - name: flag typo fails closed
          args: ['--limit', 'all', '-e', 'zabbix_agent_allow_full_run=ture']
          message: "{{ mandatory }}"
        - name: flag does not allow an exclusion
          args: ['--limit', '!a9', '-e', '{"zabbix_agent_allow_full_run": true}']
          message: "{{ mandatory }}"
        - name: flag does not allow a glob
          args: ['--limit', 'a*', '-e', '{"zabbix_agent_allow_full_run": true}']
          message: "{{ mandatory }}"
        - name: flag does not allow a regex
          args: ['--limit', '~.*', '-e', '{"zabbix_agent_allow_full_run": true}']
          message: "{{ mandatory }}"
        - name: flag does not allow an unknown name next to all
          args: ['--limit', 'all,zz9', '-e', '{"zabbix_agent_allow_full_run": true}']
          message: "EXACTLY"
        - name: flag does not enable the address override for a full run
          args: ['--limit', 'all', '-e', '{"zabbix_agent_allow_full_run": true, "awx_target_address": "192.0.2.5", {{ allowed_ranges }}}']
          message: "exactly one host"
      loop_control:
        label: "{{ item.name }}"
      register: guard
      failed_when: guard.rc == 0 or item.message not in (guard.stdout ~ guard.stderr)
      changed_when: false

    - name: Remove the limit file
      ansible.builtin.file:
        path: "{{ limit_file.path }}"
        state: absent

    # The reverse: these runs must PASS the guard and reach the second play. AWX sends an
    # unanswered optional survey question as null, which once crashed the guard
    # ("object of type 'NoneType' has no len()") on the very first real launch. They go
    # on to fail in the second play (no zabbix_agent_server, or no sudo password), and
    # --check means nothing can change on the machine running Molecule either way.
    - name: Run the playbook with targets the guard must accept
      ansible.builtin.command:
        argv: >-
          {{ ['ansible-playbook', guard_playbook, '-i', four_hosts, '-c', 'local', '--check']
             + item.args }}
      loop:
        - { name: one host, args: ['--limit', 'a1'] }
        - { name: two hosts, args: ['--limit', 'a1,a2'] }
        - { name: three hosts, args: ['--limit', 'a1,a2,a3'] }
        - { name: unanswered survey (null), args: ['--limit', 'a1', '-e', '{"awx_target_address": null}'] }
        - { name: empty string, args: ['--limit', 'a1', '-e', '{"awx_target_address": ""}'] }
        - { name: IPv4 inside an allowed range, args: ['--limit', 'a1', '-e', '{"awx_target_address": "192.0.2.5", {{ allowed_ranges }}}'] }
        - { name: IPv6 inside an allowed range, args: ['--limit', 'a1', '-e', '{"awx_target_address": "2001:db8::1", {{ allowed_ranges }}}'] }
        - { name: full run with the flag (all), args: ['--limit', 'all', '-e', '{"zabbix_agent_allow_full_run": true}'] }
        - { name: full run with the flag (every name), args: ['--limit', 'a1,a2,a3,a4', '-e', '{"zabbix_agent_allow_full_run": true}'] }
      loop_control:
        label: "{{ item.name }}"
      register: accepted
      failed_when: >-
        'PLAY [Install the Zabbix agent]' not in accepted.stdout
        or 'NoneType' in (accepted.stdout ~ accepted.stderr)
      changed_when: false

- name: Verify the fresh hosts
  hosts: agent-debian12
  become: true
  gather_facts: false
  tasks:
    - name: Read the agent configuration
      ansible.builtin.slurp:
        src: /etc/zabbix/zabbix_agentd.conf
      register: conf

    - name: The configuration is the managed one
      ansible.builtin.assert:
        that:
          - "'Managed by ansible/zabbix-agent' in (conf.content | b64decode)"
          - "'Server=192.0.2.20' in (conf.content | b64decode).splitlines()"
          - "('Hostname=' ~ inventory_hostname) in (conf.content | b64decode).splitlines()"
          - "'ListenPort=10050' in (conf.content | b64decode).splitlines()"

    - name: Read the installed agent version
      ansible.builtin.command: zabbix_agentd -V
      register: agent_version
      changed_when: false

    - name: It is a Zabbix agent daemon
      ansible.builtin.assert:
        that: "'zabbix_agentd (daemon)' in agent_version.stdout"

    - name: The agent cannot autoregister (no active server configured)
      ansible.builtin.assert:
        that: >-
          (conf.content | b64decode).splitlines()
          | select('match', '^ServerActive=') | list | length == 0

    - name: The service is enabled and running
      ansible.builtin.service_facts:

    - name: Check the service state
      ansible.builtin.assert:
        that:
          - ansible_facts.services['zabbix-agent.service'].state == 'running'
          - ansible_facts.services['zabbix-agent.service'].status == 'enabled'

    # Port 10050 is open with the package's default config too; the log line proves
    # the running agent started with the managed Hostname (i.e. the handler restart
    # loaded our file).
    - name: Read the agent log
      ansible.builtin.slurp:
        src: /var/log/zabbix-agent/zabbix_agentd.log
      register: agent_log

    - name: The running agent loaded the managed configuration
      ansible.builtin.assert:
        that: "('Starting Zabbix Agent [' ~ inventory_hostname ~ ']') in (agent_log.content | b64decode)"

    - name: The changed address was rolled out and the agent restarted onto it
      ansible.builtin.assert:
        that: >-
          (agent_log.content | b64decode
           | regex_findall('Starting Zabbix Agent \\[' ~ inventory_hostname ~ '\\]')
           | length) >= 2

    - name: The agent listens on the passive port
      ansible.builtin.wait_for:
        port: 10050
        timeout: 20

- name: Verify the host that already had an agent
  hosts: agent-existing
  become: true
  gather_facts: false
  tasks:
    - name: Read the agent configuration
      ansible.builtin.slurp:
        src: /etc/zabbix/zabbix_agentd.conf
      register: conf

    - name: The operator's configuration is untouched
      ansible.builtin.assert:
        that:
          - "'# hand-tuned by an operator' in (conf.content | b64decode)"
          - "'Managed by ansible/zabbix-agent' not in (conf.content | b64decode)"

- name: Verify the host without an agent package was left untouched
  hosts: agent-ubuntu2404-norepo
  become: true
  gather_facts: false
  tasks:
    - name: List the installed agent packages
      ansible.builtin.command: dpkg-query -W -f '${Package}\n' zabbix-agent zabbix-agent2
      register: ubuntu_pkgs
      changed_when: false
      failed_when: false

    - name: No agent package was installed
      ansible.builtin.assert:
        that: ubuntu_pkgs.stdout | trim | length == 0

    - name: No agent was installed and no configuration written
      ansible.builtin.stat:
        path: /etc/zabbix/zabbix_agentd.conf
      register: conf
      failed_when: conf.stat.exists

- name: Verify the official repository was set up on Ubuntu 24.04
  hosts: agent-ubuntu2404-repo
  become: true
  gather_facts: false
  tasks:
    - name: Read the key file and the sources file
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /etc/apt/keyrings/zabbix-official-repo.asc
        - /etc/apt/sources.list.d/zabbix.sources
      register: repo_files

    - name: Both exist and the key is the pinned one
      ansible.builtin.assert:
        that:
          - repo_files.results | map(attribute='stat.exists') | list == [true, true]
          - repo_files.results[0].stat.checksum == '99780bf6013838c95a7f42405ab5c29ba2f7baf6085ff56f0f0fca2fa002be30'

    - name: List the package indexes apt fetched
      ansible.builtin.find:
        paths: /var/lib/apt/lists
        patterns: "repo.zabbix.com_zabbix_7.0_ubuntu*"
      register: repo_lists

    - name: Apt accepted the repository's signature and fetched its index
      ansible.builtin.assert:
        that: repo_lists.matched > 0

    - name: No agent was installed (no arm64 package, so the role stopped)
      ansible.builtin.stat:
        path: /etc/zabbix/zabbix_agentd.conf
      register: conf
      failed_when: conf.stat.exists
