---
# converge.yml wires the tasks and handlers itself, so a playbook.yml that forgot to
# import the handler (the template task notifies it) would pass Molecule and fail
# the real run. This play checks the real playbook's wiring.
- name: Verify the real playbook wires the tasks and the handler
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook imports tasks/main.yml and handlers/main.yml
      ansible.builtin.assert:
        that:
          - "'tasks/main.yml' in lookup('ansible.builtin.file', playbook_dir ~ '/../../playbook.yml')"
          - "'handlers/main.yml' in lookup('ansible.builtin.file', playbook_dir ~ '/../../playbook.yml')"

- name: Verify the fresh hosts
  hosts: agent-debian12
  become: true
  gather_facts: false
  tasks:
    - name: Read the agent configuration
      ansible.builtin.slurp:
        src: /etc/zabbix/zabbix_agentd.conf
      register: conf

    - name: The configuration is the managed one
      ansible.builtin.assert:
        that:
          - "'Managed by ansible/zabbix-agent' in (conf.content | b64decode)"
          - "'Server=192.0.2.20' in (conf.content | b64decode).splitlines()"
          - "('Hostname=' ~ inventory_hostname) in (conf.content | b64decode).splitlines()"
          - "'ListenPort=10050' in (conf.content | b64decode).splitlines()"

    - name: Read the installed agent version
      ansible.builtin.command: zabbix_agentd -V
      register: agent_version
      changed_when: false

    - name: It is a Zabbix agent daemon
      ansible.builtin.assert:
        that: "'zabbix_agentd (daemon)' in agent_version.stdout"

    - name: The agent cannot autoregister (no active server configured)
      ansible.builtin.assert:
        that: >-
          (conf.content | b64decode).splitlines()
          | select('match', '^ServerActive=') | list | length == 0

    - name: The service is enabled and running
      ansible.builtin.service_facts:

    - name: Check the service state
      ansible.builtin.assert:
        that:
          - ansible_facts.services['zabbix-agent.service'].state == 'running'
          - ansible_facts.services['zabbix-agent.service'].status == 'enabled'

    # Port 10050 is open with the package's default config too; the log line proves
    # the running agent started with the managed Hostname (i.e. the handler restart
    # loaded our file).
    - name: Read the agent log
      ansible.builtin.slurp:
        src: /var/log/zabbix-agent/zabbix_agentd.log
      register: agent_log

    - name: The running agent loaded the managed configuration
      ansible.builtin.assert:
        that: "('Starting Zabbix Agent [' ~ inventory_hostname ~ ']') in (agent_log.content | b64decode)"

    - name: The changed address was rolled out and the agent restarted onto it
      ansible.builtin.assert:
        that: >-
          (agent_log.content | b64decode
           | regex_findall('Starting Zabbix Agent \\[' ~ inventory_hostname ~ '\\]')
           | length) >= 2

    - name: The agent listens on the passive port
      ansible.builtin.wait_for:
        port: 10050
        timeout: 20

- name: Verify the host that already had an agent
  hosts: agent-existing
  become: true
  gather_facts: false
  tasks:
    - name: Read the agent configuration
      ansible.builtin.slurp:
        src: /etc/zabbix/zabbix_agentd.conf
      register: conf

    - name: The operator's configuration is untouched
      ansible.builtin.assert:
        that:
          - "'# hand-tuned by an operator' in (conf.content | b64decode)"
          - "'Managed by ansible/zabbix-agent' not in (conf.content | b64decode)"

- name: Verify the host without an agent package was left untouched
  hosts: agent-ubuntu2404-norepo
  become: true
  gather_facts: false
  tasks:
    - name: List the installed agent packages
      ansible.builtin.command: dpkg-query -W -f '${Package}\n' zabbix-agent zabbix-agent2
      register: ubuntu_pkgs
      changed_when: false
      failed_when: false

    - name: No agent package was installed
      ansible.builtin.assert:
        that: ubuntu_pkgs.stdout | trim | length == 0

    - name: No agent was installed and no configuration written
      ansible.builtin.stat:
        path: /etc/zabbix/zabbix_agentd.conf
      register: conf
      failed_when: conf.stat.exists

- name: Verify the official repository was set up on Ubuntu 24.04
  hosts: agent-ubuntu2404-repo
  become: true
  gather_facts: false
  tasks:
    - name: Read the key file and the sources file
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /etc/apt/keyrings/zabbix-official-repo.asc
        - /etc/apt/sources.list.d/zabbix.sources
      register: repo_files

    - name: Both exist and the key is the pinned one
      ansible.builtin.assert:
        that:
          - repo_files.results | map(attribute='stat.exists') | list == [true, true]
          - repo_files.results[0].stat.checksum == '99780bf6013838c95a7f42405ab5c29ba2f7baf6085ff56f0f0fca2fa002be30'

    - name: List the package indexes apt fetched
      ansible.builtin.find:
        paths: /var/lib/apt/lists
        patterns: "repo.zabbix.com_zabbix_7.0_ubuntu*"
      register: repo_lists

    - name: Apt accepted the repository's signature and fetched its index
      ansible.builtin.assert:
        that: repo_lists.matched > 0

    - name: No agent was installed (no arm64 package, so the role stopped)
      ansible.builtin.stat:
        path: /etc/zabbix/zabbix_agentd.conf
      register: conf
      failed_when: conf.stat.exists
