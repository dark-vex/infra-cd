---
# Re-reconciles a host this role already configured with another server address: the
# marker is present, so the role must rewrite the file and restart the agent (the
# path idempotence cannot prove, because it only repeats the same values).
- name: Change the server address on a managed host
  hosts: agent-debian12
  become: true
  gather_facts: true
  force_handlers: true

  vars:
    zabbix_agent_server: 192.0.2.20

  vars_files:
    - ../../group_vars/all.yml

  pre_tasks:
    - name: Point the templates dir at the role
      ansible.builtin.set_fact:
        zabbix_agent_templates_dir: "{{ playbook_dir }}/../../templates"

  tasks:
    - name: Run the Zabbix agent tasks
      ansible.builtin.import_tasks: ../../tasks/main.yml

  handlers:
    - name: Import the handlers
      ansible.builtin.import_tasks: ../../handlers/main.yml
