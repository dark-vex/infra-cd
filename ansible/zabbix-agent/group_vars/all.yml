---
# Non-secret settings. They live in group_vars (not defaults/main.yml) because
# this directory is wired into playbook.yml with import_tasks, not as a real
# role, so defaults/ would never load (see ansible/CLAUDE.md). The address the
# agent accepts connections from (zabbix_agent_server) and the SSH user are
# infrastructure details and live in group_vars/all.sops.yaml (SOPS); see
# group_vars/all.sops.yaml.example.

zabbix_agent_templates_dir: "{{ playbook_dir }}/templates"
zabbix_agent_package: zabbix-agent
zabbix_agent_service: zabbix-agent
zabbix_agent_conf_path: /etc/zabbix/zabbix_agentd.conf
zabbix_agent_listen_port: 10050
# Refuse a machine whose own hostname differs from the NetBox name (first label), so a
# stale address can never put an agent on the wrong guest. Override per host only.
zabbix_agent_check_hostname: true
# Empty = listen on every interface (the agent default). Set it per host or per
# site to confine the agent to the management address; the access control is the
# source address in zabbix_agent_server plus, once zabbix_agent_tls_mode is `psk`, the
# pre-shared key (CODE-124 step 1).
zabbix_agent_listen_ip: ""
# Official Zabbix apt repository (the server is 7.0.x; an agent must not be newer than
# the server, so keep this on the server's major). Ubuntu 24.04 ships no zabbix-agent
# package at all, and one version everywhere beats a mix of distribution packages.
# Set it to "" to use the distribution package instead (Debian only). The signing key
# is pinned by checksum, so an upstream key change fails the run instead of being
# trusted silently: re-fetch https://repo.zabbix.com/zabbix-official-repo.key, check
# the fingerprints against Zabbix's documentation and update the checksum.
zabbix_agent_repo_version: "7.0"
zabbix_agent_repo_key_url: https://repo.zabbix.com/zabbix-official-repo.key
zabbix_agent_repo_gpg_sha256: 99780bf6013838c95a7f42405ab5c29ba2f7baf6085ff56f0f0fca2fa002be30
zabbix_agent_repo_key_path: /etc/apt/keyrings/zabbix-official-repo.asc

# The two packages lay their files out differently; the agent exits at start if the
# Include directory does not exist (found by Molecule).
zabbix_agent_log_file: >-
  {{ '/var/log/zabbix/zabbix_agentd.log' if zabbix_agent_repo_version | length > 0
     else '/var/log/zabbix-agent/zabbix_agentd.log' }}
zabbix_agent_include_dir: >-
  {{ '/etc/zabbix/zabbix_agentd.d' if zabbix_agent_repo_version | length > 0
     else '/etc/zabbix/zabbix_agentd.conf.d' }}

# A host that already has an agent package is reported and left alone: its
# configuration may be hand-tuned and this role replaces the whole file. Set to
# false for a one-off run that should take such a host over.
zabbix_agent_skip_if_installed: true

# One-host address override for guests that cannot be reached at their NetBox address
# (set from an AWX survey answer; empty otherwise). It is applied only as an ssh
# HostName option, after playbook.yml has checked it is an IP address and that the
# limit selects exactly one host. Never accept a free-form ansible_ssh_common_args.
#
# An unanswered AWX survey question arrives as null, which overrides the "" below and
# crashes a plain `| length`: default('', true) treats null, "" and undefined alike.
awx_target_address: ""
ansible_ssh_common_args: >-
  {{ ('-o HostName=' ~ awx_target_address)
     if (awx_target_address | default('', true) | length > 0) else '' }}

# Most hosts one run may touch, and never the whole inventory (see the first play of
# playbook.yml). A site group larger than this must be done in parts.
zabbix_agent_max_hosts_per_run: 5


# A deliberate run over the whole inventory (limit `all`, no host cap). Never set it here
# or in a prompt or survey: it is a TEMPLATE-level extra variable of the two dedicated
# full-run AWX job templates (see ansible/awx-zabbix-bootstrap), or -e on a workstation.
# The address override stays refused with it (that needs exactly one host).
zabbix_agent_allow_full_run: false

# --- TLS-PSK (CODE-124 step 1) ----------------------------------------------------
# off   : no TLS lines in the config, byte-identical to the pre-PSK config (default).
# mixed : TLSAccept=unencrypted,psk - plain and PSK polls both answered (migration).
# psk   : TLSAccept=psk - plain polls refused. Guarded: see tasks/tls.yml.
# Never set a non-off value here or in any one committed global place: set it per site in
# a PLAINTEXT group_vars/sites_<slug>.yml, or with -e from a workstation (canary).
# AWX job templates take no extra vars of their own, so a global value would reach every
# host the next AWX run touches (including the full-run templates).
zabbix_agent_tls_mode: "off"
# The key generation (zabbix_agent_tls_generation) is in vars/tls_derivation.yml, the one
# file both this role and zabbix-hosts read; -e overrides it for a one-host rotation.
zabbix_agent_tls_psk_file: /etc/zabbix/zabbix_agentd.psk
# The master (exactly 64 hex characters) lives in its own SOPS file, loaded only when
# the mode is not `off` (see secrets/tls-psk.sops.yaml.example). A value already defined
# (Molecule stub, -e from a workstation) wins and skips the load.
zabbix_agent_tls_master_file: "{{ playbook_dir }}/secrets/tls-psk.sops.yaml"
# Zabbix API connection used by the guard that runs before `psk` (same file zabbix-hosts
# reads); loaded into a NAMESPACED variable so its ansible_host never replaces the
# agent's own.
zabbix_agent_tls_api_conn_file: "{{ playbook_dir }}/../zabbix-hosts/host_vars/zabbix_server.sops.yaml"
# Keys whose parameterised forms make the agent open outbound connections or fetch URLs
# on the poller's behalf (SSRF pivot). Rendered only when the mode is not `off`.
# Verified 2026-11-27 against the production Zabbix (all templates, prototypes, LLD rules
# and host-level items): none of these breaks a passive agent item. The first draft denied
# `net.tcp.*[*]` and `net.udp.*[*]`, which would have broken `net.tcp.listen[...]` in the
# Amavisd template; `*.listen` only inspects local sockets, so it stays allowed.
# `net.tcp.service` and `net.udp.service` items in the other templates are simple checks
# run by the server itself, so DenyKey never applies to them. Re-run the enumeration when
# a template with agent items is added.
zabbix_agent_deny_keys:
  - "web.page.*[*]"
  - "net.tcp.port[*]"
  - "net.tcp.service[*]"
  - "net.tcp.service.perf[*]"
  - "net.udp.service[*]"
  - "net.udp.service.perf[*]"
  - "net.dns[*]"
  - "net.dns.*[*]"
