---
# Two platforms — one in k3s_server, one in k3s_agent — so verify.yml can
# assert the server/agent task-conditional split actually behaves
# differently per host, not just that the tasks don't error.
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: k3s-embedded-registry-server-test
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - k3s_server
  - name: k3s-embedded-registry-agent-test
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - k3s_agent
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  inventory:
    host_vars:
      k3s-embedded-registry-server-test:
        ansible_python_interpreter: /usr/bin/python3
      k3s-embedded-registry-agent-test:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
