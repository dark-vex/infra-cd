---
# ---------------------------------------------------------------------------
# System prerequisites
# ---------------------------------------------------------------------------

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - python3-debian  # required by ansible.builtin.deb822_repository
    state: present

# ---------------------------------------------------------------------------
# Teleport node service
# ---------------------------------------------------------------------------
# Duplicated (not shared) with ansible/teleport-server/tasks/main.yml's
# install steps — this repo's roles are self-contained top-level dirs with
# no shared-role mechanism; ~10 lines of duplication here is consistent with
# existing conventions rather than introducing a new shared-role layer.

- name: Add Teleport APT GPG key
  ansible.builtin.shell: |
    curl -fsSL https://apt.releases.teleport.dev/gpg -o /usr/share/keyrings/teleport-archive-keyring.asc
  args:
    creates: /usr/share/keyrings/teleport-archive-keyring.asc

# apt_repository is deprecated (removed in ansible-core 2.25); deb822_repository
# writes teleport.sources. Drop the one-line teleport.list that earlier runs of this
# role left behind, or apt would see the same repo defined twice.
- name: Remove the legacy one-line Teleport APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/teleport.list
    state: absent

- name: Add Teleport APT repository
  ansible.builtin.deb822_repository:
    name: teleport
    types: deb
    uris: "https://apt.releases.teleport.dev/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "stable/v{{ teleport_version.split('.')[0] }}"
    signed_by: /usr/share/keyrings/teleport-archive-keyring.asc
    state: present

- name: Install Teleport package
  ansible.builtin.apt:
    name: "teleport={{ teleport_version }}"
    state: present
    update_cache: true

- name: Deploy Teleport node config
  ansible.builtin.template:
    src: "{{ teleport_templates_dir }}/teleport.yaml.j2"
    dest: /etc/teleport.yaml
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Restart teleport

- name: Enable Teleport service
  ansible.builtin.systemd:
    name: teleport
    enabled: true
    daemon_reload: true

- name: Start Teleport service
  ansible.builtin.systemd:
    name: teleport
    state: started
  changed_when: false
