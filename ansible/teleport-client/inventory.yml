all:
  children:
    teleport_client:
      hosts:
        # mon-bgy (CODE-32): removed. Its inventory entry here was declared
        # intent that was never actually applied — live state (proxmox-rabbit
        # MCP, before decommission) showed no teleport process running on it,
        # only the pve-host-netmon Alloy config mistakenly deployed there
        # instead of bare-metal rabbit-01-psp. The LXC itself was destroyed
        # in the same change (see terraform/proxmox/rabbit/lxc.tf).
        mon-lug:
          # ansible_host is in host_vars/mon-lug.sops.yaml (SOPS-encrypted —
          # see ansible/CLAUDE.md)
          teleport_labels:
            site: lug
            role: monitoring-node

        # mon-mxp (CODE-91): removed with its LXC (see
        # terraform/proxmox/ec200/ec200.tf). Its Teleport node registration
        # on the proxy can be deleted once the LXC is gone.
