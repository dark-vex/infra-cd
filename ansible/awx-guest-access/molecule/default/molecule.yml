---
# Native-arch systemd containers: Debian 12 and Ubuntu 24.04, the two families
# the guests run. Nothing here needs amd64 packages (sudo and openssh only).
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: access-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: access-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: auto_silent
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    # A real --check on fresh hosts, where the account does not exist yet: the key
    # task must step aside instead of failing (found on the first live use).
    - check
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
