---
# netbox.netbox dynamic inventory source — read-only against the live
# NetBox API (same posture as the NetBox MCP server convention documented in
# the repo root CLAUDE.md: inventory writes only ever go through
# terraform/netbox/*.tf, never from here).
#
# Composed ALONGSIDE inventory.yml (see ansible.cfg's `inventory =` list),
# not replacing it — this only ever supplies ansible_host from NetBox's
# primary IPv4; graylog's other vars (e.g.
# graylog_cert_renewal_lineage_dir) stay in host_vars/graylog.sops.yaml as
# before.
#
# This is currently the one example wired up repo-wide (see
# ansible/CLAUDE.md and docs/proxmox-modules-cloud-init-handoff-plan.md's
# sibling PR for context): `graylog` is one of the few NetBox-tracked
# VMs/LXCs with a real netbox_primary_ip today
# (terraform/netbox/primary-ips.tf). Most DHCP-networked guests don't have
# one yet, so copying this pattern to another role before its host has a
# primary IP in NetBox will just produce an inventory entry with no
# ansible_host. Verify with `ansible-inventory --graph -i inventory.yml -i
# netbox.yml` before relying on this.
#
# NETBOX_API / NETBOX_TOKEN: the plugin reads the endpoint from NETBOX_API itself
# (api_endpoint is not set here: a Jinja lookup() in it is not rendered by this plugin
# with ansible-core 2.21 and fails with "unknown url type"). The NetBox MCP server uses
# NETBOX_URL for the same value, so export both:
#   export NETBOX_API="$NETBOX_URL"
# See the repo root README's "Claude Code MCP Setup" section for how to export the URL
# and token from 1Password.
#
# Filtered by NetBox VM id (not hostname/FQDN) — ansible/CLAUDE.md's
# graylog-cert-renewal entry says the box hostname lives only in
# host_vars/graylog.sops.yaml, never in cleartext, and this file is the one
# place that convention would otherwise get broken. The id is a VM id, so devices are
# excluded outright (id 0 matches nothing): a plain query_filters id would also match a
# device that happens to have the same number.
plugin: netbox.netbox.nb_inventory
validate_certs: true
# NetBox 4.5+ tokens ("nbt_<key>.<secret>") must be sent as "Authorization: Bearer
# <token>"; the plugin sends "Token <token>" for a plain string, which NetBox answers
# with "Permission denied". Giving a type and a value fixes that, and the type follows
# the token's prefix so an older 40-character token still works. The value is read from
# NETBOX_TOKEN here, because a plain token option and the environment fallback cannot
# carry a type.
token:
  type: "{{ 'Bearer' if lookup('ansible.builtin.env', 'NETBOX_TOKEN').startswith('nbt_') else 'Token' }}"
  value: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
device_query_filters:
  - id: 0
vm_query_filters:
  - id: 20
