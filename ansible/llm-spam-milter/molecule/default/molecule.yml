---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: llm-spam-milter-test
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  inventory:
    host_vars:
      llm-spam-milter-test:
        ansible_python_interpreter: auto_silent
verifier:
  name: ansible
scenario:
  # `check` runs converge.yml with --check on the FRESH host, which is exactly the
  # documented first rollout step (`--check --diff`). Molecule did not cover it
  # before, and the first live dry run failed in preflight because read-only
  # command tasks are skipped in check mode.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
