---
# Ansible Galaxy collection requirements for infra-cd.
# Install with: ansible-galaxy collection install -r ansible/requirements.yml
# (already done for the ansible-agent image — see
# docker/agents/ansible/Dockerfile).
collections:
  # Unpinned, same as community.sops in docker/agents/ansible/Dockerfile —
  # collection versions aren't tracked by Renovate in this repo. Re-pin
  # explicitly if a future version breaks the nb_inventory plugin.
  - name: netbox.netbox
  # Provisions AWX objects for the proxmox-selfreg job template
  # (ansible/awx-selfreg-bootstrap) via the AWX REST API — Red Hat's own
  # collection, version-matched to the AWX release it manages rather than
  # tracked by Renovate, same convention as netbox.netbox above.
  - name: awx.awx
  # Manages the Zabbix hosts from NetBox (ansible/zabbix-hosts): the host,
  # hostgroup and host_info modules and the httpapi plugin. Unpinned, same
  # convention as the collections above (not tracked by Renovate).
  - name: community.zabbix
  - name: ansible.netcommon
  - name: community.docker
