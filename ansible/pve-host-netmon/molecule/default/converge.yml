---
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    netmon_templates_dir: "{{ playbook_dir }}/../../templates"
    grafana_api_key: "test-grafana-key"
    grafana_metrics_username: "123456"
    grafana_prometheus_url: "https://prometheus-prod-01.grafana.net/api/prom/push"

  vars_files:
    - ../../group_vars/pve_hosts.yml

  tasks:
    # set_fact (not a play `vars:` entry) so this wins over group_vars/pve_hosts.yml's
    # netmon_expected_hostname default, which converge.yml loads via vars_files below —
    # vars_files outranks play vars in Ansible's precedence order. Self-matches the
    # happy path regardless of the test container's own hostname.
    - name: Self-match expected hostname for Molecule
      ansible.builtin.set_fact:
        netmon_expected_hostname: "{{ ansible_hostname }}"

    - name: Run host netmon tasks
      ansible.builtin.import_tasks: ../../tasks/main.yml

  handlers:
    - import_tasks: ../../handlers/main.yml
