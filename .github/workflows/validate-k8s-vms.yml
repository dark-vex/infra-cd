---
name: k8s-vms-e2e

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'clusters/k8s-vms-daniele/**'

jobs:
  detect-changes:
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      deploy_apps: ${{ steps.detect.outputs.deploy_apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: detect
        run: |
          # Infra baseline for k3s-prod-test — always deployed.
          INFRA_APPS=""

          # Detect changed app directories in k8s-vms-daniele.
          # The grep requires a further '/' after 'apps/' so a changed file
          # sitting directly in apps/ (e.g. apps/kustomization.yaml itself)
          # is never mistaken for an app name — cut -d'/' -f1 would
          # otherwise turn a bare 'apps/kustomization.yaml' diff into the
          # literal bogus app name 'kustomization.yaml'. The fail-closed
          # per-app loop below correctly treats an unrecognized app as an
          # error, so this exclusion has to be structural, not accidental
          # (see clusters/kubenuc's validate-kubenuc.yml for where this bit
          # first, on PR #1791).
          CHANGED=$(git diff --name-only origin/main...HEAD \
            | grep -E 'clusters/k8s-vms-daniele/apps/.+/' \
            | sed 's|clusters/k8s-vms-daniele/apps/||' \
            | cut -d'/' -f1 \
            | sort -u \
            | tr '\n' ' ')

          # cloudflare and fluxcd used to be filtered out right here via a
          # grep -vE, invisibly, before the fail-closed per-app loop in the
          # "Deploy infra baseline and changed apps" step could ever see
          # them or say why. That's now consolidated: both are documented
          # entries in that step's EXCLUDED_APPS array instead, checked
          # before every other resolution path — the single place an
          # excluded app's reason is visible. Let everything through here
          # unfiltered.
          ALL_APPS=$(echo "$INFRA_APPS $CHANGED" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
          echo "Deploying apps: $ALL_APPS"
          echo "deploy_apps=$ALL_APPS" >> "$GITHUB_OUTPUT"

  cluster-test:
    needs: detect-changes
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: kubenuc-test
    timeout-minutes: 120
    env:
      DEPLOY_APPS: ${{ needs.detect-changes.outputs.deploy_apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '>=3.11'

      - name: Setup Flux
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
        with:
          version: 2.9.5

      - name: Setup k3s
        run: |
          set -euo pipefail

          # Install k3s
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable=traefik --write-kubeconfig-mode=644" sh -
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown $(id -u):$(id -g) ~/.kube/config

          # Helper: wait for systemd unit to become active
          wait_for_unit() {
            local unit="$1"
            local timeout="${2:-120}" # seconds
            local interval=5
            local waited=0

            if ! command -v systemctl >/dev/null 2>&1; then
              echo "systemctl not present on runner; cannot check systemd unit $unit"
              return 2
            fi

            echo "Checking systemd unit: $unit"

            # Ensure unit file exists in systemd
            if ! sudo systemctl list-unit-files | grep -q "^${unit}\."; then
              echo "Unit ${unit} not found in systemd unit-files. Continuing to poll in case it appears..."
            fi

            while [ $waited -lt "$timeout" ]; do
              # Check whether the unit is active
              if sudo systemctl is-active --quiet "$unit"; then
                echo "Unit ${unit} is active"
                # Also make sure it's not in a failed state
                if sudo systemctl is-failed --quiet "$unit"; then
                  echo "Unit ${unit} is in failed state"
                  return 3
                fi
                return 0
              fi

              # Show transient status periodically to aid debugging
              echo "[$((waited + interval))/${timeout}] unit ${unit} not active yet. status:"
              sudo systemctl status "$unit" --no-pager -n 3 || true

              sleep $interval
              waited=$((waited + interval))
            done

            echo "Timed out waiting for ${unit} to become active (timeout=${timeout}s)."
            echo "Last 200 journal lines for ${unit}:"
            sudo journalctl -u "$unit" --no-pager -n 200 || true
            return 1
          }

          # Wait for k3s systemd unit to be active (returns non-zero on failure)
          wait_for_unit k3s 180

          # Optional: ensure enabled
          if command -v systemctl >/dev/null 2>&1; then
            if sudo systemctl is-enabled --quiet k3s; then
              echo "k3s unit is enabled"
            else
              echo "k3s unit is not enabled (continuing; service may still be running)"
            fi
          fi

          # Wait for Kubernetes node to be Ready (longer/retry-safe)
          echo "Waiting for Kubernetes node to be Ready..."
          max_attempts=24
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if kubectl get nodes --no-headers 2>/dev/null | awk '{print $2}' | grep -q '^Ready$'; then
              echo "Kubernetes node is Ready"
              break
            fi
            echo "Attempt $attempt/$max_attempts: node not Ready yet; sleeping 10s"
            sleep 10
            attempt=$((attempt + 1))
          done

          if [ $attempt -gt $max_attempts ]; then
            echo "Nodes did not become Ready in expected time. Dumping logs for debugging:"
            kubectl get pods -A || true
            sudo journalctl -u k3s --no-pager -n 200 || true
            kubectl describe nodes || true
            exit 1
          fi

          # Final sanity checks
          kubectl cluster-info || true
          kubectl get nodes -o wide || true

      - name: Configure k3s registry mirrors
        run: |
          sudo mkdir -p /etc/rancher/k3s
          sudo tee /etc/rancher/k3s/registries.yaml <<'EOF'
          mirrors:
            "docker.io":
              endpoint:
                - "https://mirror.gcr.io"
            "registry-1.docker.io":
              endpoint:
                - "https://mirror.gcr.io"
          EOF
          sudo systemctl restart k3s
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Install Flux in Kubernetes
        run: flux install --timeout=5m

      - name: Verify Flux installation
        run: |
          kubectl -n flux-system wait --for=condition=ready pod --all --timeout=5m
          kubectl -n flux-system get deploy
          kubectl get crds | grep -E "(fluxcd|toolkit)" || true
          kubectl get crd helmreleases.helm.toolkit.fluxcd.io || true

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.0/cert-manager.yaml
          kubectl -n cert-manager wait --for=condition=Available deployment --all --timeout=5m
          kubectl -n cert-manager wait --for=condition=ready pod --all --timeout=5m

      - name: Create test ClusterIssuer
        run: |
          kubectl apply -f - <<EOF
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt
          spec:
            selfSigned: {}
          EOF

      - name: Deploy 1password
        run: |
          kubectl create ns 1password || true
          kubectl create secret generic onepassword-secret --from-literal=token=${{ secrets.OP_TOKEN }} --namespace=1password || true

      - name: Setup GitRepository source
        run: |
          CURRENT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Using branch: $CURRENT_BRANCH"

          flux create source git flux-system \
            --url=${{ github.event.repository.html_url }} \
            --branch="${CURRENT_BRANCH}" \
            --interval=5m \
            --username=${GITHUB_ACTOR} \
            --password=${{ secrets.GITHUB_TOKEN }} \
            --ignore-paths="clusters/k3s-prod-test/flux-system/**" \
            --timeout=10m

          kubectl wait --for=condition=ready gitrepository/flux-system -n flux-system --timeout=10m

      - name: Deploy charts (HelmRepository sources)
        run: |
          flux create kustomization charts \
            --source=flux-system \
            --path=./clusters/k8s-vms-daniele/charts \
            --interval=5m \
            --prune=true \
            --timeout=10m \
            --wait

          flux create kustomization charts-test \
            --source=flux-system \
            --path=./clusters/k3s-prod-test/charts \
            --interval=5m \
            --prune=true \
            --timeout=10m \
            --wait || true

          kubectl -n flux-system wait kustomization/charts --for=condition=ready --timeout=10m

      - name: Create SOPS age secret and cluster-vars
        run: |
          kubectl create secret generic sops-age \
            --namespace=flux-system \
            --from-literal=age.agekey='${{ secrets.SOPS_AGE_KEY_K3S_PROD_TEST }}'

          flux create kustomization cluster-vars \
            --source=flux-system \
            --path=./clusters/k3s-prod-test/vars \
            --interval=1h \
            --prune=true \
            --decryption-provider=sops \
            --decryption-secret=sops-age \
            --wait --timeout=5m

          kubectl -n flux-system wait kustomization/cluster-vars --for=condition=ready --timeout=5m

      - name: Deploy 1password operator
        run: |
          flux create kustomization 1p-operator \
            --source=flux-system \
            --path=./clusters/k3s-prod-test/apps/1password/manifests \
            --interval=5m \
            --prune=true \
            --timeout=10m \
            --wait

          kubectl -n flux-system wait kustomization/1p-operator --for=condition=ready --timeout=10m

      - name: Deploy generic top-level cluster resources
        run: |
          set -euo pipefail

          # clusters/k8s-vms-daniele/kustomization.yaml's flat resources: list
          # is the real production entry point. Rather than hand-enumerating
          # each top-level resource here (which silently stops covering
          # anything added to that list later — see the
          # system-upgrade-controller gap this step closes), parse it and
          # apply everything not already handled by a dedicated step above.
          # Every current and plausible future entry of this kind carries its
          # own sourceRef pointing at the flux-system GitRepository this job
          # already created, so no per-resource CLI-flag reconstruction is
          # needed.
          CLUSTER=k8s-vms-daniele
          KUST_FILE="clusters/${CLUSTER}/kustomization.yaml"
          SKIP_LIST="apps.yaml charts.yaml cluster-vars.yaml flux-instance.yaml"

          RAW_LINES=$(sed -n '/^resources:/,/^[^ -]/p' "$KUST_FILE" | tr -d '\r' | grep -E '^[[:space:]]*-[[:space:]]' || true)
          RAW_COUNT=$(printf '%s\n' "$RAW_LINES" | grep -c . || true)

          if [ "$RAW_COUNT" -eq 0 ]; then
            echo "ERROR: found zero 'resources:' entries in $KUST_FILE — the resources: block format may have changed; update this parser, don't silently skip it"
            exit 1
          fi

          RESOURCES=()
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            if [[ "$LINE" =~ ^[[:space:]]*-[[:space:]]+([A-Za-z0-9._-]+\.ya?ml)[[:space:]]*$ ]]; then
              RESOURCES+=("${BASH_REMATCH[1]}")
            else
              echo "ERROR: could not parse a 'resources:' entry in $KUST_FILE: '$LINE'"
              echo "This step fails closed on any format it doesn't recognize — update the parser, don't ignore it."
              exit 1
            fi
          done <<< "$RAW_LINES"

          if [ "${#RESOURCES[@]}" -ne "$RAW_COUNT" ]; then
            echo "ERROR: parsed ${#RESOURCES[@]} resource entries but found $RAW_COUNT raw lines under resources: in $KUST_FILE"
            exit 1
          fi

          for RESOURCE in "${RESOURCES[@]}"; do
            SKIP=false
            for S in $SKIP_LIST; do
              [ "$RESOURCE" = "$S" ] && SKIP=true
            done
            if [ "$SKIP" = true ]; then
              echo "Skipping $RESOURCE (handled by a dedicated step, or — for cluster-vars.yaml — not yet supported by this workflow)"
              continue
            fi

            RESOURCE_PATH="clusters/${CLUSTER}/${RESOURCE}"
            if [ ! -f "$RESOURCE_PATH" ]; then
              echo "ERROR: resources entry '$RESOURCE' in $KUST_FILE does not resolve to exactly one existing file at $RESOURCE_PATH"
              exit 1
            fi

            # No interdependency exists among today's top-level extras
            # (system-upgrade-controller is the only one right now), so
            # sequential apply-then-wait is safe. If a future top-level
            # resource depends on another, that must be handled by explicit,
            # hand-reviewed ordering here — this loop does not resolve
            # dependency order.
            echo "=== Applying top-level resource: $RESOURCE ==="
            OBJ=$(kubectl apply -f "$RESOURCE_PATH" -o name)
            mapfile -t OBJS <<< "$OBJ"
            for O in "${OBJS[@]}"; do
              [ -z "$O" ] && continue
              echo "Waiting for $O to be ready"
              kubectl -n flux-system wait "$O" --for=condition=ready --timeout=5m
            done
          done

      - name: Deploy infra baseline and changed apps
        run: |
          set -euo pipefail
          echo "Apps to deploy: $DEPLOY_APPS"

          # EXCLUDED_APPS: apps that would otherwise resolve via the
          # k3s-prod-test mirror or the real clusters/k8s-vms-daniele/apps/$APP
          # fallback below, but reconciling them for real in this ephemeral
          # e2e cluster has a live external side-effect — not just
          # referencing a secret, but a controller that actually mutates
          # DNS, posts to Slack, ships telemetry under the real cluster
          # name, cordons a node, auto-issues a production TLS cert, or
          # decrypts real Ansible secrets against real Teleport infra.
          # Checked FIRST in the loop below, before both the mirror and
          # real-path branches — deliberately, so an excluded app can never
          # slip through either route. This array is also now the single
          # place these exclusions are visible and documented — it folds in
          # cloudflare/fluxcd, which used to be filtered out invisibly
          # upstream in detect-changes. Every entry MUST have a real,
          # verified reason. See clusters/CLAUDE.md and the
          # project_k8s_vms_e2e_ci_gap memory for the full per-app
          # rationale. Same shape as kubenuc's EXCLUDED_APPS (PR #1791).
          declare -A EXCLUDED_APPS=(
            [cloudflare]="real production tunnel token via CI's real OP_TOKEN — a throwaway PR pod would register as a live tunnel connector"
            [fluxcd]="real shared slack-url webhook — a real e2e run would post real Flux events into the real #infrastructure Slack channel"
            [system-upgrade-controller]="real upgrade.cattle.io Plan CRDs with cordon: true against real k3s versions — distinct from the safe top-level system-upgrade-controller.yaml Kustomization already applied generically earlier in this workflow; do not remove this exclusion just because that top-level one is safe"
            [external-dns]="real Cloudflare API token, policy: upsert-only, real txtOwnerId — reconciling would mutate real production DNS records"
            [falco]="real Slack webhook credentials via falcosidekick-credentials"
            [grafana-alloy]="real Grafana Cloud credentials — would ship real telemetry under the real k8s-vms-daniele cluster name"
            [awx]="real admin/secret-key credentials fetched via the awx-secrets child Kustomization that awx's own deploy.yaml applies (the backup CronJob's separate B2 credentials are NOT pulled in by this path, but that's not why this is excluded)"
            [awx-test]="disposable AWX 24.6.1 rehearsal instance for the AWX-to-Ascender migration procedure — real admin/secret-key credentials fetched via the awx-test-secrets child Kustomization, same exclusion reasoning as awx; stood up empty for now, may later be seeded from a copy of the real production AWX backup for an actual migration rehearsal"
            [semaphore]="its own manifest documents that the SOPS age key it imports can decrypt every ansible/*/host_vars/*.sops.yaml file, plus a live 1Password Connect token used by Ansible playbooks against real Teleport infra"
            [cert-manager]="letsencrypt ClusterIssuer is hardcoded to production ACME — its ingress-shim would auto-create real Certificate/Order objects for any already-reconciled Ingress carrying cert-manager.io/cluster-issuer: letsencrypt (fluxcd and semaphore both carry this annotation today; both are separately excluded, but a future app that isn't could combine with an included cert-manager)"
          )

          # semaphore-db has no k3s-prod-test mirror (always resolves via the
          # real-path fallback below) and its own deploy.yaml only
          # dependsOn: cloudnative-pg-operator — but the Cluster CR it
          # creates lives in namespace `semaphore`, which is a *separate*
          # root apps/kustomization.yaml entry (semaphore/namespace.yml)
          # that semaphore-db's own path never pulls in. Applying only
          # semaphore-db on a clean cluster fails: no namespace, and
          # cloudnative-pg-operator may not even be in this run's
          # DEPLOY_APPS. This is a small, explicit, hand-maintained static
          # rule for this one known chain — not a general dependency
          # resolution engine. If semaphore-db is ever added to a
          # kubenuc-test-style mirror, this block becomes unnecessary and
          # should be removed rather than left as silent dead code.
          if [[ " $DEPLOY_APPS " == *" semaphore-db "* ]]; then
            if [[ -v EXCLUDED_APPS[cloudnative-pg-operator] ]]; then
              echo "ERROR: semaphore-db needs cloudnative-pg-operator, but cloudnative-pg-operator is now in EXCLUDED_APPS — this hand-maintained prereq rule is stale, fix it before proceeding"
              exit 1
            fi
            echo "=== semaphore-db present — ensuring its prerequisites exist first ==="
            kubectl apply -f clusters/k8s-vms-daniele/apps/semaphore/namespace.yml
            kubectl apply -f clusters/k8s-vms-daniele/apps/cloudnative-pg-operator/deploy.yaml
            kubectl -n flux-system wait kustomization/cloudnative-pg-operator --for=condition=ready --timeout=15m
          fi

          for APP in $DEPLOY_APPS; do
            if [[ -v EXCLUDED_APPS[$APP] ]]; then
              echo "Skipping $APP — excluded: ${EXCLUDED_APPS[$APP]}"
              continue
            fi

            TEST_APP_PATH="clusters/k3s-prod-test/apps/$APP"
            if [ -d "$TEST_APP_PATH" ]; then
              echo "=== Creating kustomization for: $APP (k3s-prod-test mirror) ==="
              flux create kustomization "app-$APP" \
                --source=flux-system \
                --path="./$TEST_APP_PATH" \
                --interval=5m \
                --prune=true
              continue
            fi

            REAL_DEPLOY_PATH=""
            for CANDIDATE in "clusters/k8s-vms-daniele/apps/$APP/deploy.yaml" "clusters/k8s-vms-daniele/apps/$APP/deploy.yml"; do
              if [ -f "$CANDIDATE" ]; then
                REAL_DEPLOY_PATH="$CANDIDATE"
                break
              fi
            done

            if [ -n "$REAL_DEPLOY_PATH" ]; then
              # No dependsOn beyond `charts`/`cluster-vars` (both already
              # Ready by this point in the workflow) exists among today's
              # real-path fallback apps other than semaphore-db, which is
              # handled above before this loop starts. A future app that
              # dependsOn something else must be checked by hand before
              # relying on this fallback for it — this branch does not
              # resolve dependency order.
              echo "=== Applying $APP's real production Kustomization: $REAL_DEPLOY_PATH ==="
              kubectl apply -f "$REAL_DEPLOY_PATH"
              continue
            fi

            echo "ERROR: '$APP' is in DEPLOY_APPS but resolves to none of: a k3s-prod-test mirror ($TEST_APP_PATH), an EXCLUDED_APPS entry, or a real clusters/k8s-vms-daniele/apps/$APP/deploy.y*ml"
            echo "Fix this by adding a k3s-prod-test mirror, adding a documented EXCLUDED_APPS entry above, or checking for a typo in the app name."
            exit 1
          done

          # Wait for all created kustomizations to be ready
          echo "=== Waiting for kustomizations ==="
          kubectl -n flux-system wait kustomization --all --for=condition=ready --timeout=30m

          # Wait for all HelmReleases
          echo "=== Waiting for HelmReleases ==="
          kubectl get hr -A --no-headers 2>/dev/null | awk '{print $1, $2}' | while read ns name; do
            echo "Waiting for HR: $name in $ns"
            kubectl -n "$ns" wait hr "$name" --for=condition=ready --timeout=30m || true
          done

      # Purely informational — `flux get` exits non-zero when it finds zero
      # matching objects (confirmed live on the companion k3s-rabbit
      # workflow, which hit exactly this before `|| true` was added there).
      # k8s-vms-daniele has no INFRA_APPS baseline and a large
      # EXCLUDED_APPS set, so a PR touching only excluded apps deploys zero
      # real HelmReleases here — structurally the same exposure that broke
      # k3s-rabbit. A purely informational step shouldn't be able to fail
      # the job regardless.
      - name: Check resource deployment status
        run: |
          flux get kustomizations -A || true
          flux get helmreleases -A || true

      - name: Validate critical deployments
        run: |
          kubectl -n ingress-nginx get pods || true
          kubectl get ingress -A || true
          kubectl get certificates -A || true
          kubectl get sc || true

      - name: Check for failed reconciliations
        run: |
          kubectl get kustomizations -A -o json | jq -r '.items[] | select(.status.conditions[]? | select(.type=="Ready" and .status=="False")) | "\(.metadata.namespace)/\(.metadata.name)"' || true
          kubectl get helmreleases -A -o json | jq -r '.items[] | select(.status.conditions[]? | select(.type=="Ready" and .status=="False")) | "\(.metadata.namespace)/\(.metadata.name)"' || true

      - name: Debug failure
        if: failure()
        run: |
          flux get all -A
          kubectl get pods -A | grep -v Running || true
          kubectl get events -A --sort-by='.lastTimestamp' | tail -30 || true

      - name: Cleanup k3s
        if: always()
        run: |
          /usr/local/bin/k3s-uninstall.sh || true
          rm -rf ~/.kube/config || true
          sudo rm -rf /etc/rancher/k3s || true
          sudo rm -rf /var/lib/rancher/k3s || true
          sudo rm -rf /run/k3s || true
