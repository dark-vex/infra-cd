name: "TF Plan on a PR - Backblaze"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/backblaze/**'
  pull_request:
    paths:
      - 'terraform/backblaze/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-backblaze:
    name: "Terraform Diff - Backblaze B2 buckets"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/backblaze/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      # This stack consumes dark-vex/terraform-provider-b2, our fork of the
      # official Backblaze/b2 provider - the official provider has a
      # confirmed, reproducible bug (b2_bucket Read returns bucket_type/
      # default_server_side_encryption blank and an invalid
      # file_lock_configuration shape for bucket-restricted application
      # keys, root-caused to b2sdk's own bucket cache, see CODE-20/git
      # history) that isn't fixed upstream. Pinned via the same
      # checksum-verified filesystem_mirror pattern already used for
      # dark-vex/terraform-provider-virtfusion in terraform-hostbrr.yml -
      # see that workflow/terraform/CLAUDE.md for the full rationale
      # (never dev_overrides, never rebuilt-per-run).
      - name: Fetch pinned B2 provider fork release
        env:
          B2_PROVIDER_VERSION: "0.14.0-fix.1"
          B2_PROVIDER_LINUX_AMD64_SHA256: "ec2b2a91806d2d3f32bae0d810a7bc31fe514ed3b9edd361c169c57f34dc302b"
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/b2-mirror/registry.terraform.io/dark-vex/b2"
          mkdir -p "$MIRROR"
          ZIP="terraform-provider-b2_${B2_PROVIDER_VERSION}_linux_amd64.zip"
          curl -fsSL -o "$MIRROR/$ZIP" \
            "https://github.com/dark-vex/terraform-provider-b2/releases/download/v${B2_PROVIDER_VERSION}/${ZIP}"
          echo "${B2_PROVIDER_LINUX_AMD64_SHA256}  $MIRROR/$ZIP" | sha256sum -c -

      - name: Configure filesystem_mirror
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/terraformrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$RUNNER_TEMP/b2-mirror"
              include = ["registry.terraform.io/dark-vex/b2"]
            }
            direct {
              exclude = ["registry.terraform.io/dark-vex/b2"]
            }
          }
          EOF
          cat "$RUNNER_TEMP/terraformrc"
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraformrc" >> "$GITHUB_ENV"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # This stack manages a bucket whose real name must never appear in
      # public output (see terraform/CLAUDE.md's "Secrets provider by stack"
      # entry for terraform/backblaze/) - plan output is captured to a local
      # file instead of streaming into this job's own (public, self-hosted
      # runner) log, and only a resource-name-free summary line is surfaced
      # below and in the PR comment. A prior version of this workflow printed
      # full plan output directly and leaked a real (previously-purged)
      # bucket name from a sibling stack into public CI logs via computed
      # attributes (bucket_domain_name, id) that aren't schema-marked
      # sensitive even though the base `bucket` attribute is - see git
      # history for the incident. Review the full plan by running
      # `terraform plan` locally with your own credentials.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > plan.log 2>&1
          plan_exit=$?
          set -e

          summary=$(grep -E '^(Plan:|No changes)' plan.log | tail -1)
          if [ -z "$summary" ]; then
            # No backticks here - this string is later substituted into a JS
            # template literal in the github-script step below, and a raw
            # backtick would terminate that literal early.
            summary="Plan did not reach a resource-count summary line (it likely failed). Full output is intentionally not shown here or in this job's log - run terraform plan locally with your own credentials to see it."
          fi

          {
            echo "summary<<PLAN_SUMMARY_EOF"
            echo "$summary"
            echo "PLAN_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$plan_exit"
        continue-on-error: true
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_AWS }}'

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style') && comment.body.includes('backblaze')
            })

            const output = `#### [backblaze] Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            ${{ steps.plan.outputs.summary }}

            _Full plan output isn't posted here or printed in this job's log - this stack manages a bucket whose real name must not appear in public output. Run \`terraform plan\` locally with your own credentials to review the full diff._

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # CODE-20 NOTE: see the identical note in terraform-aws.yml - this
      # bucket holds live Nextcloud backup data, review the plan carefully
      # before this stack is first merged to main.
      #
      # Output is captured to a file rather than printed, for the same
      # real-bucket-name-in-public-log reason as the Plan step above.
      - name: Terraform Apply
        run: |
          set +e
          terraform apply -auto-approve \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > apply.log 2>&1
          apply_exit=$?
          set -e

          summary=$(grep -E '^Apply complete!' apply.log | tail -1)
          echo "${summary:-Apply did not reach a completion summary line (it likely failed). Full output is intentionally not shown here - run terraform locally with your own credentials to see it.}"
          exit "$apply_exit"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_AWS }}'
