name: apps-kustomization-check

on:
  pull_request:
    branches: [main]
    paths:
      - 'clusters/*/apps/**'
      - '.github/scripts/check_apps_kustomization.py'
      - '.github/workflows/validate-apps-kustomization.yml'
  push:
    branches: [main]
    paths:
      - 'clusters/*/apps/**'
      - '.github/scripts/check_apps_kustomization.py'
      - '.github/workflows/validate-apps-kustomization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: apps/kustomization.yaml orphan and stale-entry check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Check apps/kustomization.yaml
        run: python3 .github/scripts/check_apps_kustomization.py
        # Clusters are auto-discovered by the script (any clusters/*/apps/
        # with a kustomization.yaml/.yml) - kubenuc-test and k3s-prod-test
        # are structurally excluded since they're legacy classic-bootstrap
        # clusters with no such file at all.
