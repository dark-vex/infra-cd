name: apps-kustomization-check

on:
  pull_request:
    paths:
      - 'clusters/kubenuc/apps/**'
      - 'clusters/k8s-vms-daniele/apps/**'
      - 'clusters/k3s-rabbit/apps/**'
      - 'clusters/oc-ampere/apps/**'
      - '.github/scripts/check_apps_kustomization.py'
      - '.github/workflows/validate-apps-kustomization.yml'
  push:
    branches: [main]
    paths:
      - 'clusters/kubenuc/apps/**'
      - 'clusters/k8s-vms-daniele/apps/**'
      - 'clusters/k3s-rabbit/apps/**'
      - 'clusters/oc-ampere/apps/**'
      - '.github/scripts/check_apps_kustomization.py'
      - '.github/workflows/validate-apps-kustomization.yml'

permissions:
  contents: read

jobs:
  check:
    name: apps/kustomization.yaml orphan and stale-entry check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Check apps/kustomization.yaml (kubenuc, k8s-vms-daniele, k3s-rabbit, oc-ampere)
        run: python3 .github/scripts/check_apps_kustomization.py
        # kubenuc-test and k3s-prod-test are intentionally excluded - they're
        # legacy classic-bootstrap clusters with no apps/kustomization.yaml at
        # all (kustomize-controller auto-discovers all YAML recursively there).
