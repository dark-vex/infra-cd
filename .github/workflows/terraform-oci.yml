name: "TF Plan on a PR - OCI"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/oci/**'
      - 'terraform/modules/oci-instance/**'
  pull_request:
    paths:
      - 'terraform/oci/**'
      - 'terraform/modules/oci-instance/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-k8s-armchair:
    name: "Terraform Diff - OCI k8s-armchair"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/oci/k8s-armchair/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        # stdout is also saved to a file for the PR comment (too large for an env var).
        # pipefail keeps terraform's exit code; stderr is not saved.
        run: |
          set -o pipefail
          terraform plan -no-color -var 'onepassword_token=${{ secrets.OP_TOKEN }}' -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' | tee "$RUNNER_TEMP/plan.txt"
        continue-on-error: true

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // The plan comes from a file, not an env var (too large for one: "Argument
            // list too long"). GitHub caps a comment at 65536 chars, so keep the tail
            // (it holds the final "Plan:" summary) and point to the run log for the rest.
            const fs = require('fs')
            const planFile = `${process.env.RUNNER_TEMP}/plan.txt`
            let plan = 'terraform\n' + (fs.existsSync(planFile) ? fs.readFileSync(planFile, 'utf8') : '(no plan output captured)')
            const maxPlan = 55000
            if (plan.length > maxPlan) {
              plan = `terraform\n... (${plan.length - maxPlan} chars truncated, see the workflow run log for the full plan)\n` + plan.slice(-maxPlan)
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style') && comment.body.includes('oci-k8s-armchair')
            })

            const output = `#### [oci-k8s-armchair] Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${plan}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -var 'onepassword_token=${{ secrets.OP_TOKEN }}' -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}'

