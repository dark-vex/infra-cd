name: "TF Plan on a PR - Hostbrr"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/hostbrr/**'
  pull_request:
    paths:
      - 'terraform/hostbrr/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-hostbrr:
    name: "Terraform Diff - Hostbrr rmon-vpn"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/hostbrr/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Fetch pinned VirtFusion provider release
        env:
          VF_PROVIDER_VERSION: "1.1.0"
          VF_PROVIDER_LINUX_AMD64_SHA256: "2270de26ad20bd179c6c8b428d619befae55d01b752c56e993c0e4d010ca4da7"
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/vf-mirror/registry.terraform.io/dark-vex/virtfusion"
          mkdir -p "$MIRROR"
          ZIP="terraform-provider-virtfusion_${VF_PROVIDER_VERSION}_linux_amd64.zip"
          curl -fsSL -o "$MIRROR/$ZIP" \
            "https://github.com/dark-vex/terraform-provider-virtfusion/releases/download/v${VF_PROVIDER_VERSION}/${ZIP}"
          echo "${VF_PROVIDER_LINUX_AMD64_SHA256}  $MIRROR/$ZIP" | sha256sum -c -

      - name: Configure filesystem_mirror
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/terraformrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$RUNNER_TEMP/vf-mirror"
              include = ["registry.terraform.io/dark-vex/virtfusion"]
            }
            direct {
              exclude = ["registry.terraform.io/dark-vex/virtfusion"]
            }
          }
          EOF
          cat "$RUNNER_TEMP/terraformrc"
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraformrc" >> "$GITHUB_ENV"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -var 'onepassword_token=${{ secrets.OP_TOKEN }}' -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}'
        continue-on-error: true
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style') && comment.body.includes('hostbrr')
            })

            const output = `#### [hostbrr] Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -var 'onepassword_token=${{ secrets.OP_TOKEN }}' -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
