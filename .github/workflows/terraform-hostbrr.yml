name: "TF Plan on a PR - Hostbrr"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/hostbrr/**'
  pull_request:
    paths:
      - 'terraform/hostbrr/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-hostbrr:
    name: "Terraform Diff - Hostbrr rmon-vpn"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/hostbrr/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Fetch pinned VirtFusion provider release
        env:
          VF_PROVIDER_VERSION: "1.1.0"
          VF_PROVIDER_LINUX_AMD64_SHA256: "2270de26ad20bd179c6c8b428d619befae55d01b752c56e993c0e4d010ca4da7"
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/vf-mirror/registry.terraform.io/dark-vex/virtfusion"
          mkdir -p "$MIRROR"
          ZIP="terraform-provider-virtfusion_${VF_PROVIDER_VERSION}_linux_amd64.zip"
          curl -fsSL -o "$MIRROR/$ZIP" \
            "https://github.com/dark-vex/terraform-provider-virtfusion/releases/download/v${VF_PROVIDER_VERSION}/${ZIP}"
          echo "${VF_PROVIDER_LINUX_AMD64_SHA256}  $MIRROR/$ZIP" | sha256sum -c -

      - name: Configure filesystem_mirror
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/terraformrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$RUNNER_TEMP/vf-mirror"
              include = ["registry.terraform.io/dark-vex/virtfusion"]
            }
            direct {
              exclude = ["registry.terraform.io/dark-vex/virtfusion"]
            }
          }
          EOF
          cat "$RUNNER_TEMP/terraformrc"
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraformrc" >> "$GITHUB_ENV"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # rmon-vpn's real hostname, public IPv4/IPv6, and MAC address are
      # computed attributes that show up in full plan output - this repo's
      # CLAUDE.md treats hostnames/FQDNs as sensitive regardless of whether
      # they look like "just configuration", and this repo is public. Plan
      # output is captured to a local file, then field-redacted (only the
      # hostname/address/gateway/netmask/subnet/mac values, plus bare
      # colon-and-hex-only quoted lines for the IPv6 address list, are
      # masked - everything else, including resource structure and every
      # other attribute, stays visible for review) before being surfaced in
      # the PR comment. A first version of this workflow printed full
      # unredacted plan output directly and leaked rmon-vpn's real
      # hostname/IPs/MAC into a public PR comment and CI log - see git
      # history for the incident. This redaction list is specific to
      # virtfusion_server's current schema - if the provider ever gains new
      # network-identifying attributes, update the sed patterns below. The
      # durable fix (marking these Sensitive in the provider schema itself)
      # is a follow-up against dark-vex/terraform-provider-virtfusion, not
      # yet done.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > plan.log 2>&1
          plan_exit=$?
          set -e

          summary=$(grep -E '^(Plan:|No changes)' plan.log | tail -1)
          if [ -z "$summary" ]; then
            # No backticks here - this string is later substituted into a JS
            # template literal in the github-script step below, and a raw
            # backtick would terminate that literal early.
            summary="Plan did not reach a resource-count summary line (it likely failed). Full output is intentionally not shown here or in this job's log - run terraform plan locally with your own credentials to see it."
          fi

          sed -E \
            -e 's/^([[:space:]]*hostname[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*address[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*gateway[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*netmask[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*subnet[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*mac[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*)"[0-9A-Fa-f:]+",?[[:space:]]*$/\1"<redacted>",/' \
            plan.log > plan.redacted.log

          {
            echo "summary<<PLAN_SUMMARY_EOF"
            echo "$summary"
            echo "PLAN_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "redacted<<PLAN_REDACTED_EOF"
            cat plan.redacted.log
            echo "PLAN_REDACTED_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$plan_exit"
        continue-on-error: true
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style') && comment.body.includes('hostbrr')
            })

            const output = `#### [hostbrr] Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            ${{ steps.plan.outputs.summary }}

            <details><summary>Show Plan (hostname/IPs/MAC redacted)</summary>

            \`\`\`\n
            ${{ steps.plan.outputs.redacted }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Output captured to a file and field-redacted before being printed,
      # same reasoning and same sed patterns as the Plan step above.
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set +e
          terraform apply -auto-approve \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > apply.log 2>&1
          apply_exit=$?
          set -e

          summary=$(grep -E '^Apply complete!' apply.log | tail -1)
          echo "${summary:-Apply did not reach a completion summary line (it likely failed). Run terraform locally with your own credentials for the raw error.}"

          sed -E \
            -e 's/^([[:space:]]*hostname[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*address[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*gateway[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*netmask[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*subnet[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*mac[[:space:]]*=[[:space:]]*")[^"]*(")/\1<redacted>\2/' \
            -e 's/^([[:space:]]*)"[0-9A-Fa-f:]+",?[[:space:]]*$/\1"<redacted>",/' \
            apply.log

          exit "$apply_exit"
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
