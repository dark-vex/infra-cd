name: build-awx-ee

# Builds the AWX execution environment (awx-ee/), smoke-tests it, and on main
# pushes it to GHCR. Registered in AWX by ansible/awx-zabbix-bootstrap, by digest.
#
# The GHCR package is created PRIVATE on first push. Make it public once
# (Package settings -> Change visibility; nothing secret is in the image) - the
# "anonymous pull" step below fails until you do, on purpose, so AWX is never
# pointed at an image it cannot pull.

on:
  pull_request:
    branches: [main]
    paths:
      - 'awx-ee/**'
      - 'ansible/zabbix-hosts/netbox.yml'
      - '.github/workflows/build-awx-ee.yml'
  push:
    branches: [main]
    paths:
      - 'awx-ee/**'
      - 'ansible/zabbix-hosts/netbox.yml'
      - '.github/workflows/build-awx-ee.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dark-vex/infra-cd-ee

jobs:
  # Read-only: runs for pull requests (whose code - requirements-build.txt, the EE
  # definition - must never get a token that can push) and for pushes.
  test:
    name: build and smoke-test infra-cd-ee
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install ansible-builder (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r awx-ee/requirements-build.txt

      - name: Build the image
        working-directory: awx-ee
        run: |
          "$RUNNER_TEMP/venv/bin/ansible-builder" build --container-runtime docker \
            -f execution-environment.yml -t infra-cd-ee:ci -v2

      - name: Smoke test
        run: |
          docker run --rm \
            -v "$PWD/awx-ee/smoke-test.sh:/smoke/smoke-test.sh:ro" \
            -v "$PWD/awx-ee/netbox-stub.py:/smoke/netbox-stub.py:ro" \
            -v "$PWD/ansible/zabbix-hosts/netbox.yml:/smoke/netbox.yml:ro" \
            --entrypoint sh infra-cd-ee:ci /smoke/smoke-test.sh

  # The only job with a token that can push, and it never runs for a pull request.
  # It builds and smoke-tests again before pushing, so the image it pushes is the one
  # it tested (not the one the read-only job built).
  publish:
    name: push infra-cd-ee to GHCR
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install ansible-builder (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r awx-ee/requirements-build.txt

      - name: Build the image
        working-directory: awx-ee
        run: |
          "$RUNNER_TEMP/venv/bin/ansible-builder" build --container-runtime docker \
            -f execution-environment.yml -t infra-cd-ee:ci -v2

      - name: Smoke test
        run: |
          docker run --rm \
            -v "$PWD/awx-ee/smoke-test.sh:/smoke/smoke-test.sh:ro" \
            -v "$PWD/awx-ee/netbox-stub.py:/smoke/netbox-stub.py:ro" \
            -v "$PWD/ansible/zabbix-hosts/netbox.yml:/smoke/netbox.yml:ro" \
            --entrypoint sh infra-cd-ee:ci /smoke/smoke-test.sh

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        id: push
        run: |
          docker tag infra-cd-ee:ci "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          # Pick the digest of the GHCR name, not index 0: on the ubuntu-26.04 runner image
          # RepoDigests lists the local name first, and a digest without the registry host
          # makes the anonymous pull below look on Docker Hub.
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:sha-${GITHUB_SHA::12}" | grep -F "$IMAGE@" | head -n 1 || true)
          test -n "$digest" || { echo "::error::no RepoDigest for $IMAGE after the push"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Anonymous pull (the package must be public)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker image rm -f "$DIGEST" "$IMAGE:sha-${GITHUB_SHA::12}" >/dev/null 2>&1 || true
          docker pull "$DIGEST" || { echo "::error::anonymous pull failed - make the GHCR package public, then re-run this job"; exit 1; }
