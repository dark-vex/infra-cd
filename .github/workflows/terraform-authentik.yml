name: "TF Plan on a PR - Authentik"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/authentik/**'
  pull_request:
    paths:
      - 'terraform/authentik/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-authentik:
    name: "Terraform Diff - Authentik SSO"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/authentik/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # This stack manages Authentik objects whose redirect/issuer URL
      # attributes carry real FQDNs once the import PRs land - plan output is
      # captured to a local file instead of streaming into this job's own
      # (public, self-hosted runner) log, and only a resource-count summary
      # line is surfaced below and in the PR comment (same pattern as
      # terraform-auth0.yml). Review the full plan by running `terraform plan`
      # locally with your own credentials.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > plan.log 2>&1
          plan_exit=$?
          set -e

          summary=$(grep -E '^(Plan:|No changes)' plan.log | tail -1)
          if [ -z "$summary" ]; then
            # No backticks here - this string is later substituted into a JS
            # template literal in the github-script step below, and a raw
            # backtick would terminate that literal early.
            summary="Plan did not reach a resource-count summary line (it likely failed). Full output is intentionally not shown here or in this job's log - run terraform plan locally with your own credentials to see it."
          fi

          {
            echo "summary<<PLAN_SUMMARY_EOF"
            echo "$summary"
            echo "PLAN_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$plan_exit"
        continue-on-error: true
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_AUTHENTIK }}'

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style') && comment.body.includes('authentik')
            })

            const output = `#### [authentik] Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            ${{ steps.plan.outputs.summary }}

            _Full plan output isn't posted here or printed in this job's log - this stack manages Authentik resources whose URL attributes must not appear in public output. A reviewer who needs to see the actual diff pulls it from this job's captured local log or runs \`terraform plan\` themselves._

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Per the staged adoption plan in terraform/CLAUDE.md, every import PR
      # must show a verified imports-only plan before merge - this manages a
      # live, in-use IdP. Output is captured to a file for the same
      # FQDN-in-public-log reason as the Plan step above.
      - name: Terraform Apply
        run: |
          set +e
          terraform apply -auto-approve \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > apply.log 2>&1
          apply_exit=$?
          set -e

          summary=$(grep -E '^Apply complete!' apply.log | tail -1)
          echo "${summary:-Apply did not reach a completion summary line (it likely failed). Full output is intentionally not shown here - run terraform locally with your own credentials to see it.}"
          exit "$apply_exit"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_AUTHENTIK }}'
