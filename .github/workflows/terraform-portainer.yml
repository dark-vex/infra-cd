name: "TF Plan on a PR - Portainer"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/portainer/**'
  pull_request:
    paths:
      - 'terraform/portainer/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-portainer:
    name: "Terraform Diff - Portainer"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/portainer/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # This stack manages Portainer objects (environments, registries,
      # settings) whose URL attributes carry real FQDNs and whose secret
      # fields could surface in plan output (see terraform/CLAUDE.md's
      # "Secrets provider by stack" entry for terraform/portainer/) - plan output is captured to a local file
      # instead of streaming into this job's own (public, self-hosted
      # runner) log, and only a resource-count summary line is surfaced below
      # and in the PR comment, same pattern as terraform/aws/'s bucket-name
      # leak fix. A SOPS-sourced value is auto-marked sensitive and redacts
      # itself in plan output, but a literal FQDN that slipped past SOPS
      # routing would print in full - this capture is the backstop for that,
      # not a substitute for reviewing generated resource bodies before they
      # land. Review the full plan by running `terraform plan` locally with
      # your own credentials.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > plan.log 2>&1
          plan_exit=$?
          set -e

          summary=$(grep -E '^(Plan:|No changes)' plan.log | tail -1)
          if [ -z "$summary" ]; then
            # No backticks here - this string is later substituted into a JS
            # template literal in the github-script step below, and a raw
            # backtick would terminate that literal early.
            summary="Plan did not reach a resource-count summary line (it likely failed). Full output is intentionally not shown here or in this job's log - run terraform plan locally with your own credentials to see it."
          fi

          {
            echo "summary<<PLAN_SUMMARY_EOF"
            echo "$summary"
            echo "PLAN_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$plan_exit"
        continue-on-error: true
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_PORTAINER }}'

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style') && comment.body.includes('portainer')
            })

            const output = `#### [portainer] Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            ${{ steps.plan.outputs.summary }}

            _Full plan output isn't posted here or printed in this job's log - this stack manages Portainer resources whose URL attributes must not appear in public output. A reviewer who needs to see the actual diff pulls it from this job's captured local log or runs \`terraform plan\` themselves._

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Apply-on-main is deliberately present here to match every other
      # stack's CI pattern, but per the staged adoption plan in
      # terraform/CLAUDE.md, this stack should show a verified zero-diff
      # plan (imports only, zero add/change/destroy) before every merge to
      # main - this manages a live, in-use Portainer instance, not a
      # greenfield one.
      #
      # Output is captured to a file rather than printed, for the same
      # FQDN-in-public-log reason as the Plan step above.
      - name: Terraform Apply
        run: |
          set +e
          terraform apply -auto-approve \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > apply.log 2>&1
          apply_exit=$?
          set -e

          summary=$(grep -E '^Apply complete!' apply.log | tail -1)
          echo "${summary:-Apply did not reach a completion summary line (it likely failed). Full output is intentionally not shown here - run terraform locally with your own credentials to see it.}"
          exit "$apply_exit"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_PORTAINER }}'

      # Post-apply drift gate: a clean apply must leave an empty plan
      # (-detailed-exitcode: 0 = clean, 2 = drift remains, 1 = error).
      # Captured, counts-only, for the same reason as the steps above.
      - name: Terraform Post-Apply Drift Check
        run: |
          set +e
          terraform plan -no-color -input=false -detailed-exitcode \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > drift.log 2>&1
          drift_exit=$?
          set -e

          grep -E '^(Plan:|No changes)' drift.log | tail -1 || true
          if [ "$drift_exit" -ne 0 ]; then
            echo "Post-apply plan is not clean (exit $drift_exit). Run terraform plan locally with your own credentials."
          fi
          exit "$drift_exit"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_PORTAINER }}'
