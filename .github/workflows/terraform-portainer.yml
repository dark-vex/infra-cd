name: "TF Plan on a PR - Portainer"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/portainer/**'
      - '.github/workflows/terraform-portainer.yml'
  pull_request:
    paths:
      - 'terraform/portainer/**'
      - '.github/workflows/terraform-portainer.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-portainer:
    name: "Terraform Diff - Portainer"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/portainer/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # This stack manages Portainer objects (environments, registries,
      # settings) whose URL attributes carry real FQDNs and whose secret
      # fields could surface in plan output (see terraform/CLAUDE.md's
      # "Secrets provider by stack" entry for terraform/portainer/) - plan output is captured to a local file
      # instead of streaming into this job's own (public, self-hosted
      # runner) log, and only a resource-count summary line is surfaced below
      # and in the PR comment, same pattern as terraform/aws/'s bucket-name
      # leak fix. A SOPS-sourced value is auto-marked sensitive and redacts
      # itself in plan output, but a literal FQDN that slipped past SOPS
      # routing would print in full - this capture is the backstop for that,
      # not a substitute for reviewing generated resource bodies before they
      # land. Review the full plan by running `terraform plan` locally with
      # your own credentials.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > plan.log 2>&1
          plan_exit=$?
          set -e

          summary=$(grep -E '^(Plan:|No changes)' plan.log | tail -1)
          if [ -z "$summary" ]; then
            # No backticks here - this string is later substituted into a JS
            # template literal in the github-script step below, and a raw
            # backtick would terminate that literal early.
            summary="Plan did not reach a resource-count summary line (it likely failed). Full output is intentionally not shown here or in this job's log - run terraform plan locally with your own credentials to see it."
          fi

          {
            echo "summary<<PLAN_SUMMARY_EOF"
            echo "$summary"
            echo "PLAN_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$plan_exit"
        continue-on-error: true
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_PORTAINER }}'

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style') && comment.body.includes('portainer')
            })

            const output = `#### [portainer] Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            ${{ steps.plan.outputs.summary }}

            _Full plan output isn't posted here or printed in this job's log - this stack manages Portainer resources whose URL attributes must not appear in public output. A reviewer who needs to see the actual diff pulls it from this job's captured local log or runs \`terraform plan\` themselves._

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Apply-on-main is deliberately present here to match every other
      # stack's CI pattern, but per the staged adoption plan in
      # terraform/CLAUDE.md, this stack should show a verified zero-diff
      # plan (imports only, zero add/change/destroy) before every merge to
      # main - this manages a live, in-use Portainer instance, not a
      # greenfield one.
      #
      # Output is captured to a file rather than printed, for the same
      # FQDN-in-public-log reason as the Plan step above.
      - name: Terraform Apply
        run: |
          set +e
          terraform apply -auto-approve \
            -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
            -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
            > apply.log 2>&1
          apply_exit=$?
          set -e

          summary=$(grep -E '^Apply complete!' apply.log | tail -1)
          echo "${summary:-Apply did not reach a completion summary line (it likely failed). Full output is intentionally not shown here - run terraform locally with your own credentials to see it.}"
          exit "$apply_exit"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_PORTAINER }}'

      # Post-apply drift gate: a clean apply must leave an empty plan. The plan
      # exit code alone cannot be trusted here (it has been 0 while changes were
      # listed), so the gate also reads the planned changes from the plan JSON.
      # Portainer can take a few seconds to settle after creating a stack, so a
      # non-empty result is re-checked once after a pause and only a drift that
      # persists fails the job. Captured and counts-only for the same reason as
      # the steps above: only resource addresses and attribute names are printed.
      - name: Terraform Post-Apply Drift Check
        run: |
          drift_check() {
            set +e
            terraform plan -no-color -input=false -detailed-exitcode \
              -var 'onepassword_token=${{ secrets.OP_TOKEN }}' \
              -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' \
              -out=drift.tfplan \
              > drift.log 2>&1
            drift_exit=$?
            set -e

            grep -E '^(Plan:|No changes)' drift.log | tail -1 || true
            echo "Plan exit code: $drift_exit"
            changes=""
            if [ "$drift_exit" -ne 1 ]; then
              if command -v jq > /dev/null; then
                changes=$(terraform show -json drift.tfplan 2> /dev/null | jq -r '
                  .resource_changes[]?
                  | select(.change.actions != ["no-op"])
                  | (.change.before // {}) as $b
                  | (.change.after // {}) as $a
                  | (.change.after_unknown // {}) as $u
                  | "\(.address) \(.change.actions | join("+")): " +
                    ([ ($a | keys[]) as $k
                       | select(($b[$k] != $a[$k]) or ($u[$k] == true))
                       | $k ] | join(", "))' 2> /dev/null || true)
              fi
              if [ -z "$changes" ] && [ "$drift_exit" -eq 2 ]; then
                changes="(the plan reports changes; attribute names are unavailable)"
              fi
            fi
            rm -f drift.tfplan
          }

          drift_check
          if [ "$drift_exit" -eq 1 ]; then
            echo "Post-apply plan failed (exit 1). Run terraform plan locally with your own credentials."
            exit 1
          fi
          if [ -n "$changes" ]; then
            echo "Drifting resources and attribute names only (no values):"
            echo "$changes"
            echo "Re-checking once in ${DRIFT_RECHECK_SECONDS:-30}s in case Portainer was still settling."
            sleep "${DRIFT_RECHECK_SECONDS:-30}"
            drift_check
            if [ "$drift_exit" -eq 1 ]; then
              echo "Post-apply re-check failed (exit 1). Run terraform plan locally with your own credentials."
              exit 1
            fi
            if [ -n "$changes" ]; then
              echo "Drift persists after the re-check:"
              echo "$changes"
              echo "Post-apply plan is not clean. Run terraform plan locally with your own credentials."
              exit 1
            fi
            echo "Drift cleared on the re-check."
          fi
          echo "Post-apply plan is clean."
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_PORTAINER }}'
