name: "TF Grafana Dashboards"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/grafana/**'
  pull_request:
    paths:
      - 'terraform/grafana/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Diff"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/grafana/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dashboard Generator Drift Check
        # generate_dashboards.py's own header says the dashboards/ JSONs are
        # "auto-generated — never hand-edit". Hand-editing one anyway (as
        # happened silently to dashboards/kubenuc/postgresql.json in #1542)
        # goes undetected until someone else re-runs the generator for an
        # unrelated reason and clobbers the hand-added content (#1836/#1837).
        # This fails CI instead, before Terraform ever sees the drifted file.
        run: |
          python3 generate_dashboards.py
          git diff --exit-code dashboards/

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          terraform plan -no-color -var 'onepassword_token=${{ secrets.OP_TOKEN }}' -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}' | tee plan_output.txt
        continue-on-error: true

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // The plan can be large (a wave of new dashboards adds hundreds of
            // JSON lines per resource). Read it from disk instead of an env
            // var, since that goes through the runner's process environment,
            // which has a much lower size ceiling than a file and previously
            // hit "Argument list too long" spawning node for this very step.
            // GitHub comment bodies also cap out at 65536 characters, so
            // truncate with headroom for the rest of the comment's markdown.
            const fs = require('fs')
            const path = require('path')
            let planText
            try {
              planText = fs.readFileSync(path.join('terraform', 'grafana', 'plan_output.txt'), 'utf8')
            } catch (e) {
              planText = '(plan output file not found: ' + e.message + ')'
            }
            const MAX_PLAN_CHARS = 60000
            if (planText.length > MAX_PLAN_CHARS) {
              planText = planText.slice(-MAX_PLAN_CHARS) +
                '\n\n... (plan truncated — showing the last ' + MAX_PLAN_CHARS + ' characters; see the workflow run logs for the full output)'
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style')
            })

            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${planText}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`terraform/grafana\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -var 'onepassword_token=${{ secrets.OP_TOKEN }}' -var 'onepassword_endpoint=${{ secrets.OP_ENDPOINT }}'
