name: "TF Plan on a PR (BIO)"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/proxmox/gozzi-hpelvisor/**'
  pull_request:
    paths:
      - 'terraform/proxmox/gozzi-hpelvisor/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-proxmox:
    name: "Terraform Diff (Proxmox)"
    runs-on: LGU
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: terraform-prod
    defaults:
      run:
        working-directory: terraform/proxmox/gozzi-hpelvisor/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Create Pub key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.PUB_KEY }}" > ~/.ssh/id_rsa.pub

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # This stack manages live VM disks/network config (see the CODE-29/#2042
      # incident - a prior version of this workflow leaked a decommissioned
      # VM's IP/MAC/network config into a public PR comment and this job's
      # own public log). Plan output is captured to a local file instead,
      # and only a resource-count summary line is surfaced below and in the
      # PR comment. Review the full plan by running `terraform plan` locally
      # with your own credentials.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -var onepassword_token=$OP_TOKEN -var onepassword_endpoint=$OP_ENDPOINT > plan.log 2>&1
          plan_exit=$?
          set -e

          summary=$(grep -E '^(Plan:|No changes)' plan.log | tail -1)
          if [ -z "$summary" ]; then
            # No backticks here - this string is later substituted into a JS
            # template literal in the github-script step below, and a raw
            # backtick would terminate that literal early.
            summary="Plan did not reach a resource-count summary line (it likely failed). Full output is intentionally not shown here or in this job's log - run terraform plan locally with your own credentials to see it."
          fi

          {
            echo "summary<<PLAN_SUMMARY_EOF"
            echo "$summary"
            echo "PLAN_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$plan_exit"
        continue-on-error: true
        env:
          OP_TOKEN: '${{ secrets.OP_TOKEN }}'
          OP_ENDPOINT: '${{ secrets.OP_ENDPOINT }}'
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_BIO }}'

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style (Proxmox BIO)')
            })

            // 2. Prepare format of the comment
            const output = `#### Terraform Format and Style (Proxmox BIO) 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            ${{ steps.plan.outputs.summary }}

            _Full plan output isn't posted here or printed in this job's log - this stack manages live VM disk/network config. Run \`terraform plan\` locally with your own credentials to review the full diff._

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.tf_actions_working_dir }}\`, Workflow: \`${{ github.workflow }}\`*`;

            // 3. If we have a comment, update it, otherwise create a new one
            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set +e
          terraform apply -auto-approve -var onepassword_token=$OP_TOKEN -var onepassword_endpoint=$OP_ENDPOINT > apply.log 2>&1
          apply_exit=$?
          set -e

          summary=$(grep -E '^Apply complete!' apply.log | tail -1)
          echo "${summary:-Apply did not reach a completion summary line (it likely failed). Full output is intentionally not shown here - run terraform locally with your own credentials to see it.}"
          exit "$apply_exit"
        env:
          OP_TOKEN: '${{ secrets.OP_TOKEN }}'
          OP_ENDPOINT: '${{ secrets.OP_ENDPOINT }}'
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY_BIO }}'

      - name: Cleanup SSH public key
        if: always()
        run: rm -f ~/.ssh/id_rsa.pub
