# CI-only placeholder for the kubenuc grafana-alloy HelmRelease's
# valuesFrom lookup (clusters/kubenuc/apps/grafana-alloy/manifests/release.yml).
# Overwrites the real OnePasswordItem manifest in the ephemeral runner
# workspace only - never committed. Without this, flate's offline render
# hard-fails: the chart requires destinations.*.auth.username/password to
# be non-empty strings, and there's no live 1Password secret to source them
# from offline.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: grafana-alloy
stringData:
  password: ci-placeholder-password
  metrics-username: ci-placeholder-user
  logs-username: ci-placeholder-user
  otlp-username: ci-placeholder-user
