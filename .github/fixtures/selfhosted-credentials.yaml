# CI-only placeholder for the grafana-alloy HelmRelease's valuesFrom lookup of
# the self-hosted backend credentials (selfHostedMetrics/selfHostedLogs
# destinations). Overwrites the real OnePasswordItem manifest in the ephemeral
# runner workspace only - never committed. Without it flate's offline render
# fails: the chart requires non-empty destinations.*.auth.username/password.
apiVersion: v1
kind: Secret
metadata:
  name: selfhosted-credentials
  namespace: grafana-alloy
stringData:
  username: ci-placeholder-user
  password: ci-placeholder-password
